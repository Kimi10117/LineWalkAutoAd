name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.2 (修復抽抽樂50抽冷卻卡死、精準推進免費抽1次、嚴格防呆絕不點5張 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.2 (Run #${{ github.run_number }})**
              1. **【徹底修復「抽抽樂」50抽後冷卻卡死、正確點擊免費抽1次】**：
                 - **解決問題**：使用者點擊 50 抽後，左側的 BIG 抽抽樂按鈕會進入倒數冷卻（顯示「回復還需 00:58:xx」）。先前程式因未檢查冷卻倒數文字，且 2D 紅色聚類誤將按鈕上方的紅色抽獎箱（BIG BOX）判定為按鈕，導致 50 抽點完後持續誤點冷卻中的箱子與按鈕，無限卡在「等待彈窗」而無法進行下一步！
                 - **新增 50 抽冷卻偵測與抽獎箱誤判隔離**：
                   1. 強制檢查左側區域是否出現「回復還需」、「還需」、「回復」、「\d\d:\d\d」或「剩0次」，一旦冷卻立即跳過 50 抽。
                   2. 收緊 50 抽紅色按鈕搜尋高度（`y in 0.44f..0.54f`），徹底排除上方 `y < 0.44f` 的紅色抽獎箱本體。
                 - **順暢執行「免費抽 1 次」**：
                   50 抽冷卻後，立即精準鎖定右側的黃色膠囊按鈕「▶ 免費抽 1 次」看廣告抽獎。
                 - **嚴格防呆規則**：
                   維持最高防呆標準，**絕對不點擊「5張 抽1次」**！
                 - **支援中央領獎完成彈窗（獲得金幣！）即時關閉**：
                   在等待彈窗流程中加入中央領獎完成彈窗檢查，一旦彈出立即點擊 [關閉] 繼續巡邏。
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
