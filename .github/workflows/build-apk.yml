name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.9 (修正點擊開始無反應問題、分頁純黑指示條100%精準辨識、懸浮窗底層完全穿透 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.9 (Run #${{ github.run_number }})**
            1. **【徹底修復「點擊開始跑1234步驟但散步趣App無反應」問題】**：
               - **黑色指示條 100% 絕對分頁辨識**：
                 發現 LINE 散步趣當前選取中的分頁底部具備高對比度的純黑選取指示粗線 (`y ≈ 14.4%`)。升級 `detectActiveMainTabIndex` 為純黑底線偵測器，直接以 25% 分頁寬度精準鎖定選中分頁，徹底淘汰舊版因文字灰階色彩誤判或回傳 null 的缺陷。
               - **嚴禁狀態機記憶體盲目推進分頁**：
                 修復前版在切換分頁時將 `currentTab = nextTab` 盲目寫入記憶體的重大 Bug。現在切換分頁後，狀態機必須在畫面上真正捕捉到目標分頁啟用，才會開始檢查任務；若未切換成功則自動重試點擊，徹底杜絕「在記憶體中快速跳過 1➔2➔3➔4 但畫面根本沒動」的假完成現象！
               - **懸浮窗實體穿透修復 (`FLAG_NOT_TOUCHABLE`)**：
                 修復懸浮控制窗在執行穿透點擊時，僅改變 View 可見度而未更新 WindowManager 旗標，導致手勢仍被懸浮窗體攔截的系統問題。現已在穿透時即時套用 `FLAG_NOT_TOUCHABLE`，確保無障礙手勢 100% 直達散步趣遊戲！
               - **無障礙點擊手勢路徑補強**：
                 `performClick` 補充 `lineTo` 終點座標，杜絕部分 Android 廠商 ROM（如小米/HyperOS/三星）因單點路徑長度為 0 而取消手勢的問題。
            2. **【徹底杜絕彈窗誤入「3.廣告監控」與關閉按鈕誤判】**：
               - 在 `TRIGGER_AD_POPUP` 與幾何 X 偵測器中，嚴格排除彈窗右上角關閉按鈕 (`x > 75%, y in 8.8%..16%`)，確保【任務】（特別/每日/每週）、【每日賓果】與【好友排行榜】正常運作，不再被誤判為全螢幕廣告。
            3. **【好友送禮按鈕全面支援三角形播放圖示】**：
               - 送禮彈窗辨識加入「▶」播放三角形與「看廣告」關鍵字支援。
            4. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
