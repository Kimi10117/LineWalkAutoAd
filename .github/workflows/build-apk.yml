name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.28 (徹底廢除影片中途隨機點擊、遵守等略過出現再點原則、全域防誤觸頂部Discord通知、秒速順暢領取金幣 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.28 (Run #${{ github.run_number }})**
              1. **【重大修復：徹底廢除影片播放中途盲目點擊，落實「等略過/關閉出現再點」黃金原則】**：
                 - **根本原因定位**：先前版本中的幾何亮度特徵偵測器（`detectCornerSkipButton`）於影片開播第 4 秒即啟動，在動態影音廣告（如遊戲試玩、酷炫動畫）播放中，將畫面每一幀隨機閃爍的白光、文字或特效誤判為「略過鈕(▶|)」，每 2 秒瘋狂點擊影片畫面，直接觸發廣告商跳轉連結，導致不斷跳轉進入 Google Play 商店（`com.android.vending`）高達 10 餘次！
                 - **徹底治本**：徹底廢除 `detectCornerSkipButton` 幾何亮度猜測器，全面禁止在影片播放中途隨機點擊畫面。
                 - **嚴格三大真實關閉依據**：
                   1. 廣告 SDK 官方無障礙節點（Node，如 Google AdMob / Unity `Close Ad`、`Skip Ad`）。
                   2. 明確 OCR 關鍵字（「略過廣告」、「跳過廣告」、「Skip Ad」、「>>」等真實文字）。
                   3. 明確倒數計時（「還有 15 秒」）：只要倒數計時仍大於 1 秒且未獲獎勵，助手嚴格保持靜候播放，絕不碰觸螢幕！
                 - **盲點大幅後移防卡死**：螢幕角落盲點嚴格延遲至 **38 秒以上**（非 22 秒），嚴禁在廣告播放前 35 秒進行任何盲點；幾何 X 偵測嚴格延遲至 15 秒以上。
              2. **【重大防護：全域嚴格防誤觸頂部通知（Discord / LINE 懸浮通知）】**：
                 - 先前防護禁區僅攔截中央區域（`18%..82%`），導致橫跨全螢幕的頂部懸浮通知（如 Discord 訊息彈出）在右上角被誤點，造成助手跳出至 Discord（`com.discord`）。
                 - 全域黑名單全面攔截 `y < 7.5% sh`，幾何 X 與熱區搜尋起始點全數拉升至 `y >= 7.5% sh`，徹底杜絕任何跳出至 Discord 或其他通訊軟體！
              3. **【極速順暢領取金幣】**：
                 - 徹底根除反覆跳轉 Google Play 商店與其他 App，影音廣告正常播放 15~20 秒出現真實略過/關閉鈕後即刻精準點擊，2 秒內完成領獎，不再發生 1 分鐘拖延或超時中斷。
              6. **【每日賓果重構與徹底消除開關輪迴】**：
                 - 處於賓果彈窗時完全停用宣傳幾何 X 偵測，消除開關輪迴。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻或今日上限，再依序掃描領取所有直欄「Get」獎勵並鎖定狀態。
              7. **【第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin 等 12 大套件。
                 - 前景為廣告套件時 100% 阻斷返回鍵，確保廣告完整播放並順利領取獎勵。
              8. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              9. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
