name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.79
          git push -f origin latest-apk || true
          git push -f origin v1.15.79 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.79 (依使用者指導優化跳轉自癒返回與防狂點節流機制 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.79 (Run #${{ github.run_number }}) - 依使用者指導優化跳轉自癒返回與防狂點節流機制 (相容歷代版本 v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【支援正常跳轉與重定向冷卻節流機制】**：
                 - 依據使用者指導，全面相容必須跳轉 Google Play 或瀏覽器才能略過之互動廣告正常流程。
                 - 於外部跳轉返回後啟動 3500ms 冷卻緩衝期，避免 1~2 秒內高頻連點同一座標，留出廣告畫面渲染略過按鈕（▶|）之時間。
                 - 僅當同一個座標區域累積連跳達 3 次無效時才暫時加入黑名單節流。
              2. **【Meta 廣告 (Trip.com) 左上角 X 優先辨識與廢除右上角盲點】**：
                 - 4D Meta 預覽層開放左上角幾何 X 掃描，第一時間點擊真實關閉叉叉。
                 - 徹底廢除容易誤觸『以外部瀏覽器開啟』之右上角盲點熱區，改以安全返回鍵退出。
              3. **【宣傳頁連點無效之安全返回鍵防穿透保護】**：
                 - 宣傳頁連點達 3 次無效時，僅在非主畫面狀態下發送系統返回鍵，避免穿透退出散步趣主頁至桌面。
              4. **【版本號升級】**：
                 - versionCode 112 / versionName 1.15.79。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.79)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.79
            name: "散步趣助手 v1.15.79 (依使用者指導優化跳轉自癒返回與防狂點節流機制)"
            body: |
              **散步趣助手 v1.15.79 (Run #${{ github.run_number }}) - 依使用者指導優化跳轉自癒返回與防狂點節流機制**
              1. **【支援正常跳轉與重定向冷卻節流機制】**：
                 - 依據使用者指導，全面相容必須跳轉 Google Play 或瀏覽器才能略過之互動廣告正常流程。
                 - 於外部跳轉返回後啟動 3500ms 冷卻緩衝期，避免 1~2 秒內高頻連點同一座標，留出廣告畫面渲染略過按鈕（▶|）之時間。
                 - 僅當同一個座標區域累積連跳達 3 次無效時才暫時加入黑名單節流。
              2. **【Meta 廣告 (Trip.com) 左上角 X 優先辨識與廢除右上角盲點】**：
                 - 4D Meta 預覽層開放左上角幾何 X 掃描，第一時間點擊真實關閉叉叉。
                 - 徹底廢除容易誤觸『以外部瀏覽器開啟』之右上角盲點熱區，改以安全返回鍵退出。
              3. **【宣傳頁連點無效之安全返回鍵防穿透保護】**：
                 - 宣傳頁連點達 3 次無效時，僅在非主畫面狀態下發送系統返回鍵，避免穿透退出散步趣主頁至桌面。
              4. **【版本號升級】**：
                 - versionCode 112 / versionName 1.15.79。
            files: LineWalkAutoAd.apk
            prerelease: false
