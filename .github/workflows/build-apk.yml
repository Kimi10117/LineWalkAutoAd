name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.2 (修復好友禮物播放鈕、玩遊戲推廣跳過、徹底根除賓果Get跳針 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.2 (Run #${{ github.run_number }})**
            1. **【修復 1：好友禮物綠色播放三角形 [▶] 按鈕精準點擊】**：
               - 痛點修復：接收好友禮物彈窗中，綠色膠囊播放按鈕因舊版單一直線取樣容易失準，且標題條件過於嚴格，導致卡在「搜尋畫面目標中」。
               - 解決方案：升級 2D 綠色連通像素區塊偵測（精準鎖定綠色膠囊外框與內部綠色播放三角形），搭配 OCR「剩餘天數」正上方相對定位雙重保險；放寬禮物彈窗辨識，100% 命中並點擊開始看廣告！
            2. **【修復 2：抽抽樂/活動彈出「玩遊戲賺點數」推廣宣傳頁自動 [跳過]】**：
               - 痛點修復：抽抽樂或巡邏過程中常彈出 Sally 鴨拿金幣的「玩遊戲賺點數 / 免費參加」推廣頁，因底部藍色「跳過」文字連結位於 y ≈ 0.89f，超出舊版 0.86f 辨識範圍而卡住無法關閉。
               - 解決方案：新增專屬推廣頁藍色文字色塊與 OCR 辨識，按鈕掃描全面覆蓋至 y < 0.94f，秒點「跳過」直接略過廣告！
            3. **【修復 3：徹底終結賓果連線獎勵 [▶ Get] 與廣告監控反覆橫跳輪迴】**：
               - 痛點根除：賓果點擊 [▶ Get] 後直接進入廣告監控，但因廣告 SDK 需 2~4 秒載入，舊版廣告監控在 2 秒時偵測到畫面依然是賓果就誤判為「廣告已播完返回遊戲」，立即切回巡選狀態再次點擊 Get，導致在「1.巡選中」與「3.廣告監控」之間每 2 秒跳針循環！
               - 解決方案：
                 1) 點擊連線獎勵後先切入彈窗等待流程（TRIGGER_AD_POPUP），等待全螢幕廣告真正啟動後再進入廣告監控。
                 2) 廣告監控的遊戲返回判定提高至至少 6 秒保護期，且若畫面上仍存在未領取之連線按鈕 [▶ Get] 嚴禁判定為返回遊戲，徹底消滅跳針輪迴！
                 3) 無障礙服務點擊座標全面改採真實螢幕緩衝區寬高防禦，避免在高解析度長螢幕手機上因 DisplayMetrics 限制導致點擊座標偏差。
            4. **【保留所有核心功能】**：
               - 廣告跳轉外部瀏覽器安全返回機制，杜絕反覆跳轉循環。
               - 看廣告永遠優先選擇「獲得金幣數量最多」之選項（100 > 60 > 50 > 30 > 15 > 10 > 5 > 2 > 1）。
               - 抽抽樂 50 抽優先、次選免費抽、嚴禁點 5 張；好友排行榜「送禮物也送自己」。
            5. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
