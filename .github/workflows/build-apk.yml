name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.93
          git push -f origin latest-apk || true
          git push -f origin v1.15.93 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.93 (跨階段點擊歸因隔離、12秒重定向窗與備援盲點吞鍵不歸零修復 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.93 (Run #${{ github.run_number }}) - 跨階段點擊歸因隔離、12秒重定向窗與備援盲點吞鍵不歸零修復 (相容歷代版本 v1.15.92, v1.15.91, v1.15.90, v1.15.89, v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【隔離跨階段點擊歸因，消除 `inmobi_close_img` 誤拉黑】**：
                 - `AutomationEngine.handleExternalAppGuard` 限定僅於 `EngineState.AD_WATCHING` 才呼叫 `adCloserHandler.markRecentRedirect(fromExternalApp = true)`，避免 `IN_GAME_SCAN` 期間誤跳日曆等背景 App 汙染黑名單；`AdCloserHandler.markRecentRedirect` 為隱式 `lastClickedPoint` 增設 12 秒歸因時間窗。
                 - `AdCloserHandler` 新增 `clearCurrentClickContext()`，並於 `clearRedirectMemory()`（含 `hasRecentRedirect = false`）、`onEnterAdMode` 與 `ReturnedToGame` 轉場同步清除殘留點擊座標與標籤。
              2. **【修正備援盲點重置吞鍵計數與空白畫面診斷提示】**：
                 - `AdCloserHandler.recordAndClick` 僅於非「備援盲點」點擊時才將 `swallowedEndCardBackAttempts` 歸零，使 `45s+` 無字圖片／靜音影片廣告在兩次吞鍵後可於 `~53s` 提前升級 `ForceBringGameToFront` 逃脫，不再拖延至 66s Watchdog。
                 - `AutomationEngine` 於 `AD_WATCHDOG_TIMEOUT` 記錄 `[畫面線索]` 時明確標註 `(無可辨識文字，可能為純圖片或靜音影片廣告)`。新增 `V1_15_93SimulationTest`，versionCode 126 / versionName 1.15.93（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.93)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.93
            name: "散步趣助手 v1.15.93 (跨階段點擊歸因隔離、12秒重定向窗與備援盲點吞鍵不歸零修復)"
            body: |
              **散步趣助手 v1.15.93 (Run #${{ github.run_number }}) - 跨階段點擊歸因隔離、12秒重定向窗與備援盲點吞鍵不歸零修復**
              1. **【隔離跨階段點擊歸因，消除 `inmobi_close_img` 誤拉黑】**：
                 - `AutomationEngine.handleExternalAppGuard` 限定僅於 `EngineState.AD_WATCHING` 才呼叫 `adCloserHandler.markRecentRedirect(fromExternalApp = true)`，避免 `IN_GAME_SCAN` 期間誤跳日曆等背景 App 汙染黑名單；`AdCloserHandler.markRecentRedirect` 為隱式 `lastClickedPoint` 增設 12 秒歸因時間窗。
                 - `AdCloserHandler` 新增 `clearCurrentClickContext()`，並於 `clearRedirectMemory()`（含 `hasRecentRedirect = false`）、`onEnterAdMode` 與 `ReturnedToGame` 轉場同步清除殘留點擊座標與標籤。
              2. **【修正備援盲點重置吞鍵計數與空白畫面診斷提示】**：
                 - `AdCloserHandler.recordAndClick` 僅於非「備援盲點」點擊時才將 `swallowedEndCardBackAttempts` 歸零，使 `45s+` 無字圖片／靜音影片廣告在兩次吞鍵後可於 `~53s` 提前升級 `ForceBringGameToFront` 逃脫，不再拖延至 66s Watchdog。
                 - `AutomationEngine` 於 `AD_WATCHDOG_TIMEOUT` 記錄 `[畫面線索]` 時明確標註 `(無可辨識文字，可能為純圖片或靜音影片廣告)`。新增 `V1_15_93SimulationTest`，versionCode 126 / versionName 1.15.93（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
