name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13 (徹底終結跳針輪迴、金幣最大值優先、極速關閉廣告 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.0 (Run #${{ github.run_number }})**
            1. **【徹底根除廣告與外部瀏覽器跳針死循環】**：
               - 痛點修復：Meta/Klook 輪播廣告因整個頂部皆為贊助連結，點擊 X 易觸發跳轉外部 Chrome Custom Tabs。
               - 解決方案：從跳轉網頁退回廣告畫面後，啟動「跳轉安全返回機制」，不再嘗試點擊螢幕，直接對廣告 Activity 發送系統返回鍵安全關閉廣告退回遊戲，100% 杜絕反覆跳針輪迴！
               - 修正跳轉座標黑名單機制，跳轉後不再重設廣告計時器，避免廣告超時保護被延遲。
            2. **【看廣告/領獎優先選擇「獲得金幣數量最多」之選項】**：
               - 嚴格依照使用者指令：彈窗有複數按鈕時，自動解析金幣/票券數值，依 100 > 60 > 50 > 30 > 15 > 10 > 5 > 2 > 1 降序排序，永遠點選金幣獎勵最高的按鈕！
               - 若擁有糖果，維持最高優先點「跳過廣告(糖果)」秒領獎勵。
            3. **【大幅加速廣告關閉速度，告別 60 秒漫長等待】**：
               - 將預設廣告逾時時間由 65 秒腰斬為 32 秒，各類卡死或無 X 廣告 32 秒內必定自動關閉。
               - 播放保護期由 4 秒縮短至 2.5 秒，快速廣告秒關。
               - 免樣本幾何角落 X 偵測器升級：放寬掃描區域 (頂部 2%~18%、左右 75%~98% 與 2%~25%)，並在廣告播放超過 8 秒時自動啟用半透明/淡色 X 放寬比對模式。
               - 新增「主動安全返回機制」：若廣告無倒數文字且播放超過 12 秒，在 12s/16s/20s/24s/28s/32s 自動嘗試返回關閉廣告，大幅節省時間！
            4. **【分頁巡邏同步修復】**：彈窗冷卻點取消後強制同步分頁狀態，確保按優先順序切換並點擊實體分頁標籤。
            5. **【各項功能完整保留】**：
               - 每日賓果 [▶ Get] 自動領取連線獎勵
               - 好友送禮優先點「送禮物也送自己」
               - 右上角禮物盒自動接收好友禮物
               - 抽抽樂優先 50 抽、次選免費抽、嚴禁點 5 張
               - 任務全分頁自動檢查領取
            6. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
