name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.35 (廣告結束卡片秒退、取消觸碰螢幕防跳商店、修復返回鍵卡死 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.35 (Run #${{ github.run_number }})**
              1. **【廣告結束卡片 (End Card) 快速秒退，徹底解決出不去卡死問題】**：
                 - 針對現代全螢幕廣告 (如 Meta/Facebook/Google Ads) 在影片播完後呈現的靜態結尾卡片（如「Download Facebook from Meta」），畫面上無 X 亦無倒數計時的情況：
                 - 助手新增結束卡片智慧特徵識別，確認進入結尾卡片後立即派發系統返回鍵，秒速關閉卡片回到遊戲領獎，徹底告別「卡在廣告出不去」！
              2. **【全面移除廣告期間螢幕觸碰與滑動：杜絕誤跳轉 Google Play 商店】**：
                 - 遵守「等到略過或關閉出現再點」原則，廣告播放期間嚴禁在畫面上進行任何微幅滑動或盲觸，給予廣告完全安靜的播放環境，100% 杜絕誤觸廣告畫面跳轉至 Google Play 或第三方應用程式！
              3. **【修復遊戲本體返回鍵防護：逾時強制退廣，不留死角】**：
                 - 當廣告執行逾時或進入末期時，開放無障礙服務發送返回鍵 (`allowInGame = true`)，讓附屬於遊戲行程的廣告 Activity 能夠被正確關閉，不再因誤將廣告當作遊戲主頁而拒絕發送返回鍵造成逾時卡死！
              4. **【幾何 X 搜尋區域收斂與網頁誤判修復】**：
                 - 幾何 X 頂部搜尋區域收斂至螢幕頂部 16% 以內，杜絕將廣告內部海報圖樣誤判為 X；修復外部網頁標題誤將遊戲本體當成瀏覽器連續按返回鍵之問題。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
