name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.5 (修復彈窗誤點取消不看廣告、解除廣告關閉鈕黑名單誤殺、新增可玩式/商店廣告自動關閉 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.5 (Run #${{ github.run_number }})**
            1. **【徹底修復「移動二次點擊只會打開獲得票券彈窗就按取消、不看廣告」問題】**：
               - **消除糖果按鈕反灰誤判**：
                 修復 `findPopupCancelButton` 中因彈窗上方「跳過廣告(糖果)」按鈕在無糖果時反灰，而被錯誤誤判為「按鈕停用中」並立即點擊底部 [取消] 的嚴重缺陷！
               - **增設有效看廣告按鈕保護**：
                 只要彈窗中存在珊瑚粉紅按鈕、紅利標籤按鈕 (`findPopupBonusBadgeAdButton`) 或「獲得 / 看廣告 / 紅利」有效字樣，強制禁止點擊 [取消]，並大幅提升紅利按鈕優先級！
               - **取消延遲防護**：
                 僅在重試至少 2 次且確認畫面含有「回復還需」倒數文字或確定無可領獎勵時方可點取消，杜絕載入延遲誤關。
            2. **【徹底修復「可玩式互動廣告 / 商店宣傳頁無法關閉、卡在巡邏中」問題】**：
               - **解除廣告關閉按鈕黑名單誤殺**：
                 修正 `AdCloserHandler` 與 `detectCornerGeometricX` 中盲目黑名單 `y < 16.5%` 的問題，放行位於頂部角落 (`y = 4%..12%`) 的真實廣告關閉 X 按鈕！
               - **自動識別可玩式廣告與商店頁面**：
                 巡邏中偵測到「開啟商店」、「DOWNLOAD」、「安裝」、「下載」、「Google Play」或非遊戲畫面時，立即主動進入 `AD_WATCHING` 廣告監控流程！
               - **無倒數廣告多重關閉機制**：
                 針對無倒數計時之互動式 / 商店頁面，於 6 秒後週期性發送返回鍵 (`navigateBack`) 並點擊右上角標準關閉熱區 (`y = 4.5%..9.0%`)，告別卡死！
            3. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
