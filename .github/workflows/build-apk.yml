name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          EXIT_CODE=1
          for attempt in 1 2 3; do
            echo "=== Gradle assembleRelease attempt ${attempt}/3 ==="
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
            EXIT_CODE=${PIPESTATUS[0]}
            echo "Gradle exit code (attempt ${attempt}): $EXIT_CODE"
            if [ $EXIT_CODE -eq 0 ]; then
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Transient build/repository error suspected; retrying in 15s..."
              sleep 15
            fi
          done
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.95
          git push -f origin latest-apk || true
          git push -f origin v1.15.95 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.95 (修復跨界黑邊左上角[▶|]略過鈕誤拒與4秒搶點、新增Level 3多工卡片精準滑除強制脫困 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.95 (Run #${{ github.run_number }}) - 修復跨界黑邊左上角[▶|]略過鈕誤拒與4秒搶點、新增Level 3多工卡片精準滑除強制脫困 (相容歷代版本 v1.15.94, v1.15.93, v1.15.92, v1.15.91, v1.15.90, v1.15.89, v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復跨界黑邊 `[▶|]` 略過鈕遭 `hasCapsuleExtension` 誤拒並提前 4 秒搶點】**：
                 - `TemplateMatcher.scanCornerSkipZone` 內 `hasCapsuleExtension` 改採「同水平掃描線文字明暗跳變」判定，解決韓系跨界黑邊廣告（`effTop = 248`）之左上角獨立 `[▶|]` 圓鈕被黑邊／灰底跨列混合誤判為倒數膠囊而拒點的問題；並將 `AdCloserHandler` Step 4C 搶點門檻提前至第 4 秒（單支上限 3 次）。
              2. **【新增 Level 3 多工卡片精準滑除脫困 (`forceKillStuckGameTaskViaRecents`)】**：
                 - 針對 Android 17／Samsung One UI 上 `CLEAR_TASK` 仍無法關閉頑固內嵌廣告 Activity 的情境，於 `CLEAR_TASK` 驗證未恢復時（且排除剛進入 Splash 載入畫面），自動開啟多工並僅在透過節點／OCR 正向鎖定「散步趣／LINE Walk」卡片後向上滑除該卡片並冷啟動遊戲，絕不盲滑其他應用。
              3. **【修正懸浮窗監控文案】**：
                 - `FloatingOverlayService.formatActiveStatusText` 區分一般廣告「監控中」與實際退回「強退中」。新增 `V1_15_95SimulationTest`，versionCode 128 / versionName 1.15.95（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.95)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.95
            name: "散步趣助手 v1.15.95 (修復跨界黑邊左上角[▶|]略過鈕誤拒與4秒搶點、新增Level 3多工卡片精準滑除強制脫困)"
            body: |
              **散步趣助手 v1.15.95 (Run #${{ github.run_number }}) - 修復跨界黑邊左上角[▶|]略過鈕誤拒與4秒搶點、新增Level 3多工卡片精準滑除強制脫困**
              1. **【修復跨界黑邊 `[▶|]` 略過鈕遭 `hasCapsuleExtension` 誤拒並提前 4 秒搶點】**：
                 - `TemplateMatcher.scanCornerSkipZone` 內 `hasCapsuleExtension` 改採「同水平掃描線文字明暗跳變」判定，解決韓系跨界黑邊廣告（`effTop = 248`）之左上角獨立 `[▶|]` 圓鈕被黑邊／灰底跨列混合誤判為倒數膠囊而拒點的問題；並將 `AdCloserHandler` Step 4C 搶點門檻提前至第 4 秒（單支上限 3 次）。
              2. **【新增 Level 3 多工卡片精準滑除脫困 (`forceKillStuckGameTaskViaRecents`)】**：
                 - 針對 Android 17／Samsung One UI 上 `CLEAR_TASK` 仍無法關閉頑固內嵌廣告 Activity 的情境，於 `CLEAR_TASK` 驗證未恢復時（且排除剛進入 Splash 載入畫面），自動開啟多工並僅在透過節點／OCR 正向鎖定「散步趣／LINE Walk」卡片後向上滑除該卡片並冷啟動遊戲，絕不盲滑其他應用。
              3. **【修正懸浮窗監控文案】**：
                 - `FloatingOverlayService.formatActiveStatusText` 區分一般廣告「監控中」與實際退回「強退中」。新增 `V1_15_95SimulationTest`，versionCode 128 / versionName 1.15.95（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
