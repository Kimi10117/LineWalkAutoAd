name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.52 (全機型通用自適應架構、動態錨定與象限導覽、全域略過符號秒點、防放棄彈窗攔截、50抽票券防護與動態任務面板 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.52 (Run #${{ github.run_number }}) - 升級自 v1.15.51**
              1. **【全機型四大分頁通用自適應架構 (Universal Y-Anchor & Quadrant Navigation)】**：
                 - 動態掃描頂部四大分頁文字計算動態基準線 Y_anchor，水平採用 4 等分相對象限中心（0.125f, 0.375f, 0.625f, 0.875f），徹底根除在 SM-S7210 (22:9) 及各式設備上的點擊偏移。
              2. **【全畫面 `▶|` / `>|` / `>>` 略過符號全域放行秒點】**：
                 - 全畫面放行快速略過符號（包含 ShopBack 等左上角 `▶| Google Play` 膠囊），跳轉 Play 商店後自動安全返回並推進至結束卡片關閉。
              3. **【英文/多語系防放棄確認彈窗優先最高攔截】**：
                 - 檢測確認彈窗誘騙按鈕，從 `AD_CLOSE_OCR_KEYWORDS` 剔除「放棄獎勵」、「放棄」、「Close」、「Quit」，100% 點擊「Keep watching / Resume / Continue / 繼續觀看」。
              4. **【抽抽樂 50 抽反灰判定與票券數驅動】**：
                 - 提取頂部資產票券數，明確 `< 50` 時邏輯直接禁止點擊 50 抽並自動轉點「免費抽1次」或關閉；按鈕內部像素採樣判定反灰。
              5. **【任務面板動態分頁清單】**：
                 - 動態掃描現存分頁，特別任務完成消失時自動收斂為每日與每週，所有分頁檢查完畢後點擊 (X) 退出，杜絕死循環。
              6. **【底部導覽列通用動態定位】**：
                 - 優先 OCR 鎖定文字本體，備援座標錨定 Y=0.910f 精準避開虛擬導覽列與手勢條。
              7. **【宣傳廣告熱區擴展與編譯發布】**：
                 - 宣傳廣告關閉鈕掃描範圍擴展至 0.050f..0.120f，補齊缺失 import 與 TAG 常數，版本發布 v1.15.52 (versionCode 85)。
            files: LineWalkAutoAd.apk
            prerelease: false
