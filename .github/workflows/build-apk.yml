name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.2 (修復移動列車全數領取、步數票券全數領取、賓果▶Get精準點擊領取 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.2 (Run #${{ github.run_number }})**
            1. **【修復移動分頁只點一台車，未全部點完問題】**：
               - **新增「乘車費用 / 移動一段距離」對話框與車長金幣泡泡精準辨識**：
                 原先移動任務僅搜尋粉紅按鈕與「獲得金幣」字眼，導致完成第一台車後，主畫面上第二台車（「移動一段距離了呢！你可以收取乘車費用喔！」或車長金幣泡泡）無法被辨識。現新增對話框文字特徵與金幣泡泡色彩叢集偵測，點擊車廂開啟彈窗！
            2. **【修復步數分頁沒有全部點完就跳其他分頁問題】**：
               - **修正分頁佇留與巡邏架構，強制全部點完才允許換頁**：
                 修復巡邏架構中每次廣告結束返回分頁時強制以 `remainingTabs.first()` 覆蓋當前分頁的缺陷。改為「當前分頁尚有獎勵待領取時，強制留在此分頁，直至全部領取完畢並確認為空（emptyTicks >= 4）」，保證步數分頁的所有票券連續採收完畢！
               - **擴展步數/時間粉紅按鈕掃描範圍 (y=25%~42%)**：
                 修正 y 軸從 29% 開始掃描導致部分螢幕比例上緣被裁切的偏差，確保每一張「獲得票券」按鈕皆能 100% 觸發。
            3. **【修復賓果無法點擊 Get、一直打開關閉頁面問題】**：
               - **微縮連線獎勵掃描熱區至 y=81%~88%，死中心點擊 [▶ Get]**：
                 原先 Y 軸掃描範圍自 78% 開始，誤將上方糖果包裝紙紅粉像素納入，導致算出的 centerY 落在 83.3%（按鈕頂部邊緣或外部）而點擊失效。現嚴格鎖定 81%~88%，計算出之中心點 (73, 849) 精準落在紅底 [▶ Get] 膠囊按鈕正中心！
               - **連線獎勵點擊後直接切入廣告監控模式**：
                 點擊連線獎勵 [▶ Get] 後直接呼叫 `adCloserHandler.onEnterAdMode()` 並進入 `AD_WATCHING`，防止進入彈窗等待逾時誤將賓果視窗打叉關閉。
            4. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
