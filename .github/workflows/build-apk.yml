name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.12 (修復輪播廣告與外部網頁反覆橫跳輪迴、升級外部跳轉防禦 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.12.0 (Run #${{ github.run_number }})**
            1. **【終結輪播廣告 (Meta/Klook) 與外部網頁反覆橫跳輪迴 Bug】**：
               - 修復巡邏狀態機偵測到角落關閉鈕時，未切入廣告保護期而立即搶點導致 Meta 攔截點擊跳轉網頁的問題。
               - 新增全局外部網頁/商店即時防禦，偵測到 Chrome Custom Tabs 或跳轉網頁秒發返回鍵關閉，絕不在外部網頁亂點！
               - 廣告監控器升級：網頁跳轉返回後啟動冷靜緩衝期，不永久封鎖角落真實 X；若廣告超過 8 秒自動發送系統返回鍵安全關閉廣告，徹底杜絕反覆跳針輪迴！
            2. **【消除「禮物卡」誤判】**：
               - 修正接收禮物與遊戲介面判斷，嚴格排除「超商禮物卡/禮物券」等廣告卡片文字，避免廣告中途誤跳回遊戲狀態。
            3. **【每日賓果 [▶ Get] 自動領取連線獎勵】**：精準點擊珊瑚粉紅 [▶ Get] 膠囊按鈕中心。
            4. **【好友送禮「▶ 也送給自己」優先選擇】**：自動選擇「也送給自己」雙贏獎勵。
            5. **【右上角禮物盒接收好友禮物】**：全自動領取好友贈送的禮物並看廣告。
            6. **【抽抽樂】智慧抽獎（依使用者規則）**：優先 50 抽、次選免費抽、嚴禁點 5 張。
            7. **【任務】全分頁自動領取**。
            8. **【冷卻彈窗自動點取消推進巡邏】**。
            9. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
