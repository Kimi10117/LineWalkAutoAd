name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.58
          git push -f origin latest-apk || true
          git push -f origin v1.15.58 || true
        
      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.58 (抽抽樂50抽與免費抽雙反灰立即關閉、根除誤點下方『完成任務獲得大量金幣』推廣橫幅 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.58 (Run #${{ github.run_number }}) - 升級自 v1.15.57 (相容歷代版本 v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【抽抽樂下方「完成任務 即可獲得 大量金幣!!」誤點根除與雙反灰直接關閉】**：
                 - 新增 `isLotteryWinResultScreen` 嚴格檢查：當處於抽抽樂主面板（含「查看獎項一覽」、「回復還需」、「完成任務」、「即可獲得」、「大量金幣」、「5張」、「50張」）時，100% 一票否決中獎結果判定；
                 - 移除單憑「獲得」二字即觸發看廣告獲票按鈕 OCR 備援的缺陷，要求必須明確包含 `x1` / `×1` / `1張`，徹底杜絕誤點下方黃色推廣橫幅進入 LINE 輕鬆賺的死循環；
                 - 當「50抽」與「免費抽」兩個按鈕皆為灰色或冷卻中時，立即點擊右上角 (X) 關閉抽抽樂視窗並繼續檢查下一個項目。
              2. **【保留 v1.15.57 每日賓果與遊戲分頁自動切回首頁修復】**：
                 - 每日賓果 5 次開格上限與 `0 BINGO` / 嚴格鮮紅 `[Get]` 判定、遊戲分頁無日常圖示自動切回首頁。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.58)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.58
            name: "散步趣助手 v1.15.58 (抽抽樂50抽與免費抽雙反灰立即關閉、根除誤點下方『完成任務獲得大量金幣』推廣橫幅)"
            body: |
              **散步趣助手 v1.15.58 (Run #${{ github.run_number }}) - 升級自 v1.15.57 (相容歷代版本 v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【抽抽樂下方「完成任務 即可獲得 大量金幣!!」誤點根除與雙反灰直接關閉】**：
                 - 新增 `isLotteryWinResultScreen` 嚴格檢查：當處於抽抽樂主面板（含「查看獎項一覽」、「回復還需」、「完成任務」、「即可獲得」、「大量金幣」、「5張」、「50張」）時，100% 一票否決中獎結果判定；
                 - 移除單憑「獲得」二字即觸發看廣告獲票按鈕 OCR 備援的缺陷，要求必須明確包含 `x1` / `×1` / `1張`，徹底杜絕誤點下方黃色推廣橫幅進入 LINE 輕鬆賺的死循環；
                 - 當「50抽」與「免費抽」兩個按鈕皆為灰色或冷卻中時，立即點擊右上角 (X) 關閉抽抽樂視窗並繼續檢查下一個項目。
              2. **【保留 v1.15.57 每日賓果與遊戲分頁自動切回首頁修復】**：
                 - 每日賓果 5 次開格上限與 `0 BINGO` / 嚴格鮮紅 `[Get]` 判定、遊戲分頁無日常圖示自動切回首頁。
              6. **【四大分頁切換 Y 軸基準線下修】**：
                 - 基準線下修至 12.5% sh，精準命中分頁文字本體，避開黑色指示條與下方廣告橫幅。
            files: LineWalkAutoAd.apk
            prerelease: false
