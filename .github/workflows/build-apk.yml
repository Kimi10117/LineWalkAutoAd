name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.14.9 (修復每日賓果開啟卡死、日常子視窗優先處理、徹底根治主畫面導覽列誤判 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.14.9 (Run #${{ github.run_number }})**
              1. **【徹底根治「開啟每日賓果」卡死與日常彈窗處理優先權問題】**：
                 - **日常任務子彈窗（賓果/抽抽樂/任務/接收禮物/好友）最高優先檢查**：
                   根治先前在主畫面巡邏（`IN_GAME_SCAN`）時，因日常子視窗（如每日賓果、抽抽樂）下方仍露出了底部導覽列（集點/好友/使用/精選），被 `isLineWalkMainScreenVisible` 誤判為「仍在乾淨主畫面」，導致主畫面巡邏誤以為賓果視窗尚未開啟、持續嘗試點擊主畫面背景賓果圖示而無限卡死在「🎯 開啟每日賓果...」的重大邏輯錯誤！
                   現在將「每日賓果」、「抽抽樂」、「任務」、「接收禮物」與「好友頁面」移至最優先檢查，一旦視窗開啟，立即優先執行連線領取 [▶ Get] 與點擊橘色「立即開啟賓果格」看廣告！
                 - **全面完善主畫面判定排除子視窗特徵**：
                   在 `isLineWalkMainScreenVisible` 中增設全方位子彈窗檢查（`hasSubDialogOpen`），凡畫面上出現「每日賓果 / 今日賓果 / BINGO / OPEN / 開啟賓果格 / 抽抽樂 / 任務 / 禮物盒 / 好友清單 / 邀請好友」，100% 判定非乾淨主畫面，徹底根除主畫面判定與子視窗之間的邏輯衝突。
                 - **收緊底部導覽列獨立判定條件**：
                   不再僅憑看見底部導覽列即認證為主畫面，必須同時驗證頂部分頁或分頁核心內容，杜絕各功能視窗覆蓋時的誤判。
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
