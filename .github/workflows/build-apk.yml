name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.8 (徹底根除可玩式/GooglePlay廣告卡在「嘗試關閉(43s)」死循環 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.8 (Run #${{ github.run_number }})**
              1. **【徹底修復可玩式/Google Play廣告卡在「嘗試關閉 (43s)...」無法關閉的死循環】**：
                 - **根本原因**：
                   1. **備援關閉熱區誤遭黑名單阻斷**：先前的 `recordAndClick` 將所有點擊滿 2 次的區域一律加入黑名單，導致「右上角備援關閉熱區」在點擊 2 次後被徹底封鎖，後續 30 多秒完全無法再次點擊熱區！
                   2. **單次回退鍵遭廣告 Activity 攔截**：部分全螢幕沉浸式可玩廣告或 Google Play 結束頁忽略單一系統返回鍵，且畫面頂部有黑邊（劇院 16:9 比例），原本右上角熱區點在黑邊內而非廣告內容角落！
                   3. **未辨識 Google Play 跳過/商店徽章**：廣告頂部的 `[▶| Google Play]` 徽章是此類廣告的標準互動按鈕，點擊後即可觸發跳過或喚出真正關閉鈕。
                   4. **逾時後重複觸發回圈**：廣告逾時後回到巡邏時，因廣告仍在前景而立即再次觸發廣告監控，陷入無限循環。
                 - **全方位修復措施**：
                   1. **備援關閉熱區永久白名單**：關閉熱區絕不加入黑名單，確保持續具備點擊能力。
                   2. **多熱區輪替循環點擊**：依序輪替點擊【頂部 Google Play 徽章】、【螢幕右上角】、【內容右上角 (黑邊下方)】、【螢幕左上角】、【內容左上角】，全面涵蓋所有廣告版型！
                   3. **升級系統雙重返回鍵 (Double Back)**：發送連續兩次快速返回鍵，有效破解全螢幕沉浸式廣告與防退出攔截！
                   4. **逾時強制喚醒散步趣回前景**：單支廣告若超過等待上限仍未關閉，強制透過 `bringAppToFront` 將《LINE 散步趣》主畫面喚醒拉回前景，徹底打碎停滯死循環！
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
