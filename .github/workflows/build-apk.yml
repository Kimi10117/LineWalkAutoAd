name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.6 (徹底根治點擊開始跳轉輕鬆賺、四大分頁完全避開廣告橫幅、精準分頁切換 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.6 (Run #${{ github.run_number }})**
            1. **【徹底根治「點開始跳轉輕鬆賺」深度防護】**：
               - 痛點修復：點擊 [▶ 開始] 時，若底部導覽列因小字號或網頁橫幅未被辨識，主畫面判定失敗後落入無障礙關閉節點，誤點了「開始遊玩 >」。
               - 解決方案：
                 1) `isLineWalkMainScreenVisible` 解除底部導覽列強依賴，只要看到頂部分頁或遊戲專屬文字 ("LINE POINTS GAME/簡單賺金幣/接龍/數獨") 即 100% 認定為主畫面。
                 2) `NodeInspector` 無障礙關閉節點與幾何 X 偵測全面封鎖廣告橫幅區間 (y: 12% ~ 36%)，禁止在該高度點擊任何節點。
            2. **【四大常規任務高度界線全面下修 (y >= 29.5%)】**：
               - 痛點修復：即使分頁尚未翻頁，「獲得金幣」OCR 不得掃描到橫幅中的「獲得 金幣!!」。
               - 解決方案：
                 1) `MoveGaugeTask`、`StepBottleTask`、`IdleRewardTask` 搜尋區域嚴格限定 y = 29.5% ~ 40%，徹底遠離頂部廣告橫幅 (y ≈ 17% ~ 29%)。
                 2) 各任務均加入防呆守門員：若目標 centerY < 29%，直接返回 null 拒絕點擊。
            3. **【精準首頁分頁點擊與零提早賦值】**：
               - 「首頁」分頁點擊熱區採用完整分頁幾何 (x: 2%~24%, y: 10%~13.6%)，直擊標籤中心。
               - 完全移除提早猜測賦值，直到畫面實際翻到首頁前，絕不在遊戲頁面上執行移動分頁檢查。
            4. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
