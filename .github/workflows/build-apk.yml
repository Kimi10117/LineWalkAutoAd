name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.4 (好友送禮自動送自己、50抽抽樂修復、賓果防卡死開格、遊戲分頁排除廣告橫幅 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.4 (Run #${{ github.run_number }})**
            1. **【好友送禮修復：精準送禮並優先選擇「也送給自己」看廣告】**：
               - 痛點修復：好友頁面上方標題含有「禮物次數」4字，導致誤觸收禮彈窗邏輯而反覆顯示「收禮完成」，無法進入好友送禮清單。
               - 解決方案：
                 1) `ReceiveGiftTask` 嚴格排除好友排行榜、排行榜、好友清單等畫面，並過濾「禮物次數」。
                 2) `FriendGiftTask` 全新升級 2D 綠色色塊聚類偵測，精準定位右側每位好友的綠色禮物圖標。
                 3) 彈窗內「也送給自己」亮綠色長條按鈕支援 2D 色彩聚類與 OCR 去空白模糊比對，精準點選「送禮物也送自己」並進入看廣告流程。
            2. **【抽抽樂修復：50 抽按鈕 2D 聚類偵測與連續抽卷】**：
               - 痛點修復：舊版 50 抽僅採樣單一像素，恰好踩中按鈕內藍色票券圖示而辨識失敗，誤認無可抽項目而直接退出。
               - 解決方案：
                 1) `LotteryTask` 導入 2D 紅色按鈕聚類偵測（超過 80 個高飽和紅像素）與 OCR 彈性去空白判定，100% 成功識別「50張 抽1次」。
                 2) 50 抽使用票券點擊後進入抽獎彈窗領獎流程，支援連續抽卷（如 11 次連續抽完）。
                 3) 50 抽耗盡後自動改點黃色「免費看廣告抽一次」，嚴格雙重防呆絕不點擊「5張 抽1次」。
            3. **【每日賓果防卡死修復：排除冷卻時間誤判，支援連續開格與正常關閉】**：
               - 痛點修復：賓果畫面上方「距離下次抽選還有 26 分鐘 36 秒」被廣告倒數計時器誤配為 36 秒廣告倒數，導致卡在廣告監控狀態無法回遊戲開格。
               - 解決方案：
                 1) `detectAdCountdownSeconds` 嚴格排除「分」、「分鐘」、「距離」、「下次」、「重置」、時間冒號「:」，徹底杜絕冷卻時間被誤認成廣告。
                 2) 升級「立即開啟賓果格」亮橘色 2D 色塊聚類偵測，開格後立即進入廣告監控。
                 3) 廣告播畢回到賓果後自動繼續開下一格，直到進入冷卻或連線獎勵領畢，自動點擊右上角 (X) 退出推進下一項。
            4. **【遊戲分頁防誤觸修復：嚴格鎖定機台金幣按鈕，排除上方廣告】**：
               - 痛點修復：遊戲分頁頂部「輕鬆賺 獲得金幣!! 開始遊玩 >」廣告橫幅含有「獲得金幣」字樣，導致誤觸點擊廣告跳轉。
               - 解決方案：
                 1) `GachaTask` 與四大分頁任務搜尋區域嚴格限定機台中央 (y = 46% ~ 58%)，徹底避開頂部廣告橫幅 (y = 17% ~ 30%)。
                 2) 增設黑名單過濾「輕鬆賺」、「輕鬆」、「開始遊玩」、「AD」、「Sponsored」、「adjoe」。
                 3) 若機台 [🪙 獲得金幣] 呈灰底（未達成條件），絕不誤點廣告橫幅，確認後直接推進檢查下一項！
            5. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
