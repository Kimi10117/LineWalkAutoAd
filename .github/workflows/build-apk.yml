name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.67
          git push -f origin latest-apk || true
          git push -f origin v1.15.67 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.67 (根除廣告錯誤誤判、送收禮獨立開關、抽抽樂5抽支援與廣告略過強化 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.67 (Run #${{ github.run_number }}) - 根除「無法載入廣告」綠色像素誤判、送收禮拆分為兩項獨立功能、時間分頁優先看廣告領紅利莓果、抽抽樂新增「5張 抽1次」、每日賓果修復與廣告略過/防亂點全面強化 (相容歷代版本 v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【徹底根除「無法載入廣告」綠色像素誤判與新增「邀請好友 10000 金幣」關閉支援】**：
                 - 移除 `OcrRecognizer.findAdLoadErrorCloseButton` 無文字純綠色像素盲猜分支，強制要求畫面上具備明確錯誤提示文字（「無法載入廣告」、「請稍後再試」等）才觸發，並對「每日賓果」、「邀請好友」、「抽抽樂」與主畫面四大分頁設下一票否決保護；
                 - 擴充 `isLineInHousePromoAd` 與 `getLineInHousePromoCloseButton`，支援「邀請好友 最高可獲 10000 金幣 快來領取吧」全螢幕宣傳頁，自動點擊右上角關閉按鈕 (X) 退回主畫面。
              2. **【送禮物與收禮物拆分為兩項獨立開關】**：
                 - 在 `AppConfig`、`activity_main.xml`、`MainActivity`、`ReceiveGiftTask` 與 `AutomationEngine` 中，將原本合併的選項拆分為獨立的「8.【好友送禮】排行榜自動送禮 (優先送自己)」與「9.【接收禮物】自動開啟禮物盒領取好友禮物」，可依需求單獨開啟或關閉。
              3. **【四大分頁單一項目徹底巡完再換頁 & 時間分頁優先點擊「紅利看廣告獲得一顆莓果」】**：
                 - 提高主畫面分頁切換確認門檻至連續 3 個空 Tick，確保「移動、步數、時間、遊戲」單一分頁獎勵完全領取完畢後才切換至下一分頁；
                 - 在 `IdleRewardTask` 新增 `findBonusBerryAdButton`：進入【時間】分頁時，第一優先偵測並點擊畫面上的「紅利看廣告額外獲得一顆莓果/蘋果」按鈕，完成後再點擊中間粉紅 `[獲得票券]` 按鈕收取成熟莓果。
              4. **【嚴格禁止點擊首頁下方的無關橫幅廣告】**：
                 - 將主畫面「移動、步數、時間」分頁獎勵按鈕搜尋高度嚴格限制在 `y in 0.25f..0.365f`；
                 - 在 `AutomationEngine` 加入主畫面硬性座標防護罩，嚴禁在主畫面點擊 `y in 0.445f..0.895f` 範圍，100% 封鎖「輕鬆賺 獲得金幣!! 開始遊玩」、酷澎「立即下載」與「瞭解詳情」等首頁下方廣告。
              5. **【修復每日賓果卡住不動與底部 [Get] 獎勵按鈕漏點】**：
                 - 放寬 `BingoTask.findNextClaimableReward` 對底部珊瑚粉紅 `[Get]` 膠囊按鈕之色彩與幾何範圍容差；
                 - 點擊連線獎勵 `[Get]` 後自動轉入 `TRIGGER_AD_POPUP` 處理看廣告或領獎確認彈窗，並允許同一欄重試最多 3 次直到按鈕消失，解決賓果視窗卡住不動問題。
              6. **【抽抽樂新增支援「5張 抽1次」第三順位連抽】**：
                 - 更新 `LotteryTask.findTargetDrawButton` 與 `AutomationEngine.handleLotteryDialog` 優先順序為：第一優先「50張 抽1次」-> 第二優先「免費抽1次」-> 第三優先「5張 抽1次」；
                 - 當 50 抽與免費抽皆冷卻或不可點且彩券達 5 張以上時，自動點擊橘色「5張 抽1次」按鈕並處理開獎結果視窗。
              7. **【全面強化廣告略過系統、禁止播放期間亂點、解決不可略過廣告提早退出】**：
                 - 支援 Meta `Sponsored` 頂部白底橫幅左上角關閉按鈕 `X` (`x in 0.042w..0.095w, y in 0.018h..0.042h`)，同時嚴格封鎖 `y in 0.046h..0.150h` 的品牌頭像與網址列 (`https://momo.dm/...`) 以及右上角靜音喇叭；
                 - 嚴格限制快速略過符號 `>>` 僅匹配邊角獨立短標籤（長度 <= 6），防止誤點購物廣告內文之「雙11必買>>」；
                 - 收緊點擊黑名單門檻至 2 次（同一區域點擊 2 次未關閉廣告即封鎖），並移除播放期間每 3.5 秒無差別滑動手勢；
                 - 將不可略過廣告之結束卡片與備援返回等待門檻延後至 42~45 秒（預設最大等待上限提升至 65 秒），防止不可略過廣告提早退出導致拿不到獎勵。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.67)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.67
            name: "散步趣助手 v1.15.67 (根除廣告錯誤誤判、送收禮獨立開關、抽抽樂5抽支援與廣告略過強化)"
