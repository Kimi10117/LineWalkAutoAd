name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.0 (修復領取一次後卡住、主畫面優先巡邏、杜絕日常彈窗誤判劫持 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.0 (Run #${{ github.run_number }})**
            1. **【徹底修復「領取一次後就卡住了、顯示『🔍 檢查彈窗中...』沒有繼續檢查」問題】**：
               - **主畫面優先權提升至最高等級**：
                 重構 `handleInGameScan` 決策樹，只要畫面處於《LINE 散步趣》主畫面（四大分頁與資產狀態正常），立即直接進入 `handleMainScreenPatrol` 巡邏四大分頁（移動 ➔ 時間 ➔ 遊戲 ➔ 步數），絕不再被下層的子彈窗辨識器誤判劫持！
               - **全子彈窗辨識器嚴格排除主畫面四大分頁**：
                 修復 `isMissionDialogOpen`、`isBingoDialogOpen`、`isLotteryDialogOpen`、`isReceiveGiftDialogOpen` 與 `isFriendsPage` 在主畫面上因包含「任務 / 賓果 / 抽抽樂」圖示文字或「可領取獎勵」氣泡而誤傳 true 的重大 Bug。現在所有子彈窗偵測器均強制檢查若頂部四大分頁存在，一律嚴格判定為非彈窗！
               - **修復任務領取按鈕 2D 綠色像素誤將主畫面綠色風景視為按鈕**：
                 `MissionTask.findClaimableMissionButton` 增加防呆，嚴禁在主畫面上執行綠色像素聚合，且唯有畫面真正出現「特別/每日/每週」任務分頁時才啟用備援，杜絕反覆盲點背景風景導致的無限循環！
               - **看廣告後回到主畫面自動快速切換狀態**：
                 在 `handleTriggerAdPopup` 中加入若確認回到主畫面且等待 2 次無廣告彈窗時，立即切回 `IN_GAME_SCAN` 繼續推進下一分頁，無縫巡邏時間分頁的 8 個待領獎勵與日常任務！
            2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
