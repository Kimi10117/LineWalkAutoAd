name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.73
          git push -f origin latest-apk || true
          git push -f origin v1.15.73 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.73 (互動式廣告 Google Play 略過膠囊秒點與滑動螢幕重新喚醒 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.73 (Run #${{ github.run_number }}) - 互動式廣告 Google Play 略過膠囊極速秒點、滑動螢幕重新喚醒、商店返回秒關閉 (相容歷代版本 v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【互動式廣告左上角略過膠囊極速秒點】**：
                 - 移除原先 4 秒等待限制，改為進入廣告第 1 秒起偵測到即刻秒點，避免按鈕自動淡出隱藏。
                 - 略過膠囊點擊設置 allowBlacklist = false，保障正常跳轉商店返回散步趣後座標不被誤加入黑名單。
              2. **【試玩廣告控制項隱藏之滑動螢幕重新喚醒 (Reveal Swipe)】**：
                 - 廣告播放 3 秒以上且無倒數計時、畫面上未出現按鈕時，主動派發中央垂直滑動手勢以喚醒廣告頂部介面。
                 - 單次廣告設定最多喚醒 4 次，並加入 3500ms 節流保護。
              3. **【AdStepResult.SwipedToReveal 密封類與狀態處理】**：
                 - 新增 SwipedToReveal 結果型別，於 AutomationEngine 輸出即時日誌與懸浮窗提示。
                 - 於 onEnterAdMode 正確重置 revealSwipeCount 與 lastRevealSwipeTimeMs。
              4. **【版本號升級】**：
                 - versionCode 106 / versionName 1.15.73，通過 53 項回歸測試與零 Emoji 繁體中文審核。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.73)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.73
            name: "散步趣助手 v1.15.73 (互動式廣告 Google Play 略過膠囊秒點與滑動螢幕重新喚醒)"
            body: |
              **散步趣助手 v1.15.73 (Run #${{ github.run_number }}) - 互動式廣告 Google Play 略過膠囊極速秒點、滑動螢幕重新喚醒、商店返回秒關閉 (相容歷代版本 v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【互動式廣告左上角略過膠囊極速秒點】**：
                 - 移除原先 4 秒等待限制，改為進入廣告第 1 秒起偵測到即刻秒點，避免按鈕自動淡出隱藏。
                 - 略過膠囊點擊設置 allowBlacklist = false，保障正常跳轉商店返回散步趣後座標不被誤加入黑名單。
              2. **【試玩廣告控制項隱藏之滑動螢幕重新喚醒 (Reveal Swipe)】**：
                 - 廣告播放 3 秒以上且無倒數計時、畫面上未出現按鈕時，主動派發中央垂直滑動手勢以喚醒廣告頂部介面。
                 - 單次廣告設定最多喚醒 4 次，並加入 3500ms 節流保護。
              3. **【AdStepResult.SwipedToReveal 密封類與狀態處理】**：
                 - 新增 SwipedToReveal 結果型別，於 AutomationEngine 輸出即時日誌與懸浮窗提示。
                 - 於 onEnterAdMode 正確重置 revealSwipeCount 與 lastRevealSwipeTimeMs。
              4. **【版本號升級】**：
                 - versionCode 106 / versionName 1.15.73，通過 53 項回歸測試與零 Emoji 繁體中文審核。
            files: LineWalkAutoAd.apk
            prerelease: false
