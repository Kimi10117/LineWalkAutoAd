name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.92
          git push -f origin latest-apk || true
          git push -f origin v1.15.92 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.92 (InMobi惰性節點與半括號(X)防護、跨逾時redirectCount重置喚醒、延後返回與請勿打擾鎖屏待機修復 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.92 (Run #${{ github.run_number }}) - InMobi惰性節點與半括號(X)防護、跨逾時redirectCount重置喚醒、延後返回與請勿打擾鎖屏待機修復 (相容歷代版本 v1.15.91, v1.15.90, v1.15.89, v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【InMobi 早期惰性節點防護、半括號 `"(X"` 與宿主容器保護】**：
                 - `AdCloserHandler` 提取 `isEarlyInertInmobiNode`（Step 4A/6 同步套用）在 14s 前略過空白 `inmobi_enhanced_skip_close_btn`，將 `Node[` 關閉/略過目標納入 `isHighConfidenceAdTarget` 防止自封；`OcrRecognizer.findCornerAsciiCloseButton` 支援 `"(X"` 等半括號字元，`NodeInspector` 於 `IN_GAME_SCAN` 排除空宿主 `close_button_container`。
              2. **【跨 Watchdog `redirectCount` 解鎖與喚醒隱藏 `[▶| Google Play]` 膠囊】**：
                 - `onEnterAdMode(preserveRedirectState = true)` 重置當輪 `redirectCount`／`closeClickCount` 並改以 `redirectPointCounts` 延續同列商店膠囊封鎖；`Step 8B Reveal Swipe` 擴充可玩關鍵字與 12–40s 喚醒機制解決 `JOIN LIVE` 四連強退迴圈；移除 Step 2B `!isGameVisible` 誤退出分支。
              3. **【延後返回防退出桌面、請勿打擾鎖屏 AOD 與 Splash 畫面辨識】**：
                 - `recordAndClick` 點擊關閉／略過鈕後延後 `lastBackActionTimeMs`；`AutoAdAccessibilityService.isDeviceLockedOrNonInteractive` 新增 `Display.state != STATE_ON` 與 `isDeviceLocked` 檢查；`OcrRecognizer.isLockscreenOrAodOcr` 辨識「請勿打擾／開啟」與時鐘狀態並新增 `isLineWalkSplashOrLoadingScreen`；`AutomationEngine` 抑制鎖屏後短暫系統桌面與正確重置待機計時。新增 `V1_15_92SimulationTest`，versionCode 125 / versionName 1.15.92（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.92)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.92
            name: "散步趣助手 v1.15.92 (InMobi惰性節點與半括號(X)防護、跨逾時redirectCount重置喚醒、延後返回與請勿打擾鎖屏待機修復)"
            body: |
              **散步趣助手 v1.15.92 (Run #${{ github.run_number }}) - InMobi惰性節點與半括號(X)防護、跨逾時redirectCount重置喚醒、延後返回與請勿打擾鎖屏待機修復**
              1. **【InMobi 早期惰性節點防護、半括號 `"(X"` 與宿主容器保護】**：
                 - `AdCloserHandler` 提取 `isEarlyInertInmobiNode`（Step 4A/6 同步套用）在 14s 前略過空白 `inmobi_enhanced_skip_close_btn`，將 `Node[` 關閉/略過目標納入 `isHighConfidenceAdTarget` 防止自封；`OcrRecognizer.findCornerAsciiCloseButton` 支援 `"(X"` 等半括號字元，`NodeInspector` 於 `IN_GAME_SCAN` 排除空宿主 `close_button_container`。
              2. **【跨 Watchdog `redirectCount` 解鎖與喚醒隱藏 `[▶| Google Play]` 膠囊】**：
                 - `onEnterAdMode(preserveRedirectState = true)` 重置當輪 `redirectCount`／`closeClickCount` 並改以 `redirectPointCounts` 延續同列商店膠囊封鎖；`Step 8B Reveal Swipe` 擴充可玩關鍵字與 12–40s 喚醒機制解決 `JOIN LIVE` 四連強退迴圈；移除 Step 2B `!isGameVisible` 誤退出分支。
              3. **【延後返回防退出桌面、請勿打擾鎖屏 AOD 與 Splash 畫面辨識】**：
                 - `recordAndClick` 點擊關閉／略過鈕後延後 `lastBackActionTimeMs`；`AutoAdAccessibilityService.isDeviceLockedOrNonInteractive` 新增 `Display.state != STATE_ON` 與 `isDeviceLocked` 檢查；`OcrRecognizer.isLockscreenOrAodOcr` 辨識「請勿打擾／開啟」與時鐘狀態並新增 `isLineWalkSplashOrLoadingScreen`；`AutomationEngine` 抑制鎖屏後短暫系統桌面與正確重置待機計時。新增 `V1_15_92SimulationTest`，versionCode 125 / versionName 1.15.92（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
