name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.7 (修正Hide Ad誤觸與優先順序調整版 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.7.0 (Run #${{ github.run_number }})**
            1. **修正誤觸右上角 AdChoices『ⓘ ▷』導致跳出『Hide Ad / Report Ad』選單卡死問題**：
               - 升級幾何 `X` 偵測器（新增正中心筆畫檢查與上下左右 4 向空隙檢查），排除『ⓘ ▷』與喇叭靜音圖示。
               - 新增『Hide Ad / Report Ad / Why am I seeing this ad?』底部選單自動偵測與背景點擊關閉機制，並自動將誤觸座標加入黑名單。
            2. **調整四大分頁巡邏優先順序**：嚴格依照 **1. 移動 (首頁) ➔ 2. 時間 ➔ 3. 遊戲 ➔ 4. 步數** 的順序檢查與領取獎勵！
            3. **保留糖果『跳過廣告』第一優先與『時間』分頁『紅利 [▶] x 1 獲得』辨識**。
            4. **支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
