name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.32 (好友送禮額度修復、防廣告跳轉 Google Play、空禮物盒秒關、賓果 Get 與 BIG 抽抽樂全修復 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.32 (Run #${{ github.run_number }})**
              1. **【好友送禮重大修復：修正 5/5 誤判為額度用罄的重大缺陷】**：
                 - 修正「禮物次數 5/5」誤判為已達上限的錯誤（5/5 代表剩餘 5 次完整額度，0/5 才代表用罄），優先送給清單好友與「送禮物也送自己」！
                 - 空禮物盒視窗（「尚未收到禮物。」）秒速點擊右上角 (X) 關閉，嚴格禁區保護杜絕誤點底層廣告橫幅。
              2. **【徹底根治看廣告跳轉 Google Play 商店】**：
                 - 幾何 X 左上角掃描限定 Meta 廣告套件 (`com.facebook.katana` / `com.facebook.orca`)，Google AdMob / Unity 影音廣告嚴格排除左上角，徹底消除誤點廣告主圖示與 AdChoices 標籤跳轉 Google Play。
                 - 擴充並秒點略過按鈕（「可略過廣告」、「略過廣告」、「Skip Ad」等），覆蓋頂部熱區，略過一出即刻點擊。
              3. **【每日賓果連線獎勵 Get 極速領取】**：
                 - 點擊 Get 連線獎勵時保持在主巡邏迴圈，不再反覆跳轉彈窗等待流程，各欄位連續極速點擊領取，整體耗時由 25 秒銳減至 5 秒！
              4. **【BIG 抽抽樂 50 抽看廣告 [x1 獲得] 正常領取】**：
                 - 剔除中獎結果標題偽陽性比對，等待真實中獎彈窗浮現後精準點擊綠色 [x1 獲得] 看廣告領取票券。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
