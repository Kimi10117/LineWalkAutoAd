name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.7 (徹底修復冷卻彈窗「等待彈窗(1/3)」卡死迴圈、秒按取消並流暢切換分頁 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.7 (Run #${{ github.run_number }})**
              1. **【徹底修復「時間分頁冷卻彈窗卡在『等待彈窗 (1/3)...』不按取消」的卡死迴圈】**：
                 - **根本原因**：先前 `findPopupCancelButton` 在檢查是否有尚未領取的有效廣告按鈕時，包含文字 `紅利`。然而「時間」分頁冷卻中的白底黑框按鈕左上方仍固定印有 `紅利` 標籤，且先前的冷卻文字檢查範圍僅為 ±20px，未能涵蓋按鈕內部下方的「回復還需 00:13:43」，導致判定為「尚有有效按鈕不可取消」，`findPopupCancelButton` 永遠回傳 null。進而導致引擎在 `IN_GAME_SCAN` 與 `TRIGGER_AD_POPUP` 間無限迴圈，懸浮視窗持續顯示 `⏳ 等待彈窗 (1/3)...` 卻永遠無法點擊 [取消]！
                 - **全方位修復措施**：
                   1. **剔除獨立「紅利」文字干擾**：從有效按鈕判斷中移除單純包含「紅利」的判定，並加入反灰按鈕檢測（`isPopupButtonDisabledGray`）。
                   2. **動態擴大冷卻辨識垂直範圍**：將垂直冷卻檢測區域由固定 20px 調整為依螢幕比例縮放的 `btnMarginY`（約 5% 螢幕高度），完整包覆按鈕內部多行文字（涵蓋「回復還需」、「還需」、「00:xx」倒數）。
                   3. **移除不必要的 2 次等待延遲**：在彈窗確認處於冷卻（出現回復還需或按鈕反灰且下方有取消鈕）時，第 1 次 Tick 即立即點擊【取消】，不再拖延 3 次循環！
                   4. **立即切換至下一分頁**：點擊 [取消] 關閉彈窗後，立即將當前分頁標記為冷卻完畢，並主動切換至下一分頁（遊戲、步數）繼續巡邏，徹底杜絕停滯卡死！
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
