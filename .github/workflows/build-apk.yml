name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.86
          git push -f origin latest-apk || true
          git push -f origin v1.15.86 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.86 (左下角倒數識別、停用試玩誤滑、商店雙層返回與 IN_GAME_SCAN D3C 迴圈阻斷 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.86 (Run #${{ github.run_number }}) - 左下角倒數識別、停用試玩誤滑、商店雙層返回與 IN_GAME_SCAN D3C 迴圈阻斷 (相容歷代版本 v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【底部角落圓形倒數識別與停用破壞性試玩滑動】**：
                 - `OcrRecognizer.detectAdCountdownSeconds` 擴大支援底部角落 (`cy >= 85%`) 圓形倒數並剝除括號噪字 (`36)` -> `36`)；Step `8B`（`Reveal Swipe`）移除 `"Drag"`/`"Tap"`/`"Swipe"` 等詞並排除商店與 `CLAIM!` 畫面，杜絕試玩廣告反覆滑動觸發跳轉商店。
              2. **【左上角 `[▶| Google Play]` 偏左熱區與商店雙層 `Back` 返回】**：
                 - 優先點擊 `[▶| Google Play]` 左側 `[▶|]` 圖示熱區；`handleExternalAppGuard` 針對 Google Play Half-Sheet + Store 雙層架構自動補發第 2 次 `safeNavigateBack` 並清除過期 `lastClickedAdLabel`。
              3. **【`[Google Play ×]` 兩段式解鎖與 `IN_GAME_SCAN` `D3C` 迴圈阻斷】**：
                 - `[Google Play ×]` 首次點擊改走 2.0s + 2x Back 商店緩衝解鎖，二次點擊失敗即永久封鎖；`isLineWalkMainScreenVisible` 拒認含商店/問卷廣告特徵畫面；`IN_GAME_SCAN` `D3C` 加入冷卻、商店廣告與黑名單雙重防護，且 45 秒重進 `AD_WATCHING` 保留重定向黑名單，徹底消除 `Play=10` 無限迴圈。
              4. **【單元測試與版本升級】**：
                 - 新增 `V1_15_86SimulationTest`（4 項雙機回歸測試），versionCode 119 / versionName 1.15.86（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.86)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.86
            name: "散步趣助手 v1.15.86 (左下角倒數識別、停用試玩誤滑、商店雙層返回與 IN_GAME_SCAN D3C 迴圈阻斷)"
            body: |
              **散步趣助手 v1.15.86 (Run #${{ github.run_number }}) - 左下角倒數識別、停用試玩誤滑、商店雙層返回與 IN_GAME_SCAN D3C 迴圈阻斷**
              1. **【底部角落圓形倒數識別與停用破壞性試玩滑動】**：
                 - `OcrRecognizer.detectAdCountdownSeconds` 擴大支援底部角落 (`cy >= 85%`) 圓形倒數並剝除括號噪字 (`36)` -> `36`)；Step `8B`（`Reveal Swipe`）移除 `"Drag"`/`"Tap"`/`"Swipe"` 等詞並排除商店與 `CLAIM!` 畫面，杜絕試玩廣告反覆滑動觸發跳轉商店。
              2. **【左上角 `[▶| Google Play]` 偏左熱區與商店雙層 `Back` 返回】**：
                 - 優先點擊 `[▶| Google Play]` 左側 `[▶|]` 圖示熱區；`handleExternalAppGuard` 針對 Google Play Half-Sheet + Store 雙層架構自動補發第 2 次 `safeNavigateBack` 並清除過期 `lastClickedAdLabel`。
              3. **【`[Google Play ×]` 兩段式解鎖與 `IN_GAME_SCAN` `D3C` 迴圈阻斷】**：
                 - `[Google Play ×]` 首次點擊改走 2.0s + 2x Back 商店緩衝解鎖，二次點擊失敗即永久封鎖；`isLineWalkMainScreenVisible` 拒認含商店/問卷廣告特徵畫面；`IN_GAME_SCAN` `D3C` 加入冷卻、商店廣告與黑名單雙重防護，且 45 秒重進 `AD_WATCHING` 保留重定向黑名單，徹底消除 `Play=10` 無限迴圈。
              4. **【單元測試與版本升級】**：
                 - 新增 `V1_15_86SimulationTest`（4 項雙機回歸測試），versionCode 119 / versionName 1.15.86（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
