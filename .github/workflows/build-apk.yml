name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.19 (修復任務面板卡住、完整支援特別/每日/每週三大分頁切換 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.19 (Run #${{ github.run_number }})**
              1. **【徹底修復任務面板卡住問題：實心綠色按鈕嚴格驗證】**：
                 - **拒絕空心白底「挑戰」按鈕**：徹底解決「特別」分頁中未完成的「向好友發送1次App邀請 [挑戰]」按鈕因具備綠色邊框被誤認為「領取」按鈕，導致陷入重複點擊、無法切換分頁卡住之問題。
                 - **雙重實心綠特徵校驗**：領取按鈕必須同時滿足綠色填滿率（$\ge 45\%$）與左右兩側實心綠背景檢驗（空心「挑戰」兩側為純白背景，直接排除），確保 100% 只點擊真正已完成的「領取」按鈕！
              2. **【完整支援任務三大分頁切換與紅點領取】**：
                 - **三繁體分頁架構升級**：將原雙分頁擴充為完整的「特別」、「每日」、「每週」三大分頁自動巡檢。
                 - **動態膠囊定位**：精準偵測當前選中的黑色膠囊位置（左側特別、中央每日、右側每週），各分頁依序檢查領取。
                 - **自動切換與關閉**：當前分頁無可領取項目時，自動平滑切換至下一分頁領取（包括有紅點提示的「每日」與「每週」）；三大分頁全部領取完畢後，自動點擊右上角 (X) 關閉視窗並推進巡邏階段。
              3. **【抽抽樂中獎結果金幣票券最大化】**：
                 - 延續 v1.15.18 多層級連續實心綠行分析，抽中獎勵絕對優先觀看廣告獲得票券，看完廣告自動關閉結果視窗。
              4. **【懸浮控制視窗文字自然換行與防截斷】**：
                 - 延續 v1.15.17 動態副標獨立排版（最多 2 行換行、自動過濾多餘標籤），排版簡潔不切字。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
