name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.40 (修復每日賓果開格冷卻誤判與廣告跳轉Play商店死循環 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.40 (Run #${{ github.run_number }})**
              1. **【修復每日賓果開格被頂部定期計時器誤判冷卻之缺陷】**：
                 - 頂部綠色橫幅「距離下次抽選還有 XX 分鐘 XX 秒」（y < 0.35f）為遊戲系統每 30 分鐘生成新機會的定時器，非實體按鈕冷卻。先前版本誤將橫幅倒數作為開格按鈕的一票否決條件，導致畫面有可用橘色按鈕卻直接關閉視窗。
                 - 本版重構為：當畫面上存在實體亮橘色按鈕（OCR「立即開啟/開啟賓果格」或 2D 橘色按鈕聚類特徵）且非禁用灰色時，無條件優先點擊開格；冷卻倒數檢測嚴格限制在按鈕熱區內，確保所有可用賓果格皆能順暢開完！
              2. **【修復影音廣告誤觸右上角跳轉 Google Play 與抽抽樂免費抽死循環】**：
                 - 修正廣告關閉流程：將倒數計時防護 (`detectAdCountdownSeconds`) 提升至快轉略過按鈕偵測器之前。當廣告尚在倒數計時（`remainingSec > 1`）時，嚴格保持靜候，杜絕誤點 AdChoices / 靜音按鈕跳轉至 Google Play (`com.android.vending`)！
                 - 快轉按鈕偵測器延後至 8 秒後且無倒數時才允許觸發；若發生外部跳轉，立即將該點座標永久黑名單。
                 - 抽抽樂巡邏加入每輪免費抽次數防護上限（最多嘗試 2 次），徹底根除看廣告失敗或中斷時陷入無限點廣告的死循環。
              3. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
