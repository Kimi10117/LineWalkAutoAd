name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.16 (全域內部宣傳廣告秒關閉、根治返回鍵跳出桌面、修復略過廣告黑名單 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.16 (Run #${{ github.run_number }})**
              1. **【全域內部宣傳促銷廣告秒關閉 (還沒有邀請好友 實在太可惜了！)】**：
                 - **深入修復**：使用者明確指出，該彈窗為帶點廣告時可能隨機跳出的促銷全螢幕廣告，並非僅出現在好友頁面。
                 - **解決方案**：在 `AdCloserHandler`（廣告監控核心）、`IN_GAME_SCAN`（日常巡邏）、`TRIGGER_AD_POPUP`（廣告觸發）與 `REWARD_CLAIM`（領獎確認）全流程統一納入內部促銷廣告辨識，完全不需等待 30 秒倒數，第一時間直接精準點擊右上角圓形白色 (X) 關閉按鈕，秒速退回遊戲並領取獎勵！
              2. **【徹底根治「自動按返回鍵跳出回手機桌面」問題】**：
                 - **根本原因**：先前廣告看門狗在播放 5 秒後若無倒數即定期發送返回鍵，但在散步趣前景 (`com.linecorp.LGWALK`) 時發送返回鍵會導致遊戲 Activity 退出至手機桌面。
                 - **嚴格防護**：在 `AutoAdAccessibilityService.safeNavigateBack` 與 `AdCloserHandler` 加入嚴格前景守衛：只要散步趣在前景，絕對禁止發送系統返回鍵，徹底杜絕跳回手機桌面！
              3. **【徹底解決「無法點擊略過廣告」問題】**：
                 - **根本原因**：先前 `recordAndClick` 在同點點擊 2 次後即加入黑名單，當廣告播放過場或動畫延遲時，略過按鈕在 1 秒內即被錯誤封鎖而無法再次點擊。
                 - **解決方案**：明確 OCR「略過廣告」與高信心角落幾何 X 設定為永久允許點擊（`allowBlacklist = false`），黑名單判定放寬至 5 次以上，並全面支援懸浮窗穿透點擊，確保略過廣告按鈕 100% 成功送達！
              4. **【全 App 程式碼 Emoji 零殘留】**：
                 - 全面清除所有剩餘之 Emoji 表情符號，統一改為極簡中括號標籤（如 `[廣告]`、`[完成]`、`[巡邏]`、`[抽獎]`），視覺簡潔專業。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
