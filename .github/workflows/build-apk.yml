name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.47 (支援 InMobi 等廣告右上角高位幾何 X 偵測，徹底解決廣告關不掉問題 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.47 (Run #${{ github.run_number }})**
              1. **【支援 InMobi 等廣告右上角高位 (y=4.8%~8.2%) 幾何 ✕ 偵測，徹底解決廣告關不掉問題】**：
                 - 全螢幕廣告幾何 X 偵測器 (`detectCornerGeometricX`) 新增右上角高位搜尋區間 (`y in 4.8%..8.2%`, `x in 75%..98%`)，解除過往最低限度 `y >= 8.2%` 的死角限制。
                 - 針對 InMobi (如 Ask AI 等廣告)、AppLovin、Unity 等位於狀態列下方角落 (`y ≈ 6.15%`、`x ≈ 91.6%`) 的黑色與白色幾何 `✕` 按鈕，第 1 次 tick 即刻秒速辨識並精準點擊關閉，徹底終結廣告卡死。
                 - 嚴格維持系統狀態列防誤觸（`y < 4.8%` 安全屏障）及賓果右上角 (X) 排除防護機制，確保系統狀態列與遊戲彈窗不受影響。
              2. **【解放非 Meta 廣告末期備援關閉熱區】**：
                 - 修正 `AdCloserHandler` 在 `elapsedSec >= 40` 階段的盲點備援判斷，移除非 Meta 廣告的阻擋條件，允許在倒數結束廣告仍未關閉時，依序對右上角、左上角備援熱區發送點擊，杜絕因部分廣告平台（如 InMobi）攔截/忽略系統返回鍵而導致廣告永久停滯卡死的問題。
              3. **【維持既有防跳轉、抽抽樂、每日賓果與好友送禮全部優化】**：
                 - 抽抽樂 50 抽與免費抽嚴格循序執行、防誤點 Grok 橫幅。
                 - 賓果開格與 Get 獎勵順暢自動領取。
                 - 外部瀏覽器 100% 自動拉回、Persistent Key 相同簽名覆蓋安裝。
            files: LineWalkAutoAd.apk
            prerelease: false
