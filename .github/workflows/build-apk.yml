name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.15 (修復邀請好友彈窗卡住、超緊湊單行文字懸浮窗、文字零折行排版優化 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.15 (Run #${{ github.run_number }})**
              1. **【徹底修復「還沒有邀請好友 實在太可惜了！」彈窗卡住問題】**：
                 - **原因剖析**：該畫面為 LINE LGWALK 宣傳推銷全螢幕/半螢幕彈窗，因文字含有「邀請好友」，先前被誤判為好友排行榜分頁，導致送禮完成後無法關閉。
                 - **精準解決方案**：新增 `isInvitePromoSheet` 專屬辨識，從好友分頁特徵嚴格排除宣傳推銷，並在偵測到該視窗時自動點擊右上角圓形關閉按鈕 (X)，順暢推進巡邏流程。
              2. **【懸浮控制視窗超緊湊單行化（大幅縮減高度）】**：
                 - 依使用者要求，將狀態與執行進度濃縮至單一文字行（如 `1.巡邏中 (9) · 好友送禮完成`），徹底移除多行文字堆疊，高度大減 40%，遊戲畫面不再受阻。
              3. **【APP 介面文字零折行優化】**：
                 - 頂部標題與版本號分離（新增精緻獨立版本膠囊徽章 `v1.15.15`），徹底解決標題在 `(LINE 散步` 斷行問題。
                 - 任務順序全部核取方塊文字精煉為單行（長度控制在 13~22 字以內），杜絕任何孤字跳行折行，排版整齊清爽。
              4. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
