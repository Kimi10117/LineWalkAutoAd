name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.20 (修復送禮看廣告卡【贈送完畢】彈窗、自動開啟收禮抽屜、智能區分實心[領取]與廣告[▶] - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.20 (Run #${{ github.run_number }})**
              1. **【徹底修復送禮看廣告後卡在「贈送完畢」彈窗問題】**：
                 - **自動關閉贈送完成彈窗**：送禮點擊「也送給自己」觀看完廣告返回後，自動偵測「贈送完畢」（已贈送金幣給你自己和XXX）彈窗並立即點擊下方的 [關閉] 按鈕，不再被背景排行榜按鈕誤導，順暢連續贈送下一位好友！
              2. **【修復送禮完成後死循環點擊集點、自動點擊右上角【禮物盒】開箱收禮】**：
                 - **直接開箱收禮**：好友送禮完成後，直接在畫面上點擊右上角【禮物盒】圖示按鈕開啟「禮物」抽屜視窗，不再卡在重複點擊底部「集點」的死循環中！
                 - **解決背景干擾**：修復了收禮抽屜在好友頁面開啟時因背景「排行榜」字樣被錯誤排除的判定問題，確保穩定切換至收禮階段。
              3. **【收禮視窗雙按鈕智慧識別與優先級機制】**：
                 - **最高優先：實心綠色按鈕 [ 領取 ]**：精準偵測「一起送達的禮物」等免看廣告之實心綠按鈕（填滿率高達 98% 以上），以 0 秒廣告時間瞬間領取完所有免廣告禮物！
                 - **次要優先：綠框播放按鈕 [ ▶ ]**：依序點擊「收到XXX送來的禮物囉！」等需觀看廣告的播放按鈕，完整領取好友贈送的金幣。
                 - **支援滾動清單**：當前視窗領取完畢後自動向下滾動清單，確保多筆禮物全部領完後點擊 (X) 關閉抽屜。
              4. **【任務面板與抽抽樂極大化穩定維護】**：
                 - 延續 v1.15.19 任務三繁體分頁（特別/每日/每週）與嚴格實心綠檢驗，抽抽樂廣告獎勵極大化。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
