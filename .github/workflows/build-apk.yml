name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.66
          git push -f origin latest-apk || true
          git push -f origin v1.15.66 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.66 (根除無法載入廣告死鎖、紅利按鈕修復、全機型螢幕自適應 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.66 (Run #${{ github.run_number }}) - 徹底根除無法載入廣告死循環、白底黑框按鈕辨識修復與全機型螢幕自適應 (相容歷代版本 v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除「無法載入廣告」45次無限死循環 (Ad Starvation Guard)】**：
                 - 深度分析實機日誌（連續 45 次觸發無法載入廣告彈窗），建立同分頁廣告載入失敗計數器；
                 - 同一分頁廣告載入失敗累計達 2 次時，判定當前無廣告庫存，關閉彈窗並自動發送安全返回，強制推進至下一分頁，維持全自動巡邏不中斷；
                 - 接入點擊斷路器 (Circuit Breaker)，若錯誤彈窗關閉按鈕連續點擊 3 次無效，自動發送系統返回鍵並強制換頁；
                 - 徹底移除空跑計數無條件歸零與已完成分頁移除，杜絕無限重試陷阱。
              2. **【白底黑框「紅利 [▶] x1 獲得」按鈕誤殺修復 (Zero False-Negative)】**：
                 - 深度診斷發現 isPopupButtonDisabledGray 因紅色素比例不足 (< 15%)，將時間分頁蘋果收成之「白底黑框」按鈕誤判為反灰不可點；
                 - 修正 findPopupBonusBadgeAdButton、AutomationEngine、OcrRecognizer 與 AdCloserHandler，豁免白底黑框按鈕之全粉紅檢驗，只要具備鮮紅「紅利」標籤即判定有效可點；
                 - 按鈕點擊區域重構為寬度 15%~85%、高度居中自適應，確保 100% 準確點擊。
              3. **【全機型螢幕動態邊界自適應（Galaxy Z Flip5 22:9 完美覆蓋）】**：
                 - 擴展 findAdLoadErrorCloseButton 綠色按鈕採樣 Y 軸區間至 0.58f..0.76f，X 軸 0.15f..0.85f；
                 - 實作綠色像素動態外框採樣（動態計算 MinX, MaxX, MinY, MaxY），徹底解決固定坐標在 22:9 超長折疊螢幕點偏問題；
                 - 擴大錯誤提示關鍵字涵蓋：「無法載入廣告」、「請稍後再試」、「無法播放」、「廣告播放失敗」、「連線逾時」。
              4. **【廣告載入黑幕偵測優先級重構】**：
                 - isAdLoadingScreen 將「載入中」、「廣告載入」等文字檢查提升至最優先，防止半透明黑幕透出背景遊戲文字時被一票否決。
              5. **【全域 0 Emoji 零容忍與繁體中文落實】**：
                 - 嚴格稽核所有代碼、註解、日誌、Commit 與 Release Notes，確保 0 Emoji 且 100% 繁體中文。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.66)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.66
            name: "散步趣助手 v1.15.66 (根除無法載入廣告死鎖、紅利按鈕修復、全機型螢幕自適應)"
            body: |
              **散步趣助手 v1.15.66 (Run #${{ github.run_number }}) - 徹底根除無法載入廣告死循環、白底黑框按鈕辨識修復與全機型螢幕自適應 (相容歷代版本 v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除「無法載入廣告」45次無限死循環 (Ad Starvation Guard)】**：
                 - 深度分析實機日誌（連續 45 次觸發無法載入廣告彈窗），建立同分頁廣告載入失敗計數器；
                 - 同一分頁廣告載入失敗累計達 2 次時，判定當前無廣告庫存，關閉彈窗並自動發送安全返回，強制推進至下一分頁，維持全自動巡邏不中斷；
                 - 接入點擊斷路器 (Circuit Breaker)，若錯誤彈窗關閉按鈕連續點擊 3 次無效，自動發送系統返回鍵並強制換頁；
                 - 徹底移除空跑計數無條件歸零與已完成分頁移除，杜絕無限重試陷阱。
              2. **【白底黑框「紅利 [▶] x1 獲得」按鈕誤殺修復 (Zero False-Negative)】**：
                 - 深度診斷發現 isPopupButtonDisabledGray 因紅色素比例不足 (< 15%)，將時間分頁蘋果收成之「白底黑框」按鈕誤判為反灰不可點；
