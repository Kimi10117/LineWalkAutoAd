name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.8 (每日賓果/抽抽樂50抽/任務/好友送禮全功能版 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.8.0 (Run #${{ github.run_number }})**
            1. **【抽抽樂】智慧抽獎（依使用者規則）**：
               - 優先 50 抽：若票券滿 50 張且 50 抽按鈕可用，最優先執行 50 抽看廣告/抽獎！
               - 次選免費抽：若不滿 50 抽或 50 抽次數用盡，自動點擊「免費抽1次」看廣告免費抽！
               - 嚴禁點 5 張：嚴格過濾並禁止點擊「5張 抽1次」按鈕！
            2. **【每日賓果】自動開格與連線獎勵**：
               - 自動檢查並領取「1/3/5/8 BINGO」下方紅底「Get / ▶ Get / 領取」連線獎勵！
               - 自動點擊「立即開啟賓果格」開格。
            3. **【任務】全分頁自動領取**：
               - 逐一檢查「每日」、「每週」、「特別」分頁，自動點擊所有綠色「領取」按鈕（避開未完成的「挑戰」按鈕）。
            4. **【好友排行榜送禮】（優先送禮也送自己）**：
               - 自動切換至底部「好友」頁面，逐一為好友排行榜名單贈送禮物。
               - 彈窗出現時，最優先選擇「送禮物也送自己」（觀看廣告雙方獲取獎勵）！
               - 自動平滑向下滾動清單，直到所有好友皆贈送完畢後自動返回主頁。
            5. **【糖果按鈕略過】**：首頁獲得金幣下方的「糖果」按鈕依需求略過不點。
            6. **支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
