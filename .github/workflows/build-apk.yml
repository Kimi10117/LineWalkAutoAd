name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.9 (徹底解決抽抽樂中獎彈窗廣告計數暴增死循環、加速彈窗判斷與修復任務循環 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.9 (Run #${{ github.run_number }})**
              1. **【徹底根除抽抽樂中獎結果「完成:48」無限累加與死循環】**：
                 - **根本原因診斷**：
                   1. 在抽抽樂中獎結果彈窗點擊綠色 `[▶ 🎫 x1 獲得]` 進入廣告監控後，廣告 SDK 剛開始載入或尚未展開全螢幕，畫面仍停留在抽抽樂介面。
                   2. `AdCloserHandler` 先前在第 1 秒 (`elapsedSec >= 1`) 即判定遊戲畫面可見，誤宣告已回到遊戲並退出廣告監控，導致累計完成次數在幾秒內被狂刷數十次！
                   3. 回到主循環時，中獎彈窗仍開啟中且未記錄已點擊過廣告獲票，導致引擎再次點擊綠色獲票按鈕，形成每秒一次的超高速死循環！
                 - **修復方案**：
                   1. **引入實際廣告播放狀態追蹤 (`hasAdActuallyShown`)**：在廣告尚未實際顯示前，嚴禁在第 1 秒誤判回到遊戲；若 4 秒以上確認廣告完全未啟動，安全退出且絕不累計完成次數。
                   2. **抽抽樂廣告獲票嚴格單次限制 (`hasClickedLotteryAdReward`)**：每輪抽抽樂結果彈窗嚴格限制僅點擊一次 `[▶ 🎫 x1 獲得]`，若已點過或無廣告，自動點擊彈窗底部的 `[關閉]` 關閉結果視窗，順暢推進抽獎與巡邏！
              2. **【大幅加速判斷是否有廣告可看的反應時間】**：
                 - 縮短彈窗等候確認時間（由 3 次 tick 降至 2 次），快速決策並減少等待空白時間，大幅提升整體巡邏流暢度。
              3. **【徹底修復任務面板反覆開關死循環問題】**：
                 - 移除 `isMissionDialogOpen` 中過度寬鬆的底層深色像素檢驗，防止在一般介面誤判為任務彈窗。
                 - 修正任務面板右上角關閉 (X) 圓形按鈕熱區座標，確保檢查完「特別」與「每日」分頁後確實關閉視窗。
                 - 任務標記完成後，若畫面仍殘留視窗，直接關閉不再重複切換分頁。
              4. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
