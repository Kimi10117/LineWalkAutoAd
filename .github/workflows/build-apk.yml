name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.0 (修復廣告載入中誤按取消輪迴、支援廣告伺服器緩衝等待與載入逾時防護 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.0 (Run #${{ github.run_number }})**
              1. **【徹底根治「廣告載入中」誤按取消導致無限重試輪迴 Bug】**：
                 - **解決問題**：在賓果點擊「立即開啟賓果格」或各分頁點擊「看廣告獲得」後，LINE Walk 會向伺服器請求廣告並顯示半透明黑底遮罩「載入中... 若廣告載入時間過長，請嘗試重新啟動應用程式」以及底部白底膠囊 [取消] 按鈕。先前因冷卻彈窗檢查邏輯在 2 秒後誤將該 [取消] 按鈕判定為冷卻完成，進而直接點擊 [取消] 取消廣告載入回到畫面，造成「點擊看廣告 ➔ 載入中 ➔ 誤按取消 ➔ 重新點看廣告 ➔ 誤按取消」之無限死循環！
                 - **新增專屬廣告緩衝等待狀態 (`AdStepResult.AdLoading`)**：
                   全方位偵測「載入中」、「廣告載入」、「載入時間過長」、「重新啟動應用程式」，在載入等待期間（最長 18 秒）嚴禁點擊任何 [取消] 按鈕，浮動視窗明確顯示「⏳ 廣告向伺服器載入中 (Xs)，請稍候...」，靜候伺服器完成廣告影片加載。
                 - **流暢接軌廣告播放與保護期重置**：
                   一旦廣告加載完畢進入實際播放畫面，即刻自動重置計時起點，確保廣告享有完整的播放保護期（Grace Period）與倒數計時監控。
                 - **18 秒廣告庫存逾時安全防護機制**：
                   若伺服器確實無廣告庫存或網路逾時達 18 秒，自動點擊畫面 [取消] 按鈕安全退回遊戲，並自動推進至下一項任務或關閉子視窗，避免在無廣告時無限卡死。
                 - **多層級排除主畫面與取消按鈕誤判**：
                   在 `isLineWalkMainScreenVisible`、`findPopupCancelButton` 與 `isGameScreenVisible` 中全面增設 `isAdLoadingScreen` 守衛，確保載入期間 100% 不會被誤判為主畫面或冷卻彈窗。
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
