name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.1 (修復每日賓果連線領取後卡死、排除已領取綠旗Get標籤誤判、正常推進開啟賓果格 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.1 (Run #${{ github.run_number }})**
              1. **【徹底修復「每日賓果」第一條線領取後卡死問題】**：
                 - **解決問題**：當「每日賓果」達成連線（如 1 BINGO）並點擊紅色膠囊按鈕 `[▶ Get]` 領取獎勵後，遊戲畫面上的紅色按鈕會消失，轉變成插綠旗的「已達成標籤」（圖案為綠色旗幟與底下的純黑色 `Get` 文字）。
                 - **根除誤判已領取標籤為未領取按鈕**：
                   先前的連線獎勵偵測在 OCR 備援中只比對文字包含 `Get`，導致 1 BINGO 領取完成後，程式不斷把插綠旗的已領取標籤 `Get` 誤認為還有連線未領取，持續點擊該純文字標籤並進入廣告監控，無法執行下一步「立即開啟賓果格」！
                   現在重構連線獎勵偵測：
                   1. 優先嚴格比對各直欄的紅色膠囊按鈕，紅色像素數必須達標。
                   2. OCR 備援檢查時，強制驗證該文字區域內必須為紅色按鈕底色，100% 排除已領取的白底黑字綠旗 `Get` 標籤！
                 - **移除廣告監控畫面回到遊戲之誤判阻塞條件**：
                   移除 `isGameScreenVisible` 中盲目比對 `Get` 字樣判定廣告未結束的邏輯，避免因畫面殘留已領取之 `Get` 標籤而阻止辨識回到賓果視窗。
                 - **順暢推進開格流程**：
                   連線獎勵領取完成後，程式立即正確識別已無未領取連線，順利點擊橘色「立即開啟賓果格」看廣告開格！
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
