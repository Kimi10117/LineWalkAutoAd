name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.30 (全面支援 Meta 輪播廣告左上角關閉按鈕、放行頂部角落幾何 X 偵測、完美兼顧影音倒數靜候與靜態廣告極速關閉 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.30 (Run #${{ github.run_number }})**
              1. **【重大支援：全面攻克 Meta 輪播廣告左上角關閉 (X) 按鈕】**：
                 - **深入比對使用者截圖**：Meta Audience Network 輪播廣告（如 Trip.com、Shopee）之灰色關閉按鈕 (X) 固定位於螢幕**左上角** (`x ~ 7.6% sw, y ~ 6.6% sh`)。
                 - 先前版本因將左上角關閉偵測關閉 (`includeLeftZone = false`) 且全域禁區設為 `y < 7.5% sh`，導致助手對左上角的 Meta 關閉按鈕視而不見，停滯在「廣告監控播放中 (23s)」。
                 - **精確調整與全面支援**：
                   1. 幾何 X 偵測器全面啟動左上角掃描 (`includeLeftZone = true`)，涵蓋 `x in 2%..20% sw, y in 4.5%..24% sh`。經演算法實際測試使用者截圖，以 **101.4 分** 完美命中左上角灰 X！
                   2. 頂部系統狀態列安全線調整為 `y < 4.2% sh`，完美放行位於 `y: 5%..9% sh` 的頂部角落合法關閉按鈕。
                   3. 備用角落熱區加入「螢幕左上角熱區」，雙重保障 Meta 廣告 100% 成功關閉！
              2. **【影音廣告與靜態/輪播廣告完美兼顧】**：
                 - **影音廣告**：只要畫面有倒數計時（「還有 15 秒」），100% 遵循 v1.7.0 原則靜候播放，絕不碰觸螢幕、絕不跳轉商店。
                 - **靜態/輪播廣告**：無倒數計時，5 秒後自動啟動左上角/右上角幾何 X 辨識，精準秒速關閉，領獎零卡死！
              3. **【無障礙節點白名單封鎖 Discord / Google Play】**：
                 - 嚴格拒絕來自 `com.discord`、`com.android.systemui`、`com.android.vending` 的節點，移除 `applovin` 與 `dismiss`，徹底消除跳出外部 App。
              4. **【金幣 100% 穩定入帳】**：
                 - 廣告全程不被中斷，正常播畢回傳獎勵，金幣 100% 穩定領取入帳！
              6. **【每日賓果重構與徹底消除開關輪迴】**：
                 - 處於賓果彈窗時完全停用宣傳幾何 X 偵測，消除開關輪迴。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻或今日上限，再依序掃描領取所有直欄「Get」獎勵並鎖定狀態。
              7. **【第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin 等 12 大套件。
                 - 前景為廣告套件時 100% 阻斷返回鍵，確保廣告完整播放並順利領取獎勵。
              8. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              9. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
