name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.48 (滑動喚醒隱藏廣告按鈕、根除誤點 Google Play 標籤與抽抽樂 50 抽死鎖 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.48 (Run #${{ github.run_number }})**
              1. **【自動滑動喚醒隱藏控制項，徹底解決略過/關閉按鈕消失問題】**：
                 - 針對 Google Play 互動式廣告、可玩式試玩廣告及各類全螢幕廣告中，略過/關閉按鈕與倒數條於數秒無觸控後自動隱藏淡出的機制，新增自動短滑喚醒手勢（Keep-Alive / Reveal Swipe）。
                 - 當廣告播放超過 5 秒且畫面上無可見關閉按鈕時，每 3.5 秒於螢幕中下部自動派發 200ms 短滑手勢，精準喚醒 ad container 隱藏之略過按鈕與 (X) 按鈕，使視覺偵測器與 OCR 能即時捕獲並點擊關閉。
              2. **【嚴格排除 Google Play 左上角標籤防誤點跳轉】**：
                 - 全面攔截左上角 `[▶| Google Play]` 膠囊按鈕，禁止 OCR 將其誤判為略過按鈕 (`>|`, `▶|`)，杜絕誤點開啟 Google Play 商店。
                 - 嚴格校正 Meta 廣告判定條件，當畫面出現 Google Play 標籤時一票否決 Meta 判定，嚴禁對左上角發送 Meta 備援熱區，徹底消除重定向死循環。
              3. **【抽抽樂 50 抽次數上限保護與平滑切換免費抽】**：
                 - 抽抽樂 50 抽新增每輪點擊次數保護 (`lotteryFiftyDrawAttempts >= 2`)，當票券不足（< 50 張）或已達上限時，立即停止無效點擊，自動無縫切換至第二順位「免費看廣告抽一次」；兩者均完成或冷卻時正常關閉視窗，徹底根除連續狂點 50 抽的死鎖迴圈。
              4. **【End Card 廣告結束卡片安全返回鍵相容性增強】**：
                 - 廣告結束卡片安全返回鍵放行散步趣內部 AdMob 廣告容器，確保播放完畢卡在結束頁面時能順利按返回鍵關閉回到散步趣領取獎勵。
            files: LineWalkAutoAd.apk
            prerelease: false
