name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.14.7 (修復廣告結束頁無法略過/卡死、時間戳記精確返回、日文廣告支援、懸浮窗秒數即時更新 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.14.7 (Run #${{ github.run_number }})**
              1. **【徹底根治「一直卡在這個畫面 無法點擊略過」嚴重問題】**：
                 - **時間戳記精確控制系統返回 (service.navigateBack())**：
                   根治先前在廣告播放超過 6 秒時，使用離散整數秒數比對 (`elapsedSec in listOf(6, 10, 14...)`)，因每輪截圖+OCR耗時 1.5s~2.5s 而經常跳過觸發時機的嚴重競態條件 bug！
                   改為基於高精度時間戳記間隔控制，在無倒數計時（如 LY Corporation、Google AdMob、Unity 等各家 SDK 的靜態結束頁 / 互動廣告推廣頁）且播放滿 5 秒後，每 3.5 秒精確發送一次系統返回鍵，迅速觸發 SDK 內部 `onAdDismissedFullScreenContent` 關閉廣告退回遊戲，告別卡死與乾等！
                 - **全面支援日文廣告與退出確認對話框**：
                   新增日文關鍵字支援（`スキップ`、`閉じる`、`広告をスキップ`、`広告を閉じる`、`あと` 倒數、`インストール`、`リワードを獲得しました` 等），並在退出確認對話框出現時自動點擊「離開廣告 / 退出 / 放棄 / 確認 / 確定 / 關閉」。
                 - **頂部標準與黑邊延伸熱區雙重備援**：
                   右上角熱區延伸涵蓋標準頂部與黑邊頭部區域（y=5%~11%），並嚴格防範點擊左上角 `▶| Google Play` 惡意跳轉按鈕。
                 - **廣告監控狀態懸浮窗秒數即時刷新**：
                   修復先前懸浮窗凍結在「👆 已點關閉，確認中...」的顯示問題，每秒即時顯示「📺 監控中 (Xs)...」與「🛡️ 嘗試關閉 (Xs)...」，執行狀態一目了然！
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
