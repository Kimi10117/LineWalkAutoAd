name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.18 (抽抽樂結果優先看廣告獲票、金幣票券最大化 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.18 (Run #${{ github.run_number }})**
              1. **【抽抽樂中獎結果金幣票券最大化：優先看廣告獲票】**：
                 - **修復提早關閉彈窗問題**：徹底修復抽完獎彈出「4獎 50枚金幣中獎囉！」結果彈窗時，因辨識誤判或過早判定導致直接點擊 [關閉] 按鈕的問題。
                 - **多層級連續實心綠鈕分析**：精準鎖定綠色膠囊按鈕 `[ ▶ 🎫 x1 獲得 ]`（連續取樣高密度 LINE 鮮綠像素），完美排除下方「分享給好友」綠色邊框雜訊干擾。
                 - **嚴格守衛機制**：抽獎結果彈窗出現時，若尚未觀看獲票廣告，**嚴格禁止**直接點擊關閉按鈕；加入安全確認等待機制，確保絕對優先點擊綠色獲票廣告按鈕！
                 - **完整領取循環**：看完整廣告關閉後回到結果彈窗，自動點擊底部 [關閉] 返回抽抽樂主面板，繼續下一輪 50 抽或免費抽，達成票券與金幣收益最大化！
              2. **【中央領獎彈窗防誤關閉守衛】**：
                 - `findCenterRewardModalCloseButton` 加入抽抽樂結果畫面防護，避免全域通用領獎邏輯在抽抽樂彈窗中搶先點擊 [關閉]。
              3. **【懸浮控制視窗文字自然換行與防截斷】**：
                 - 延續 v1.15.17 動態副標獨立排版（最多 2 行換行、自動過濾多餘標籤），排版簡潔不切字。
              4. **【全域內部促銷廣告秒關與前景返回鍵守衛】**：
                 - 保持即時辨識秒關「還沒有邀請好友 實在太可惜了！」促銷彈窗，並禁止對散步趣前景發送返回鍵。
              5. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
