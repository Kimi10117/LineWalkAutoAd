name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.10 (修復好友排行榜送禮卡住、精準點擊綠色禮物符號與也送給自己看廣告 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.10 (Run #${{ github.run_number }})**
              1. **【完美修復好友排行榜送禮卡住與「也送給自己」功能】**：
                 - **根本原因診斷**：
                   1. **按鈕聚類黏合**：先前綠色像素分群窗口過大，好友 1 (黃小鬼) 與好友 2 (格格) 因行距僅 20px 被合併成一個聚類，中心點落在兩列中間的空白處 (Y=498)，點擊無效且誤記為已贈送，導致卡死在好友排行榜！
                   2. **彈窗型態誤判**：送禮確認彈窗（『要向...贈送金幣嗎？』）開啟時，暗色背景導致 `ReceiveGiftTask` 誤將標題「禮物」判定為接收禮物視窗，發生狀態打架。
                   3. **看廣告字串判斷遺漏**：原條件比對 `contains("送自己")`，但介面字串為「也送給自己」(中間有「給」)，導致條件不成立而未進入廣告監控模式。
                 - **修復方案**：
                   1. **相鄰像素間距分群 (Gap-based Clustering)**：間隔嚴格限制於 8~15px 內，精準獨立識別好友 1 (359, 484)、好友 2 (359, 554)、好友 4 (359, 694) 的正中心點！
                   2. **彈窗互斥與優先級隔離**：`ReceiveGiftTask` 嚴格排除好友送禮特徵，`FriendGiftTask` 優先捕捉送禮彈窗。
                   3. **雙重鎖定「也送給自己」按鈕**：以 OCR 文字 + 綠色膠囊按鈕雙重偵測，點擊後確實進入廣告監控狀態，完整觀看廣告獲取雙方金幣！
                   4. **清單向下自動滾動**：畫面上可見好友送完後自動滑動清單搜尋更多好友，並於每次滑動後重置快取，送完全部好友後才自動返回首頁進行收禮！
              2. **【浮動視窗狀態即時更新】**：
                 - 送禮各階段即時顯示進度（`🎁 贈送禮物中...`、`🎁 送禮也送自己...`、`📜 滾動好友清單...`、`🎉 好友送禮完成`），不再停滯於進入好友提示。
              3. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
