name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.81
          git push -f origin latest-apk || true
          git push -f origin v1.15.81 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.81 (懸浮輔助防誤判、LINE 宣傳廣告雙向關閉與倒數凍結自癒升級 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.81 (Run #${{ github.run_number }}) - 懸浮輔助防誤判、LINE 宣傳廣告雙向關閉與倒數凍結自癒升級 (相容歷代版本 v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【動態島與懸浮輔助套件防誤觸保護】**：
                 - 新增被動懸浮／輸入法輔助套件過濾（含 `com.jamworks.dynamicspot` 動態島、`com.android.systemui`、IME、Samsung Edge 等），並於無障礙前景偵測穿透 `TYPE_APPLICATION` 視窗取回真實前景 App，避免誤觸外部保護或中斷廣告判定。
              2. **【LINE 宣傳廣告多尺度幾何偵測與奇偶交替返回】**：
                 - 強化 `findLineInHousePromoCloseButton` 雙尺度幾何 X 偵測搭配視口比例校準備援；於廣告關閉流程與主遊戲掃描加入奇偶交替嘗試機制，必要時直接透過系統返回鍵快速退場。
              3. **【倒數凍結自動解鎖與點擊熔斷器重設】**：
                 - 新增 `isCountdownStuckOrExpired` 自動解除長時間凍結或逾時之廣告倒數鎖定；點擊熔斷器改為超過 20 秒自動歸零，並於巡邏啟停與廣告切換時完整重設狀態。
              4. **【診斷日誌與畫面線索 OCR 摘要淨化】**：
                 - 過濾頂部狀態列（`< 2.8%`）、Pointer Location 遙測數據及父子重複 OCR 字元，並補充 `load=Xs | cd=...` 載入耗時資訊與修正系統返回鍵日誌座標格式。
              5. **【版本號升級】**：
                 - versionCode 114 / versionName 1.15.81（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.81)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.81
            name: "散步趣助手 v1.15.81 (懸浮輔助防誤判、LINE 宣傳廣告雙向關閉與倒數凍結自癒升級)"
            body: |
              **散步趣助手 v1.15.81 (Run #${{ github.run_number }}) - 懸浮輔助防誤判、LINE 宣傳廣告雙向關閉與倒數凍結自癒升級**
              1. **【動態島與懸浮輔助套件防誤觸保護】**：
                 - 新增被動懸浮／輸入法輔助套件過濾（含 `com.jamworks.dynamicspot` 動態島、`com.android.systemui`、IME、Samsung Edge 等），並於無障礙前景偵測穿透 `TYPE_APPLICATION` 視窗取回真實前景 App，避免誤觸外部保護或中斷廣告判定。
              2. **【LINE 宣傳廣告多尺度幾何偵測與奇偶交替返回】**：
                 - 強化 `findLineInHousePromoCloseButton` 雙尺度幾何 X 偵測搭配視口比例校準備援；於廣告關閉流程與主遊戲掃描加入奇偶交替嘗試機制，必要時直接透過系統返回鍵快速退場。
              3. **【倒數凍結自動解鎖與點擊熔斷器重設】**：
                 - 新增 `isCountdownStuckOrExpired` 自動解除長時間凍結或逾時之廣告倒數鎖定；點擊熔斷器改為超過 20 秒自動歸零，並於巡邏啟停與廣告切換時完整重設狀態。
              4. **【診斷日誌與畫面線索 OCR 摘要淨化】**：
                 - 過濾頂部狀態列（`< 2.8%`）、Pointer Location 遙測數據及父子重複 OCR 字元，並補充 `load=Xs | cd=...` 載入耗時資訊與修正系統返回鍵日誌座標格式。
              5. **【版本號升級】**：
                 - versionCode 114 / versionName 1.15.81（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
