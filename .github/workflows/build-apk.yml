name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.13 (修復無X廣告卡死在嘗試關閉30s、避開Google Play徽章誤觸 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.13 (Run #${{ github.run_number }})**
              1. **【徹底修復無關閉鈕廣告 (如 LINE チョッキンズ End Card) 卡在「嘗試關閉 (30s)...」問題】**：
                 - **根本原因診斷**：
                   1. 現代 Google AdMob / 互動式推廣廣告在 30 秒播放完畢進入 End Card（顯示「Install」綠鈕與遊戲宣傳圖）時，畫面本身**完全沒有繪製 [X] 關閉按鈕**，Android 系統官方規範是由系統返回鍵關閉該 AdActivity。
                   2. 舊版先前為了防止跳出桌面，檢查了前景 Package 是否為 `com.linecorp.LGWALK`，但因 AdMob 廣告也是運行在 `com.linecorp.LGWALK` 進程內，導致系統誤把廣告當成遊戲主畫面，**全面攔截並沒收了所有返回鍵**！結果返回鍵從未真正送達廣告，造成廣告在 30 秒卡死無法關閉！
                   3. 先前四角盲點點擊輪替時，左上角熱區恰好覆蓋了畫面頂部的「Google Play」徽章，容易誤觸跳轉至 Google Play 商店。
                 - **修復方案**：
                   1. **放行廣告專用單次安全返回鍵 (Single Back with 2.0s Cooldown)**：在廣告監控狀態下，發送單次精確系統返回鍵關閉 AdActivity，並強制加入至少 2000ms 冷卻間隔，單次返回立即關閉廣告，絕不連擊雙重返回，既能秒關無 X 廣告，又絕不打穿至桌面！
                   2. **徹底移除主畫面巡邏 (IN_GAME_SCAN) 中的返回鍵調用**：杜絕在主畫面意外退出至手機桌面。
                   3. **四角盲點智慧避開 Google Play 徽章**：偵測到頂部有 Google Play 徽章時自動跳過左上角熱區，防止誤開商店。
              2. **【持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）】**。
            files: LineWalkAutoAd.apk
            prerelease: false
