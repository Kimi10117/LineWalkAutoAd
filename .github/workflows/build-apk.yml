name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.45 (修復時間分頁8顆莓果誤點取消未領取、根除好友送禮與收禮頁面輪迴並自動重頭巡邏 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.45 (Run #${{ github.run_number }})**
              1. **【時間(放置)分頁 8 顆莓果領獎防護與廣告載入遮罩精準辨識】**：
                 - 根除誤點「取消」關閉彈窗：當點擊「紅利粉紅看廣告鈕(8幣)」進入廣告載入遮罩（畫面壓暗 45% 並顯示中央白色「取消」膠囊）時，`isPopupButtonDisabledGray` 與 `findPopupCancelButton` 新增彈窗未壓暗白底邊緣校驗（`RGB > 220`），並強化 `isAdLoadingScreen` 視覺遮罩辨識，絕不將壓暗後的領獎彈窗誤判為「冷卻灰色」而誤點取消。
                 - 彈窗滑入等待與重試保護：點擊分頁「獲得票券 / 獲得金幣」後等待 550ms 確保底部彈窗滑入到位；若首次點擊看廣告鈕未成功啟動廣告且彈窗上仍有亮起之領獎按鈕，自動返回重新點擊領取，絕不放棄已收集滿的 8 顆莓果。
              2. **【好友送禮與收禮完成後自動返回集點首頁並重頭開始巡邏】**：
                 - 修正右上角禮物盒紅點掃描區間（限定 `x in 0.868..0.902`），徹底排除左側大聲公（`x ≈ 0.80`）通知紅點誤吸，確保 100% 精準點擊禮物盒。
                 - 修正 `isReceiveGiftDialogOpen` 與 `isOnFriendListSubTab`：收禮抽屜領完最後一筆禮物後仍保持抽屜開啟判定直到點擊右上角 (X) 關閉；移除頂部靜態「好友清單」標籤誤判，杜絕在「排行榜」與「禮物盒」之間無限切換輪迴。
                 - 送禮與收禮全數完成後，自動點擊底部「集點」返回首頁並立即觸發 `handleRoundCompletion` 重置新一輪巡邏，重新從有勾選的第一個項目（如：移動）從頭開始檢查。
              3. **【Persistent Key 簽名維護】**：
                 - 維持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
