name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.72
          git push -f origin latest-apk || true
          git push -f origin v1.15.72 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.72 (修復任務視窗誤判抽抽樂結果死循環與重複開啟死鎖 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.72 (Run #${{ github.run_number }}) - 修復任務視窗誤判為抽抽樂結果死循環與重複開啟死鎖、子彈窗互斥防禦、雙重防死鎖斷路器 (相容歷代版本 v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【任務視窗與抽抽樂中獎結果互斥防護】**：
                 - 頂部巡邏 A-1 抽抽樂中獎判定前置加入 isOtherSubDialogOpenForLottery 子彈窗嚴格互斥條件，確認非任務視窗、賓果視窗、好友視窗或抽屜視窗，才允許抽抽樂邏輯介入。
                 - 任務彈窗直接由專屬 handleMissionDialog 接管，徹底杜絕抽抽樂邏輯誤攔截。
              2. **【抽抽樂中獎結果判定精確化與否定排除】**：
                 - 增加任務面板否定排除：若頂部包含「任務」文字，或包含「特別」「每日」「每週」標籤，一律回傳 false。
                 - 刪除寬鬆之泛用「獎」字比對，改為嚴格正則與中獎詞彙，徹底排除「在首頁領取獎勵」等字樣。
                 - 移除孤立「x1」匹配，要求必須存在明確中獎抬頭才能比對獲票特徵。
              3. **【任務視窗重複開啟防死鎖斷路器】**：
                 - 新增 missionOpenCycleCount 追蹤單輪巡邏開啟任務次數，若單輪重複開啟達 5 次未能完結，自動觸發斷路器強制標記任務完成並推進至下一階段。
              4. **【抽抽樂結果視窗關閉連續失敗斷路器】**：
                 - 若連續嘗試關閉達 6 次無效，自動重設暫存旗標並發送系統安全返回鍵 (BACK)。
              5. **【跨階段抽抽樂暫存狀態完整重設】**：
                 - 推進至下一階段時，自動強制重設所有抽抽樂暫存狀態旗標，防止旗標外洩。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.72)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.72
            name: "散步趣助手 v1.15.72 (修復任務視窗誤判抽抽樂結果死循環與重複開啟死鎖)"
            body: |
              **散步趣助手 v1.15.72 (Run #${{ github.run_number }}) - 修復任務視窗誤判為抽抽樂結果死循環與重複開啟死鎖、子彈窗互斥防禦、雙重防死鎖斷路器 (相容歷代版本 v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【任務視窗與抽抽樂中獎結果互斥防護】**：
                 - 頂部巡邏 A-1 抽抽樂中獎判定前置加入 isOtherSubDialogOpenForLottery 子彈窗嚴格互斥條件，確認非任務視窗、賓果視窗、好友視窗或抽屜視窗，才允許抽抽樂邏輯介入。
                 - 任務彈窗直接由專屬 handleMissionDialog 接管，徹底杜絕抽抽樂邏輯誤攔截。
              2. **【抽抽樂中獎結果判定精確化與否定排除】**：
                 - 增加任務面板否定排除：若頂部包含「任務」文字，或包含「特別」「每日」「每週」標籤，一律回傳 false。
                 - 刪除寬鬆之泛用「獎」字比對，改為嚴格正則與中獎詞彙，徹底排除「在首頁領取獎勵」等字樣。
                 - 移除孤立「x1」匹配，要求必須存在明確中獎抬頭才能比對獲票特徵。
              3. **【任務視窗重複開啟防死鎖斷路器】**：
                 - 新增 missionOpenCycleCount 追蹤單輪巡邏開啟任務次數，若單輪重複開啟達 5 次未能完結，自動觸發斷路器強制標記任務完成並推進至下一階段。
              4. **【抽抽樂結果視窗關閉連續失敗斷路器】**：
                 - 若連續嘗試關閉達 6 次無效，自動重設暫存旗標並發送系統安全返回鍵 (BACK)。
              5. **【跨階段抽抽樂暫存狀態完整重設】**：
                 - 推進至下一階段時，自動強制重設所有抽抽樂暫存狀態旗標，防止旗標外洩。
            files: LineWalkAutoAd.apk
            prerelease: false
