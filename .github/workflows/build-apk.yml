name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.68
          git push -f origin latest-apk || true
          git push -f origin v1.15.68 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.68 (修復賓果糖果彈窗卡住、抽抽樂/任務開啟卡步數分頁與Trip.com廣告關閉 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.68 (Run #${{ github.run_number }}) - 修復每日賓果「1 跳過廣告糖果到手！」彈窗未關閉與綠旗 Get 重複點擊、修復開啟抽抽樂/任務/賓果時誤判為遊戲分頁狂點步數、以及修復 Trip.com Sponsored 左上角 X 與右上角略過鈕連點問題 (相容歷代版本 v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復每日賓果「1 跳過廣告糖果到手！」彈窗未關閉與綠旗黑字 Get 重複點擊】**：
                 - 擴充 `OcrRecognizer.findCenterRewardModalCloseButton` 支援「糖果到手」、「跳過廣告糖果」、「到手！」等賓果與日常獎勵彈窗標題，並解除當前景出現中央白底 `[關閉]` 按鈕時被底層「每日賓果 / 距離下次抽選」一票否決的限制；
                 - 在 `AutomationEngine` 處理賓果視窗前加入前景領獎彈窗優先檢查，確保先點掉中央 `[關閉]` 按鈕再操作或關閉賓果視窗；
                 - 在 `BingoTask.findNextClaimableReward` 強制要求 OCR 匹配 `Get` 時必須同時具備珊瑚粉紅膠囊像素特徵 (`redPoints.size >= 8`)，徹底排除已領取後的「綠色小旗子 + 黑字 Get」。
              2. **【修復開啟抽抽樂 / 任務 / 每日賓果時一直點首頁與步數分頁卡死問題】**：
                 - 重構 `AutomationEngine.ensureOnTabWithDailyIcons`：只要畫面上已出現「賓果 / 抽抽樂 / 糖果 / 任務」日常圖示或位於【首頁 / 步數 / 時間】看板，立即放行並直接點擊目標圖示；
                 - 從遊戲分頁判定中徹底移除會在【首頁 / 步數 / 時間】下方輪播橫幅出現的 `POINTSGAME`、`LINEPOINTS`、`輕鬆賺`、`開始遊玩`，解決因下方橫幅導致誤以為在【遊戲】分頁而無限點擊【步數】分頁的死循環。
              3. **【修復 Trip.com Sponsored 左上角 X 關閉與根治廣告右上角略過鈕連點 6 次】**：
                 - 在 `AdCloserHandler` 中根據 `Sponsored` 標題列高度動態對齊左上角 `X` 點擊座標，並在 `isInvalidOrBlacklisted` 放行左側獨立關閉欄 (`x in 0.030w..0.118w`)，同時相容 `3M` (`y≈0.029h`) 與 `Trip.com` (`y≈0.067h`) 兩種版型，並嚴格封鎖 `x >= 0.118w` 的品牌圓形頭像與下方網址列；
                 - 在 `TemplateMatcher.detectCornerFastForwardSkip` 將頂部掃描邊界調高至 `y >= 4.2%` 嚴格避開系統狀態列圖示，移除會誤判白底廣告右上角靜音喇叭與網址文字的「模式 B」，並限制單支廣告最多嘗試 2 次。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.68)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.68
            name: "散步趣助手 v1.15.68 (修復賓果糖果彈窗卡住、抽抽樂/任務開啟卡步數分頁與Trip.com廣告關閉)"
            body: |
              **散步趣助手 v1.15.68 (Run #${{ github.run_number }}) - 修復每日賓果「1 跳過廣告糖果到手！」彈窗未關閉與綠旗 Get 重複點擊、修復開啟抽抽樂/任務/賓果時誤判為遊戲分頁狂點步數、以及修復 Trip.com Sponsored 左上角 X 與右上角略過鈕連點問題 (相容歷代版本 v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復每日賓果「1 跳過廣告糖果到手！」彈窗未關閉與綠旗黑字 Get 重複點擊】**：
                 - 擴充 `OcrRecognizer.findCenterRewardModalCloseButton` 支援「糖果到手」、「跳過廣告糖果」、「到手！」等賓果與日常獎勵彈窗標題，並解除當前景出現中央白底 `[關閉]` 按鈕時被底層「每日賓果 / 距離下次抽選」一票否決的限制；
                 - 在 `AutomationEngine` 處理賓果視窗前加入前景領獎彈窗優先檢查，確保先點掉中央 `[關閉]` 按鈕再操作或關閉賓果視窗；
                 - 在 `BingoTask.findNextClaimableReward` 強制要求 OCR 匹配 `Get` 時必須同時具備珊瑚粉紅膠囊像素特徵 (`redPoints.size >= 8`)，徹底排除已領取後的「綠色小旗子 + 黑字 Get」。
              2. **【修復開啟抽抽樂 / 任務 / 每日賓果時一直點首頁與步數分頁卡死問題】**：
                 - 重構 `AutomationEngine.ensureOnTabWithDailyIcons`：只要畫面上已出現「賓果 / 抽抽樂 / 糖果 / 任務」日常圖示或位於【首頁 / 步數 / 時間】看板，立即放行並直接點擊目標圖示；
