name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.42 (支援Next Ad多段廣告略過、免費抽倒計時優先、修復賓果誤判好友清單 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.42 (Run #${{ github.run_number }})**
              1. **【支援多段影音廣告「Next Ad ->」秒速跳過，徹底根除跳轉商店】**：
                 - 針對 Google AdMob / YouTube 雙重影音廣告（Ad 1 of 2）左上角浮現之「Next Ad ->」白色膠囊按鈕，全面納入 OCR 與節點識別清單。廣告播放滿 5 秒按鈕出現時立即精準點擊秒速略過，不再卡在廣告枯等 52 秒超時。
                 - 嚴格限制快轉偵測：必須在右上角有 OCR 明確跳過符號（如 `>>`、`▶|`、`Skip`）時才允許觸發，並徹底關閉幾何 X 左側區域掃描，100% 免疫誤觸 AdChoices (i) 或贊助商橫幅跳轉 Google Play (`com.android.vending`)。
              2. **【抽抽樂優先抽取「免費看廣告抽一次」，第一時間啟動倒計時】**：
                 - 重構抽抽樂優先順序：將「免費看廣告抽一次（免費抽1次）」提升為第一優先，只要按鈕可用且非倒計時冷卻中，優先完成免費抽並第一時間啟動倒計時鐘，確保冷卻計時不被耽誤！
                 - 免費抽完成後，若票券充足（>= 50 張）且未冷卻，自動接續執行「50張 抽1次」，嚴格禁止點擊「5張 抽1次」。
              3. **【修復每日賓果誤判好友頁面導致誤點「好友清單」分頁標籤】**：
                 - 根本原因：好友頁面底部廣告橫幅（如「PRE-OPENING」）含有 OPEN，導致賓果判定器誤判好友頁面為每日賓果視窗，並反覆點擊右上角關閉 (X) 區域（座標剛好落在「好友清單」分頁標籤上）。
                 - 修復：賓果視窗判定器加入嚴格一票否決，只要畫面上存在好友頁面特徵（排行榜、好友清單、散步趣好友、送禮彈窗等）一律嚴格排除。
                 - 好友送禮完畢後，透過動態紅點特徵與精準坐標直達好友清單上方頂部 header 的【禮物盒】圖示開啟收禮抽屜，不再誤點好友清單分頁！
              4. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
