name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.11 (賓果Get連線領取、好友也送自己、右上角接收禮物更新 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.11.0 (Run #${{ github.run_number }})**
            1. **【每日賓果 [▶ Get] 自動領取連線獎勵】**：
               - 修正按鈕連通區域演算法，精準鎖定並點擊珊瑚粉紅 [▶ Get] 膠囊按鈕正中心！
               - 廣告監控器支援賓果/好友/任務介面辨識，看完廣告秒回介面絕不空等。
            2. **【好友送禮「▶ 也送給自己」優先選擇】**：
               - 精準辨識彈窗內亮綠色「也送給自己」按鈕，優先點擊看廣告獲取雙方金幣！
            3. **【右上角禮物盒接收好友禮物】**：
               - 新增接收禮物巡邏階段，自動點擊主畫面右上角禮物盒圖示，開啟「禮物」視窗逐一領取好友贈送的禮物！
            4. **【抽抽樂】智慧抽獎（依使用者規則）**：優先 50 抽、次選免費抽、嚴禁點 5 張。
            5. **【任務】全分頁自動領取**。
            6. **【時間分頁取消與巡邏防卡死】**。
            7. **支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
