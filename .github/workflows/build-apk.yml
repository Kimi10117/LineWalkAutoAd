name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          tail -n 200 build_log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          git add build_log.txt
          git commit -m "build failure log [skip ci]" || true
          git push -f origin build-error-log || true

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.25 (頂部動態通知防誤點、每日賓果重構防輪迴、第三方廣告容器全面豁免 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.25 (Run #${{ github.run_number }})**
              1. **【重要修復：系統頂部通知與即時動態（動態島/懸浮通知）嚴格防誤點】**：
                 - 於無障礙點擊層嚴格建立 `y < sh * 0.08f` 頂部安全禁區，除特定收禮圖示外全面攔截頂部誤點。
                 - 幾何關閉按鈕偵測拉升至 `0.082sh` 以上，徹底排除頂部狀態列與即時動態通知。
                 - 重構選單判定，加入多重關鍵字與項目檢驗，絕不誤判通知文字或賓果「抽選」為選單，廢除齒輪盲點，改以安全返回鍵退出。
              2. **【重要修復：每日賓果重構與徹底消除開關輪迴】**：
                 - 消除輪迴：處於賓果彈窗時完全停用宣傳幾何 X 偵測，徹底消除「剛打開賓果又立即被關閉」之無窮輪迴。
                 - 多維特徵識別：解耦背景半透明文字干擾，精確鎖定標題、開格、冷卻倒數、9/9 上限及連線標籤。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻（`距離下次抽選還有`）或達成每日上限（`9/9`），再依序掃描領取所有直欄「Get」獎勵。
                 - 獎勵狀態鎖定：已領取或點擊確認之直欄永久保留於鎖定集合，不再重複點擊。全數無 Get 後點擊 (X) 關閉視窗推進至抽抽樂。
              3. **【重要修復：第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin、Chrome Custom Tabs 等 12 大套件。
                 - 返回鍵絕對保護：無論任何傳參，前景為廣告套件時 100% 絕對阻斷發送系統返回鍵（12/12 套件外洩率 0%）。
                 - 廣告中選單互斥保護：廣告播放期間禁止因廣告素材字樣誤觸選單退出。
                 - 無縫切換：前景偵測到廣告時立即原地切換至廣告監控狀態（`AD_WATCHING`），確保廣告完整播放並領取獎勵。
              4. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              2. **【懸浮視窗開始預設收折為單行膠囊 + 點擊「+」展開】**：
                 - 點擊「開始」時預設自動收折為緊湊單行膠囊，防止遮擋主畫面任何重要資訊與按鈕。
                 - 徹底重構收折佈局：移除所有固定小寬度限制，文字與狀態一律單行完整顯示，不換行、不省略截斷（零出現 ...）。
                 - 增加邊界保護與動態螢幕旋轉適應，點擊「+」即可隨時展開控制面板。
              2. **【離開散步趣 App 嚴格防誤點安全機制】**：
                 - 偵測到當前非散步趣 App 時，嚴禁在外部 App 內隨意亂點任何按鈕。
                 - 僅允許安全發送系統返回鍵 (Back) 或點擊右上角全螢幕廣告 (X)，安全拉回散步趣主畫面。
              3. **【全任務無窮循環巡邏機制】**：
                 - 一輪全任務執行完畢後不再強制停止，自動進入 5 秒冷卻計時（防風控），接著重頭重新檢查所有在 App 內勾選的啟用項目，持續循環直到使用者手動暫停。
              4. **【每日賓果點擊邏輯重構（先開格，再領 Get）】**：
                 - 嚴格依照指示：優先點擊橘色「立即開啟賓果格」直到全部開完（或冷卻/上限中）。
                 - 開格完成後，依序點擊所有連線達成之 [Get] 獎勵，直到所有直欄沒有 Get 可點後，自動點擊右上角 (X) 關閉並推進至下一項目。
              5. **【App 內新增「匯出日誌」與「複製日誌」功能】**：
                 - 在主介面新增「匯出日誌」按鈕（透過系統 Intent 分享，具備安全行數上限防止 Binder IPC 崩潰）與「複製日誌」按鈕，方便後續偵錯與回報。
              6. **【徹底修復好友送禮卡死與自動開啟收禮抽屜】**：
                 - 新增送禮次數上限檢查（偵測 5/5 或今日上限直接判定完成）。
                 - 修復滾動清單時誤清空已送清單導致短清單死循環重複點擊同一位好友的重大問題。
                 - 送禮完成後，自動點擊右上角【禮物盒】開啟收禮抽屜，依序以「直接領取(免看廣告)」與「[▶]看廣告」領取所有禮物。
              7. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
