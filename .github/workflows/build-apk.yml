name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.80
          git push -f origin latest-apk || true
          git push -f origin v1.15.80 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.80 (計時強退防護、OCR 廣告誘餌防禦與直覺控制台升級 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.80 (Run #${{ github.run_number }}) - 計時強退防護、OCR 廣告誘餌防禦與直覺控制台升級 (相容歷代版本 v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【計時器驅動第三方廣告容器強制退回機制】**：
                 - 廣告等待達使用者設定之 `maxAdWaitSeconds` 上限（預設 65 秒）時，記錄螢幕文字快照 `[狀態Snap]` 後強制退回並動態喚醒散步趣回到前景。
                 - 嚴格檢查每次系統返回鍵回傳值與遭拒原因，徹底杜絕假返回日誌。
              2. **【多裝置螢幕比例自適應與視覺按鈕驗證】**：
                 - 支援摺疊機／平板左右黑邊偵測與連續分段線性插值定位；接收好友禮物強制驗證綠色膠囊按鈕像素，避免空點已領完列。
                 - 強化 OCR 廣告誘餌話術過濾（排除「開始遊戲」、「輕鬆賺」、「免費試玩」等誘導廣告字眼）。
              3. **【精簡介面與免學習成本運行控制】**：
                 - 全面拆除舊版現場框選取樣介面與過時範本區塊。
                 - 主設定畫面新增廣告卡死計時器調節（40s ~ 90s）、巡邏掃描速度切換（1000ms / 1200ms / 1500ms）與即時日誌「僅看異常／狀態」過濾／清空按鈕；懸浮膠囊同步顯示計時進度。
              4. **【版本號升級】**：
                 - versionCode 113 / versionName 1.15.80。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.80)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.80
            name: "散步趣助手 v1.15.80 (計時強退防護、OCR 廣告誘餌防禦與直覺控制台升級)"
            body: |
              **散步趣助手 v1.15.80 (Run #${{ github.run_number }}) - 計時強退防護、OCR 廣告誘餌防禦與直覺控制台升級**
              1. **【計時器驅動第三方廣告容器強制退回機制】**：
                 - 廣告等待達使用者設定之 `maxAdWaitSeconds` 上限（預設 65 秒）時，記錄螢幕文字快照 `[狀態Snap]` 後強制退回並動態喚醒散步趣回到前景。
                 - 嚴格檢查每次系統返回鍵回傳值與遭拒原因，徹底杜絕假返回日誌。
              2. **【多裝置螢幕比例自適應與視覺按鈕驗證】**：
                 - 支援摺疊機／平板左右黑邊偵測與連續分段線性插值定位；接收好友禮物強制驗證綠色膠囊按鈕像素，避免空點已領完列。
                 - 強化 OCR 廣告誘餌話術過濾（排除「開始遊戲」、「輕鬆賺」、「免費試玩」等誘導廣告字眼）。
              3. **【精簡介面與免學習成本運行控制】**：
                 - 全面拆除舊版現場框選取樣介面與過時範本區塊。
                 - 主設定畫面新增廣告卡死計時器調節（40s ~ 90s）、巡邏掃描速度切換（1000ms / 1200ms / 1500ms）與即時日誌「僅看異常／狀態」過濾／清空按鈕；懸浮膠囊同步顯示計時進度。
              4. **【版本號升級】**：
                 - versionCode 113 / versionName 1.15.80。
            files: LineWalkAutoAd.apk
            prerelease: false
