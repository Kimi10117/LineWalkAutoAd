name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.64
          git push -f origin latest-apk || true
          git push -f origin v1.15.64 || true
        
      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.64 (修復街機空點37次死鎖、FB落地頁2秒極速返回、全機型22:9螢幕動態適配、死鎖斷路器、無法載入廣告秒關 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.64 (Run #${{ github.run_number }}) - 深度修復桌面錄影與截圖所有卡死與退步問題 (相容歷代版本 v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除遊戲分頁與抽抽樂誤判領獎彈窗死鎖（徹底終結連續空點 37 次）】**：
                 - 深入分析真實錄影 (38bcd248-ac47-4c4d-9b9e-cc960e6eec57.mp4) 與系統日誌，修復街機深藍色機台被誤判為半透明黑幕遮罩、進而對著「LINE 數獨達人」空白處連續空點 37 次領獎彈窗關閉按鈕的嚴重缺陷；
                 - 加入【遊戲】分頁與【抽抽樂】主畫面一票否決機制，且中央領獎彈窗 fallback 必須強制具備「獲得...票券/金幣！」標題文字 OCR 雙重驗證，徹底消除在無彈窗狀態下的盲目點擊；
                 - 徹底杜絕抽抽樂主畫面誤點下方黃色「完成任務 即可獲得 大量金幣！！」廣告橫幅。
              2. **【連續點擊死鎖斷路器 (Circuit Breaker)】**：
                 - 新增點擊狀態監控：若同一個按鈕或座標連續點擊達 3 次且畫面無實質變化，自動觸發安全防死鎖斷路；
                 - 針對彈窗關閉目標，直接發送 Android 系統返回鍵 (BACK) 破除死鎖；針對巡邏目標，自動強制重置並推進至下一項目，保證助手永不卡死。
              3. **【全機型螢幕動態幾何中心適配（三星 SM-F731N 22:9 摺疊機、20:9、16:9）】**：
                 - 每日賓果、抽抽樂、任務、好友禮物彈窗右上角 (X) 關閉按鈕全面升級為動態對齊算法，自動錨定彈窗標題水平中線；
                 - 針對三星 Galaxy Z Flip5 等超長 22:9 比例螢幕動態計算幾何縮放比例，擴大覆蓋範圍，杜絕按偏；
                 - 增加雙重保險機制：若連續 2 次點擊 (X) 彈窗仍未關閉，自動觸發系統返回鍵 (BACK) 補刀關閉。
              4. **【Facebook 粉絲專頁落地頁 2 秒極速返回】**：
                 - 解決 Meta 廣告誤跳轉至 Facebook App (com.facebook.katana) 停留 15 秒以上卡死問題；
                 - 辨識社群專頁特徵（全部、相片、Reel、活動、讚、留言、分享、追蹤、逛逛商店等），停留滿 2 秒立即按返回鍵退出並拉回《LINE 散步趣》。
              5. **【「無法載入廣告」彈窗全域像素級自動秒關】**：
                 - 針對 LINE 散步趣彈出的熊大綠色問號「無法載入廣告 請稍後再試。」彈窗，解除對 OCR 文字的比對限制；
                 - 透過熊大綠色卡片與底部 LINE 經典鮮綠色橢圓按鈕的像素級幾何特徵秒關彈窗，重置當前分頁重試，不再卡在巡邏中。
              6. **【Phase Barrier 階段屏障（徹底解決懸浮窗與實際畫面脫節）】**：
                 - 在四大分頁常規獎勵領取完畢、準備推進至每日賓果或抽抽樂前，強制確認畫面上所有領獎彈窗已完全關閉乾淨；
                 - 確保懸浮窗顯示狀態與手機螢幕畫面 100% 同步，徹底解決步數領獎彈窗顯示每日賓果/抽抽樂的狀態錯亂問題。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.64)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.64
            name: "散步趣助手 v1.15.64 (修復街機空點37次死鎖、FB落地頁2秒極速返回、全機型22:9螢幕動態適配、死鎖斷路器、無法載入廣告秒關)"
            body: |
              **散步趣助手 v1.15.64 (Run #${{ github.run_number }}) - 深度修復桌面錄影與截圖所有卡死與退步問題 (相容歷代版本 v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除遊戲分頁與抽抽樂誤判領獎彈窗死鎖（徹底終結連續空點 37 次）】**：
