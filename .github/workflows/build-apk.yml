name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            ERR=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error::Gradle failed: $ERR"
            exit 1
          }

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.14 (UI/UX Max 全新極簡設計、移除Emoji改用向量圖示、動態版本號同步、v1.7廣告穩定回歸 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.14 (Run #${{ github.run_number }})**
              1. **【UI/UX Max 全面重新設計】**：
                 - **全面移除 Emoji，改用簡約實用向量圖示**：懸浮窗與主畫面全面替換為 Material Vector Drawables（開始、暫停、取樣、設定、關閉、收合/展開、連線狀態指示點）。
                 - **極簡現代深色微透懸浮面板**：全新設計深色微透質感圓角懸浮窗，狀態指示圓點（綠色執行中 / 灰色待命），更精緻專業。
                 - **卡片式設計與圓角邊框**：主畫面改用清新卡片式佈局、精緻警示區塊與深色終端風格執行紀錄。
              2. **【APP 內版本號動態更新】**：
                 - 主畫面動態讀取 `BuildConfig.VERSION_NAME`，解決版本號硬編碼停留在 1.13.9 的問題，未來每次版本更新皆自動同步最新版本號。
              3. **【回歸 v1.7 冷靜穩定的廣告觀看與略過機制】**：
                 - 保持安靜穩定監控廣告倒數，杜絕頻繁亂點導致打斷影片或誤觸推廣。
                 - 優先精確辨識「略過廣告」按鈕（含灰色/高亮狀態驗證）；當廣告結束出現 End Card 且無 [X] 時，發送冷靜單次返回鍵關閉 AdActivity，絕不連擊雙重返回跳回桌面。
              4. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援手機直接點擊安裝覆蓋更新，無需解除舊版安裝。
            files: LineWalkAutoAd.apk
            prerelease: false
