              4. **【廣告載入黑幕偵測優先級重構】**：
                 - isAdLoadingScreen 將「載入中」、「廣告載入」等文字檢查提升至最優先，防止半透明黑幕透出背景遊戲文字時被一票否決。
              5. **【全域 0 Emoji 零容忍與繁體中文落實】**：
                 - 嚴格稽核所有代碼、註解、日誌、Commit 與 Release Notes，確保 0 Emoji 且 100% 繁體中文。
            files: LineWalkAutoAd.apk
            prerelease: false
