name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.53 (任務面板特別分頁動態2/3分頁自適應辨識、好友收禮抽屜跨行文字比對與綠框按鈕色彩採樣、懸浮窗零遮蔽安全預設位置 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.53 (Run #${{ github.run_number }}) - 升級自 v1.15.52 (相容歷代版本 v1.15.51, v1.15.50, v1.15.49)**
              1. **【好友收禮抽屜跨行文字比對與好友頁面絕對互斥】**：
                 - 徹底解決跨行文字（「收到...送來的禮」與「物囉！」）導致抽屜未命中缺陷，加入多行文字合併與多特徵綜合判定；
                 - FriendGiftTask.isFriendsPage 加入抽屜互斥保護，只要抽屜開啟絕不誤判為好友頁面，徹底杜絕無限點擊底部「集點」首頁卡死。
              2. **【綠框播放按鈕 [ ▶ ] 內部色彩深度採樣】**：
                 - 移除 cluster.size > 400 誤判條件，採樣按鈕內部像素（白色比例 > 40% 且含播放三角形判定為 isAd = true），精確鎖定看廣告領取項目並發送點擊。
              3. **【右上角 (X) 關閉按鈕座標校準】**：
                 - 校準至實機中心 (sw * 0.890f, sh * 0.231f)，確保領完禮物後一擊秒關順暢推進。
              4. **【懸浮視窗零遮蔽安全預設位置】**：
                 - 預設停靠於 x = 12, y = sh * 0.290f，完全避開頂部狀態列、資產列、四大分頁、任務三大分頁、彈窗標題與關閉叉叉、主畫面圖示列以及底部導覽列。
              5. **【任務面板 2/3 分頁動態幾何辨識與循序巡檢】**：
                 - 特別任務完成消失時動態收斂為 2 分頁（每日 33%, 每週 67%），存在時為 3 分頁（特別 20%, 每日 50%, 每週 80%）；
                 - 強制循序檢查清單中的每一分頁，確保每日待領獎勵 100% 被巡檢與領取。
            files: LineWalkAutoAd.apk
            prerelease: false
