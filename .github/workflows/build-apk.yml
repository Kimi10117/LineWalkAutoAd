name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.31 (極速賓果連線獎勵 Get 領取優化、秒速關閉 LINE 好友促銷全螢幕彈窗 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.31 (Run #${{ github.run_number }})**
              1. **【賓果連線獎勵 [Get] 極速領取優化，告別遲鈍與重複點擊】**：
                 - **首擊即鎖定**：點擊 [Get] 獎勵欄位時立即加入鎖定集合 (`claimedBingoColumns`)，杜絕每欄點擊兩次、重複等待的冗餘缺陷。
                 - **子視窗快取推進**：在子視窗領取獎勵時，若無廣告彈窗，1 個 Tick 即判定獎勵入帳並立即推進至下一欄或下一階段，大幅節省 75% 賓果獎勵領取時間！
              2. **【LINE 好友邀請/內部促銷全螢幕彈窗秒速自動關閉】**：
                 - **全面涵蓋特徵比對**：深度適配「邀請好友 快來領取吧！！」、「被邀請的好友完成邀請任務！」、「雙方都可獲得金幣！」等促銷特徵，即便被懸浮窗遮蔽「10000」亦能 100% 精準識別！
                 - **最優先級秒速關閉**：於巡邏主迴圈最頂層攔截 LINE 宣傳廣告，立即點擊右上角白底 (X) 圓形關閉按鈕，徹底終結停滯 30 秒卡頓！
                 - **幾何 X 偵測解禁**：移除免樣本幾何 X 偵測器對右上角區域之限制，確保任何全螢幕促銷視窗皆能被精確識別並關閉。
              3. **【全面攻克 Meta 輪播廣告左上角關閉 (X) 按鈕】**：
                 - 幾何 X 偵測器全面支援左上角掃描，頂部狀態列安全線調整為 `y < 4.2% sh`，放行 `y: 5%..9% sh` 的合法關閉按鈕。
              4. **【影音廣告與靜態/輪播廣告完美兼顧】**：
                 - 影音廣告嚴格遵守倒數計時靜候播放，靜態廣告 5 秒後精準秒速關閉，防誤觸跳轉外部 App。
              5. **【無障礙節點白名單封鎖 Discord / Google Play】**：
                 - 嚴格拒絕來自 `com.discord`、`com.android.systemui`、`com.android.vending` 的節點，徹底消除跳出外部 App。
              6. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
