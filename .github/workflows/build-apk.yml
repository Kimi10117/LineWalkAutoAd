name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.3 (任務頁自動切換三大分頁領取、修復任務視窗跳針 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.3 (Run #${{ github.run_number }})**
            1. **【重大修復：任務視窗自動巡選切換「特別 ➔ 每日 ➔ 每週」分頁領獎】**：
               - 痛點修復：任務視窗開啟時，無法自行切換特別、每日、每週分頁；且因右上角 (X) 被幾何角落偵測器誤認為廣告關閉鈕，導致在「1.巡選中」與「3.廣告監控」之間反覆跳針，完全無法進行任務檢查。
               - 解決方案：
                 1) 重寫任務彈窗偵測：移除舊版絕對像素限制，改採動態相對座標與頂部深黑選中膠囊判定，100% 精準識別任務視窗，絕不誤入廣告監控。
                 2) 智慧動態分頁切換：即時偵測當前啟用中的分頁（依黑色膠囊 X 軸位置自動判斷「特別 / 每日 / 每週」），不漏掉任何分頁（特別是預設開啟的特別頁以及含紅點 3 的每日頁）。
                 3) 精準領取按鈕偵測：2D 綠色連通像素區塊搭配 OCR 雙重驗證，嚴格排除未完成的「挑戰」與「已領取」，自動依序點擊「領取」並切入看廣告/領獎流程。
                 4) 三大分頁皆檢查領取完畢後，自動點擊右上角 (X) 關閉視窗，繼續推進下一巡邏項目。
            2. **【防呆修復：廣告監控 isGameScreenVisible 排除「已領取」誤判】**：
               - 修復一般清單中出現的「已領取」文字被賓果防護誤判為「未領取的 Get」，導致無法及時判定回到遊戲的問題。
            3. **【全面消除絕對像素：抽抽樂、好友頁面全面支援各種比例螢幕】**：
               - 修正 LotteryTask 與 FriendGiftTask 中舊版硬編碼像素高度限制，全面轉換為相對螢幕比例（相容打孔螢幕、高更新率長螢幕等）。
            4. **【保留所有核心功能】**：
               - 廣告跳轉外部瀏覽器安全返回機制，杜絕反覆跳轉循環。
               - 看廣告永遠優先選擇「獲得金幣數量最多」之選項（100 > 60 > 50 > 30 > 15 > 10 > 5 > 2 > 1）。
               - 抽抽樂 50 抽優先、次選免費抽、嚴禁點 5 張；好友排行榜「送禮物也送自己」。
            5. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
