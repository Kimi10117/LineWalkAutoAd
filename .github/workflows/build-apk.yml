name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.5 (遊戲頁啟動優先回首頁、頂部分頁點擊校準、杜絕誤觸輕鬆賺廣告 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.5 (Run #${{ github.run_number }})**
            1. **【遊戲頁或任意分頁啟動校準：優先切換回首頁(移動)巡邏】**：
               - 痛點修復：使用者在「遊戲」頁面點擊懸浮窗 [▶ 開始]，因主畫面辨識漏判或誤觸關閉鈕，直接點進了上方的紫色廣告橫幅。
               - 解決方案：
                 1) `isLineWalkMainScreenVisible` 升級彈性去除空格比對，並增設頂部資產數值 (金幣/票券) 輔助識別，確保停留在遊戲頁面時 100% 判定為主畫面。
                 2) 啟動巡邏時嚴格遵守順序（1. 移動 ➔ 2. 時間 ➔ 3. 遊戲 ➔ 4. 步數），自動優先切換回首頁(移動)分頁進行檢查。
            2. **【頂部分頁切換精準校準與動畫緩衝】**：
               - 痛點修復：點擊分頁若因螢幕解析度或動畫延遲，若程式提前修改記憶體分頁狀態，會導致在遊戲頁面上執行移動分頁檢查。
               - 解決方案：
                 1) 新增 `getTabRect` 動態結合頂部 OCR 文字與幾何坐標，擴增點擊有效範圍。
                 2) 點擊切換分頁後給予 500ms 動畫緩衝時間，並透過畫面特徵辨識實際切換結果，不再提早賦值，徹底防止分頁狀態錯位。
            3. **【徹底杜絕「輕鬆賺/開始遊玩」外部廣告橫幅誤觸】**：
               - 痛點修復：頂部「輕鬆賺 獲得金幣!! 開始遊玩 >」廣告包含「>」或內部 viewId 被廣告關閉器或角落 X 誤判為關閉按鈕。
               - 解決方案：
                 1) `NodeInspector` 排除詞庫增加「開始遊玩」、「遊玩」、「輕鬆賺」、「輕鬆」、「adjoe」、「Sponsored」。
                 2) 關閉節點與幾何 X 偵測嚴格黑名單封鎖廣告橫幅區域 (y: 14% ~ 35%) 及 `viewId.contains("adjoe")`。
                 3) `StepBottleTask`、`MoveGaugeTask`、`IdleRewardTask` 頂部搜尋邊界下修至 y >= 25%，完全避開廣告橫幅 (y ≈ 18% ~ 23%)。
            4. **【遊戲分頁機台按鈕防護】**：
               - 巡邏巡至「遊戲」分頁時，僅檢查機台中央 [🪙 獲得金幣] (y: 46% ~ 58%)，若灰底不可領取則直接推進下一項，絕不點擊上方廣告！
            5. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
