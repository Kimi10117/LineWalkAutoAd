name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.43 (修復Meta廣告快轉略過秒點、好友清單自動切回排行榜送禮、三星狀態列/截圖工具防誤觸 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.43 (Run #${{ github.run_number }})**
              1. **【徹底修復 Meta 廣告「▶|」略過按鈕未點擊缺陷，5 秒即秒速略過】**：
                 - 根本原因：Meta 影音廣告右上角為深色圓底白色快轉 `▶|` 圖示（純圖案繪製非文字），原檢查要求右上角 OCR 必須識別到文字才允許觸發快轉偵測，導致快轉偵測被完全阻斷；且在 LINE WebView 內播放時前景套件為散步趣，原 `isMetaAd` 判定失效。
                 - 修復：擴充 `isMetaAd` 比對畫面文字特徵（包含「Ads served by Meta」、「Meta」、「Facebook」等），解除 OCR 文字強制限縮，影音廣告播放滿 5 秒即刻精準偵測點擊右上角快轉 `▶|` 秒速略過廣告！
              2. **【修復誤入「好友清單」分頁缺陷，自動點擊左側「排行榜」回正送禮】**：
                 - 根本原因：好友頁面紅底標語「※獲得100枚以上金幣時 將參與排行榜」被 `isLineInHousePromoAd` 誤判為促銷彈窗，點擊關閉按鈕剛好命中【好友清單】分頁標籤；且進入好友清單後無禮物按鈕導致卡住。
                 - 修復：`isLineInHousePromoAd` 加入嚴格一票否決排除好友與排行榜頁面。新增好友清單偵測器，一旦誤入【好友清單】立即自動點擊左側【排行榜】標籤回正，確保順利完成好友送禮與收禮。
              3. **【防護三星 SM-F731N 設備：防誤觸狀態列、截圖工具與 Google Play】**：
                 - 提高幾何關閉按鈕 X 偵測禁區門檻至螢幕頂部 7.5%（下修頂部邊界），徹底避開 Samsung Galaxy 摺疊機狀態列、相機鏡頭挖孔與 Smart Capture 工具列。
                 - 徹底移除末期備援盲點中的「左上角熱區」，防止在影音廣告中誤觸贊助商圖標跳轉 Google Play。
                 - 外部應用保護中針對 Samsung 工具與 Google Play 實施無條件安全返回鍵退回機制，杜絕點擊循環。
              4. **【Persistent Key 簽名維護】**：
                 - 維持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
