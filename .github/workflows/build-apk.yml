name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.90
          git push -f origin latest-apk || true
          git push -f origin v1.15.90 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.90 (修復 Coupang 酷澎雙層圓形 (X) 關閉偵測、黑邊視口校準與跨逾時黑名單保留 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.90 (Run #${{ github.run_number }}) - 修復 Coupang 酷澎雙層圓形 (X) 關閉偵測、黑邊視口校準與跨逾時黑名單保留 (相容歷代版本 v1.15.89, v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【幾何 `(X)` 視口校準與中灰圓底白色 `(X)` 原生偵測】**：
                 - 修正 `TemplateMatcher.detectCornerGeometricX` 在頂部黑邊卡片 (`effectiveTopY ≈ 154`) 重複位移與下緣過度下推問題，徹底排除 `y = 14.2%~14.9%` 商品圖誤觸點，並新增低色度中灰圓底白叉 `(X)` 識別與 `detectCornerGrayCircleCloseX` 專責掃描。
              2. **【Coupang 雙層 `(X)` 直擊與緊縮失敗半徑防護】**：
                 - `AdCloserHandler` 於 `Step 6 / 7A2 / 8` 偵測 Coupang 輪播卡片或無效頂部小 `×` 後優先命中下方真實灰底圓形 `(X)` (`酷澎圓形關閉(X)`)；無效 `OCR-角落` 門檻降至 2 次並對非跳轉點採緊縮封鎖半徑，避免遮蔽下方真實圓鈕。
              3. **【修復 Watchdog 重置清空黑名單漏洞與任務重建】**：
                 - 修正 `onEnterAdMode(preserveRedirectState = true)` 於 `clearAdSessionTimer()` 歸零後誤清空 `blacklistedPoints`／`redirectPointCounts` 的問題，延長跨逾時保留視窗至 `180s`；`forceResetAppTaskToFront(clearTask = true)` 改用 `Intent.makeRestartActivityTask`，新增 `V1_15_90SimulationTest`，versionCode 123 / versionName 1.15.90（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.90)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.90
            name: "散步趣助手 v1.15.90 (修復 Coupang 酷澎雙層圓形 (X) 關閉偵測、黑邊視口校準與跨逾時黑名單保留)"
            body: |
              **散步趣助手 v1.15.90 (Run #${{ github.run_number }}) - 修復 Coupang 酷澎雙層圓形 (X) 關閉偵測、黑邊視口校準與跨逾時黑名單保留**
              1. **【幾何 `(X)` 視口校準與中灰圓底白色 `(X)` 原生偵測】**：
                 - 修正 `TemplateMatcher.detectCornerGeometricX` 在頂部黑邊卡片 (`effectiveTopY ≈ 154`) 重複位移與下緣過度下推問題，徹底排除 `y = 14.2%~14.9%` 商品圖誤觸點，並新增低色度中灰圓底白叉 `(X)` 識別與 `detectCornerGrayCircleCloseX` 專責掃描。
              2. **【Coupang 雙層 `(X)` 直擊與緊縮失敗半徑防護】**：
                 - `AdCloserHandler` 於 `Step 6 / 7A2 / 8` 偵測 Coupang 輪播卡片或無效頂部小 `×` 後優先命中下方真實灰底圓形 `(X)` (`酷澎圓形關閉(X)`)；無效 `OCR-角落` 門檻降至 2 次並對非跳轉點採緊縮封鎖半徑，避免遮蔽下方真實圓鈕。
              3. **【修復 Watchdog 重置清空黑名單漏洞與任務重建】**：
                 - 修正 `onEnterAdMode(preserveRedirectState = true)` 於 `clearAdSessionTimer()` 歸零後誤清空 `blacklistedPoints`／`redirectPointCounts` 的問題，延長跨逾時保留視窗至 `180s`；`forceResetAppTaskToFront(clearTask = true)` 改用 `Intent.makeRestartActivityTask`，新增 `V1_15_90SimulationTest`，versionCode 123 / versionName 1.15.90（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
