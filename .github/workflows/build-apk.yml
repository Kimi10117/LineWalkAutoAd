name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.41 (修復好友送禮彈窗死循環與廣告跳轉Google Play - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.41 (Run #${{ github.run_number }})**
              1. **【修復好友送禮確認彈窗死循環卡死】**：
                 - 送禮確認彈窗提供「也送給自己（看廣告獲得雙倍獎勵）」與白色「贈送（直接贈送，免看廣告）」兩套按鈕。先前版本只鎖定「也送給自己」，當廣告無庫存或啟動失敗時，彈窗未關閉導致每 4 秒反覆點擊陷入無限死循環。
                 - 本版新增三段式智能容錯狀態機：第一次優先嘗試看廣告「也送給自己」；若廣告未啟動或未成功關閉導致彈窗仍在，第二次自動後備點擊免看廣告的「贈送」按鈕，直接將金幣送給好友並順暢推進；若仍未關閉，第三次自動點擊「取消」放行，徹底消除卡死在好友名單之缺陷。
              2. **【徹底根除 Google AdMob/影音廣告誤觸跳轉 Google Play 商店】**：
                 - 診斷日誌顯示：影音廣告在 28~33 秒時，快轉略過按鈕判定誤將右上角的 AdChoices (i) 或贊助商橫幅判定為略過鈕，導致頻繁跳轉至 Play 商店 (`com.android.vending`)。
                 - 本版嚴格將快轉略過按鈕偵測 (`detectCornerFastForwardSkip`) 限制僅在 Meta 廣告容器 (`com.facebook.katana`, `com.facebook.orca`) 中生效，Google AdMob / 影音廣告絕不盲點右上角圖示。
                 - 廣告播放末期（>= 40s）若非 Meta 廣告或曾發生跳轉，嚴格禁止角落備援盲點，全面改由 Android 系統原生返回鍵安全退出廣告，100% 杜絕跳轉商店。
              3. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
