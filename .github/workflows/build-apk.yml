name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.14.8 (修復邀請好友彈窗卡死、巡邏中角落X立即點擊關閉、排除導覽列好友誤判 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.14.8 (Run #${{ github.run_number }})**
              1. **【徹底根治「邀請好友」彈窗卡死與巡邏無窮迴圈問題】**：
                 - **巡邏中偵測到角落 X 立即點擊關閉**：
                   根治先前在主畫面巡邏（`IN_GAME_SCAN`）時，若彈出全螢幕推廣活動（如「邀請好友 1000 金幣 快來領取吧」），幾何角落 X 偵測器雖成功鎖定右上角圓形 X，卻誤將其切換為「3. 廣告監控（等待廣告播放）」而未實際點擊關閉按鈕的嚴重邏輯錯誤！
                   現在巡邏中只要偵測到角落 X，**立即發送點擊手勢實體關閉彈窗**，秒速關閉宣傳頁退回遊戲主畫面！
                 - **修正底部導覽列「好友」特徵誤配「邀請好友」按鈕**：
                   修復先前在判斷主畫面底部導覽列時，因推廣彈窗底部存在綠色「邀請好友」大按鈕，被 `t.contains("好友")` 誤認成主畫面導覽列「好友」分頁，進而引發「已回到主畫面」錯誤判定與「🔍 繼續下一輪...」無窮循環的重大 Bug。
                 - **增設巡邏狀態非主畫面防卡死返回鍵備援**：
                   若畫面非主畫面且連續 3 輪無可點擊目標，自動發送 Android 系統返回鍵關閉覆蓋彈窗，提供多重安全保障。
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
