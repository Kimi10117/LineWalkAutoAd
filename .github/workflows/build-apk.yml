name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.69
          git push -f origin latest-apk || true
          git push -f origin v1.15.69 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.69 (全螢幕比例與三大金剛鍵自適應、Google Play/左上角X廣告關閉、TXT日誌匯出 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.69 (Run #${{ github.run_number }}) - 全機型螢幕比例(摺疊機 22:9/21:9、16:9、全螢幕手勢、傳統三大金剛鍵)自適應防誤點、修復左上角 [▶| Google Play] 與 CACO 左上角圓形 (X) 廣告關閉、根除實機日誌 5 大死循環、新增含版本號 TXT 日誌直接匯出至檔案 App 並移除取樣按鈕 (相容歷代版本 v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【全機型螢幕比例 (22:9 / 21:9 / 16:9 / 三大金剛鍵) 自適應防誤點架構】**：
                 - 新增 `ScreenViewportCalibrator`：自動偵測底部傳統三大金剛導覽列 (`hasThreeButtonNavBar`) 並建立底部防誤觸禁區；
                 - 針對每日賓果、抽抽樂、任務、收禮等子視窗右上角 `(X)`，採用像素級「白底圓角面板頂部邊界 (`sheetTopY`) + 右上角深灰色 `(X)` 筆畫中心」動態定位，並支援多點微調輪詢與強制脫困，徹底消除因內文 (`"BIG抽抽樂"`、`"1 BINGO"`) 干擾造成的連點 11~70 次失誤。
              2. **【修復左上角 [▶| Google Play] 膠囊廣告與 CACO 左上角圓形 (X) 廣告無法關閉問題】**：
                 - 在 `AdCloserHandler` 新增 `findTopLeftGooglePlaySkipPill`：播放滿 4 秒且無倒數計時時，精準點擊左上角 (`cy in 2.5%..18.0% sh, cx in 2.0%..42.0% sw`) 的 `[▶| Google Play]` 略過膠囊按鈕；
                 - 開放所有無倒數計時廣告在播放滿 5 秒後啟用左上角幾何 `(X)` 偵測 (`enableLeftCornerScan`)，並將 `TemplateMatcher.detectCornerGeometricX` 左上角掃描寬度擴展至 `19.5% sw`。
              3. **【深度修復 1_15_68bug.txt 診斷日誌中的 5 大異常】**：
                 - 根除 `FacebookLandingPage` 因泛用詞造成的 69 秒無限死循環洗版；
                 - 攔截 `Node[txt=Skip 開啟商店]` 與 `OCR[BOOK NOW ×]` 造成的外部商店/瀏覽器誤跳轉；
                 - 修復抽抽樂中獎結果畫面重複點擊 `[x1 獲得]` 10 次問題，並將記憶體日誌容量上限擴充至 20,000 筆。
              4. **【日誌直接匯出為含版本號之 .txt 檔案至「檔案」App & 移除「取樣」功能】**：
                 - 點擊主畫面 `[匯出日誌 (.txt)]` 直接將完整無截斷日誌寫入系統 `Downloads` 資料夾，檔名自動加上版本號（`散步趣助手_v1.15.69_診斷日誌_yyyyMMdd_HHmmss.txt`）；
                 - 移除懸浮窗與主畫面的舊版手動「取樣」按鈕與區塊，介面全面精簡自動化。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.69)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.69
            name: "散步趣助手 v1.15.69 (全螢幕比例與三大金剛鍵自適應、Google Play/左上角X廣告關閉、TXT日誌匯出)"
            body: |
              **散步趣助手 v1.15.69 (Run #${{ github.run_number }}) - 全機型螢幕比例(摺疊機 22:9/21:9、16:9、全螢幕手勢、傳統三大金剛鍵)自適應防誤點、修復左上角 [▶| Google Play] 與 CACO 左上角圓形 (X) 廣告關閉、根除實機日誌 5 大死循環、新增含版本號 TXT 日誌直接匯出至檔案 App 並移除取樣按鈕 (相容歷代版本 v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【全機型螢幕比例 (22:9 / 21:9 / 16:9 / 三大金剛鍵) 自適應防誤點架構】**：
                 - 新增 `ScreenViewportCalibrator`：自動偵測底部傳統三大金剛導覽列 (`hasThreeButtonNavBar`) 並建立底部防誤觸禁區；
                 - 針對每日賓果、抽抽樂、任務、收禮等子視窗右上角 `(X)`，採用像素級「白底圓角面板頂部邊界 (`sheetTopY`) + 右上角深灰色 `(X)` 筆畫中心」動態定位，並支援多點微調輪詢與強制脫困，徹底消除因內文 (`"BIG抽抽樂"`、`"1 BINGO"`) 干擾造成的連點 11~70 次失誤。
              2. **【修復左上角 [▶| Google Play] 膠囊廣告與 CACO 左上角圓形 (X) 廣告無法關閉問題】**：
