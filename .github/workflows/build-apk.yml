name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.11 (徹底根除廣告監控「已點關閉」死循環、修復狀態列假X與可玩廣告防卡死 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.11 (Run #${{ github.run_number }})**
              1. **【徹底根除廣告監控「已點關閉，確認中...」無限死循環與卡死問題】**：
                 - **根本原因診斷**：
                   1. **系統狀態列黑白邊界造成假 X 誤判**：先前 `detectCornerGeometricX` 掃描區域從 `y = 2%` (約 20px) 開始，而 Android 頂部系統狀態列（顯示時間、圖示）恰好在 `y = 38px` 結束，下方緊接淺灰色廣告畫布。黑列與灰底形成的強烈明暗切面，被幾何 X 演算法誤判為右上角的圓底白 X（例如座標 `394, 42`）！
                   2. **空白處反覆點擊無效**：程式誤將黑灰邊界視為關閉鈕，點擊空白背景毫無反應；因未回到遊戲，下一秒又在鄰近座標抓出假 X，導致懸浮窗永遠停留在「👆 已點關閉，確認中...」無限循環！
                   3. **全域超時安全網被旁路**：原逾時強制拉回機制被寫在 `WatchdogBackTriggered` 分支內，因為持續回傳點擊關閉狀態，導致即使超過 32 秒甚至數分鐘也無法強制拉回遊戲！
                 - **修復方案**：
                   1. **幾何 X 掃描起點安全抬高**：將角落 X 掃描起點與有效點門檻抬高至 `y >= 5.2%` (至少 48px)，完全避開頂部系統黑列邊界，實測誤判率直接降為 0！
                   2. **全域無條件廣告逾時安全防護 (Global Ad Timeout Watchdog)**：在廣告監控最頂層加入絕對防線，只要單支廣告播放達 36 秒（上限 32 秒 + 4 秒寬限）仍未回到遊戲，不論處於何種狀態，一律強制發送返回鍵並以 `bringAppToFront` 將《LINE 散步趣》直接喚醒拉回前景，徹底告別廣告卡死！
                   3. **互動式可玩廣告 (Playable Ad) 自動推進與雙重返回**：
                      - 針對如 Amazon 飛刀命中等可玩小遊戲廣告，在第 5~8 秒自動於互動區域輕點一次推進小遊戲進展，促使結尾卡片與 [X] 現身。
                      - 盲點四個角落關閉熱區時同步發送系統返回鍵，雙管齊下關閉全螢幕廣告與 WebView。
                      - 移除盲點清單中的 Google Play 徽章，避免意外跳轉應用商店。
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
