name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.51 (重構巡邏廣告辨識優先權根除幾何X死循環、強化Reward granted內部返回鍵與彈窗防卡死 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.51 (Run #${{ github.run_number }})**
              1. **【重構巡邏流程廣告偵測優先權，根除幾何 X 空點死循環】**：
                 - 調整 `handleInGameScan` 執行順序，將全螢幕廣告與可玩式互動廣告識別（`hasPlayableOrStoreAdOcr`）置於幾何 X（`detectCornerGeometricX`）之前。
                 - 徹底解決 Coupang 等互動廣告彈出時被巡邏階段誤當成一般遊戲彈窗反覆點擊右上角 X（每 2 秒點一次長達 6 分鐘）卻無法進入廣告監控模式的致命缺陷。
              2. **【巡邏角落關閉鈕點擊上限保護 (Retry Limit)】**：
                 - 引入 `geoXConsecutiveClicks` 計數機制，若連續 3 次點擊角落關閉鈕未關閉畫面，立即發送安全返回鍵（`allowInGame = true`）強行關閉彈窗，杜絕無限空點。
              3. **【解除內部廣告獎勵返回鍵阻斷】**：
                 - 針對 `Reward granted` 廣告，若已點擊關閉鈕或已顯示達 8 秒且畫面非主畫面（`!isGameVisible`），立即派發 `service.safeNavigateBack(allowInGame = true)` 退出廣告，解決因檢查 `!isGame` 導致內部廣告返回鍵全面失效的問題。
              4. **【彈窗過渡防卡死機制修復】**：
                 - 修正 `handleTriggerAdPopup` 中的 `hasAdOcrDirect` 判定，避免因抽獎殘留狀態將真實廣告誤判為功能子視窗而提前退出至巡邏狀態。
            files: LineWalkAutoAd.apk
            prerelease: false
