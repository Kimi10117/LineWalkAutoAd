name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.83
          git push -f origin latest-apk || true
          git push -f origin v1.15.83 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.83 (角落獨立 X 關閉、移除右下角安裝盲點、Watchdog 計時重置與任務直領加速 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.83 (Run #${{ github.run_number }}) - 角落獨立 X 關閉、移除右下角安裝盲點、Watchdog 計時重置與任務直領加速 (相容歷代版本 v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【Google Play 略過鈕過濾與角落獨立 X OCR 關閉】**：
                 - 收緊 `findTopLeftGooglePlaySkipPill` 座標區間並排除星等評價與 App 推廣卡（如「起漲K線!4.8 ★▶ Goo…」），同步將重定向容錯收緊為 2 次；`OcrRecognizer` 新增 `findCornerAsciiCloseButton` 精準點擊左上／右上角獨立 `"X"`（如 `"X"@6%,6%`）。
              2. **【移除右下角安裝 CTA 盲點並跳過黑名單熱區】**：
                 - `getNextFallbackTarget` 移除易誤跳 Play 商店之「螢幕右下角熱區」，重新校準右上角避開系統狀態列並略過已黑名單座標，全面黑名單後直接改發系統返回鍵。
              3. **【Watchdog 強退重置廣告計時器】**：
                 - 新增 `AdCloserHandler.clearAdSessionTimer()` 並於所有 `AD_WATCHDOG_TIMEOUT`／拉回退出點呼叫，杜絕 6 秒後外部跳轉重進時繼承過期時間戳導致 `74s/65s` 秒退。
              4. **【黑名單座標去重與「無法讀取資料」錯誤彈窗識別】**：
                 - `addBlacklistPoint` 以 16px 半徑去重黑名單座標，消除 `blk=` 快照重複項目；`OcrRecognizer` 補充「無法讀取資料」、「讀取資料失敗」、「資料讀取失敗」關鍵字識別。
              5. **【每日任務綠色「領取」免廣告直領單拍恢復】**：
                 - `AutomationEngine` 新增 `pendingMissionDirectClaim` 並於狀態離開時清除，免廣告任務領取後第 1 拍即迅速返回 `IN_GAME_SCAN` 繼續領下一項，消除每次 4 秒「領獎確認逾時」等待。
              6. **【版本號升級】**：
                 - versionCode 116 / versionName 1.15.83（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.83)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.83
            name: "散步趣助手 v1.15.83 (角落獨立 X 關閉、移除右下角安裝盲點、Watchdog 計時重置與任務直領加速)"
            body: |
              **散步趣助手 v1.15.83 (Run #${{ github.run_number }}) - 角落獨立 X 關閉、移除右下角安裝盲點、Watchdog 計時重置與任務直領加速**
              1. **【Google Play 略過鈕過濾與角落獨立 X OCR 關閉】**：
                 - 收緊 `findTopLeftGooglePlaySkipPill` 座標區間並排除星等評價與 App 推廣卡（如「起漲K線!4.8 ★▶ Goo…」），同步將重定向容錯收緊為 2 次；`OcrRecognizer` 新增 `findCornerAsciiCloseButton` 精準點擊左上／右上角獨立 `"X"`（如 `"X"@6%,6%`）。
              2. **【移除右下角安裝 CTA 盲點並跳過黑名單熱區】**：
                 - `getNextFallbackTarget` 移除易誤跳 Play 商店之「螢幕右下角熱區」，重新校準右上角避開系統狀態列並略過已黑名單座標，全面黑名單後直接改發系統返回鍵。
              3. **【Watchdog 強退重置廣告計時器】**：
                 - 新增 `AdCloserHandler.clearAdSessionTimer()` 並於所有 `AD_WATCHDOG_TIMEOUT`／拉回退出點呼叫，杜絕 6 秒後外部跳轉重進時繼承過期時間戳導致 `74s/65s` 秒退。
              4. **【黑名單座標去重與「無法讀取資料」錯誤彈窗識別】**：
                 - `addBlacklistPoint` 以 16px 半徑去重黑名單座標，消除 `blk=` 快照重複項目；`OcrRecognizer` 補充「無法讀取資料」、「讀取資料失敗」、「資料讀取失敗」關鍵字識別。
              5. **【每日任務綠色「領取」免廣告直領單拍恢復】**：
                 - `AutomationEngine` 新增 `pendingMissionDirectClaim` 並於狀態離開時清除，免廣告任務領取後第 1 拍即迅速返回 `IN_GAME_SCAN` 繼續領下一項，消除每次 4 秒「領獎確認逾時」等待。
              6. **【版本號升級】**：
                 - versionCode 116 / versionName 1.15.83（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
