name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.8 (徹底杜絕誤點右上角齒輪設定選單、自動退出選單畫面、秒級快速回歸主畫面 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.8 (Run #${{ github.run_number }})**
            1. **【徹底杜絕誤點右上角齒輪設定選單】**：
               - 根本原因發現：角落幾何 X 偵測器 (`detectCornerGeometricX`) 過去在廣告監控流程中未排除頂部狀態圖示區，因主畫面右上角「齒輪圖示 (⚙️)」的放射狀齒牙高對比結構，被演算法以高達 168.2 分誤判為「右上角幾何 X」，導致在廣告關閉後的緩衝期直接誤點了齒輪，打開了「選單」設定頁面！
               - 徹底修正：
                 1) `AdCloserHandler` 與所有幾何角落 X 偵測器全面加入黑名單：嚴格禁止點擊頂部狀態列圖示區 (`x > 72%, y < 8.8%`)，徹底保護齒輪與廣播圖示。
                 2) 移除不必要的 6 秒硬性等待：廣告播完回到散步趣主畫面或彈窗時，1 秒內立即判定完成並安全切回遊戲，不再盲目停留於廣告監控中。
                 3) 收緊收禮圖示熱區 (`x: 83.5% ~ 88.5%`)，精準鎖定中央禮物盒，絕不向右偏移觸及齒輪。
            2. **【新增【選單】(設定頁面) 自動防護與即刻返回機制】**：
               - 在全域巡邏與廣告監控中加入「選單」辨識守門員，若畫面出現「選單 / 應用程式設定 / 關閉動畫效果 / 省電模式」，立即點擊右上角 (X) 並發送返回鍵返回遊戲主頁，絕不卡死！
               - 彈窗確認排除清單加入「關閉動畫效果」等設定文字，避免在選單中誤觸開關。
            3. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
