name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.3 (修復點擊開始後無法點擊獲得金幣、防止頂部金幣狀態列被誤判為廣告關閉X - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.3 (Run #${{ github.run_number }})**
            1. **【徹底修復「開始後無法點擊獲得金幣」問題】**：
               - **安全鎖定：主畫面絕不誤判為進入全螢幕廣告**：
                 修復 `handleTriggerAdPopup` 缺少 `!onMainScreenDirect` 防護之嚴重缺陷。原先在點擊「獲得金幣」按鈕後，幾何 X 偵測器誤將頂部狀態列金幣餘額數字（59,935 逗號筆畫）誤判為全螢幕廣告角落關閉 X，導致尚未開啟領獎彈窗便直接被劫持切入「3. 廣告監控」，並反覆死循環。現加入 `!onMainScreenDirect` 嚴格護欄，主畫面下絕對不會誤入廣告流程！
               - **全面封鎖頂部狀態列與四大分頁區幾何 X 誤觸 (y < 16.5%)**：
                 在 `detectCornerGeometricX`、`handleInGameScan` 與 `AdCloserHandler` 中全面將 `y < 16.5%` 列入無條件黑名單，並收窄左上角廣告 X 掃描熱區，徹底杜絕將頂部餘額（59,935 / 664）或「首頁」字樣誤判為廣告關閉鈕！
               - **優化移動分頁「獲得金幣」實體按鈕最優先觸發**：
                 在 `MoveGaugeTask` 中將珊瑚粉紅「獲得金幣」實體按鈕設為第一最高優先級別，主畫面亮起即可立即秒點！
               - **增加彈窗等待防抖時間至 4 次掃描 (約 1.2~1.5 秒)**：
                 防止因手機端底部彈窗滑出動畫延遲（約 400~600ms）導致過早放棄彈窗等待。
            2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
