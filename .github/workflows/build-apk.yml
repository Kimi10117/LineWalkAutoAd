name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.4 (修復移動點完後卡住、杜絕反灰按鈕內小金幣誤判、新增截圖超時保護 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.4 (Run #${{ github.run_number }})**
            1. **【徹底修復「移動點完後一直卡在這裡、無法切換下一項」問題】**：
               - **消除反灰按鈕內金幣圖示誤觸死循環**：
                 修復 `MoveGaugeTask` 中車廂金幣泡泡偵測範圍涵蓋至 `y = 31%..40%`，導致移動獎勵領取完畢後，已呈反灰停用狀態之「🪙 獲得金幣」按鈕內部的小金幣圖示被錯誤辨識為「列車金幣泡泡」，引發引擎在無獎勵狀態下不斷反覆點擊停用按鈕並卡在「2. 點彈窗 (等待彈窗出現...)」的嚴重缺陷！
               - **增設反灰按鈕安全判定**：
                 當主按鈕呈反灰停用狀態（灰度達 93%）且無列車對話框時，強制判定本分頁已無獎勵可領取，立即順暢切換至【步數】（8 張票券待領取）等下一分頁！
               - **保留列車對話框關鍵字精確辨識**：
                 包含「乘車費用 / 收取乘車 / 移動一段距離 / 費用喔」，確保多節車廂對話框依舊能準確點擊領取。
            2. **【無障礙畫面擷取 API 加入超時防護 (withTimeoutOrNull 2500ms)】**：
               - 徹底防範 Android 系統底層在視窗與動畫過渡期間因截圖無回調導致協程永久掛起卡死。
            3. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
