name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.65
          git push -f origin latest-apk || true
          git push -f origin v1.15.65 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.65 (全機型螢幕自適應、根除遮罩死鎖、Meta廣告略過修復、杜絕瀏覽器跳轉 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.65 (Run #${{ github.run_number }}) - 深度修復桌面錄影與截圖所有卡死、退步與螢幕適配問題 (相容歷代版本 v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除遊戲分頁遮罩誤判巡邏死鎖 (F1)】**：
                 - 深度分析實機錄影與日誌，修復遊戲分頁深色漸層邊框被 isDimmedCenterModalOpen 誤判為遮罩而造成 isLineWalkMainScreenVisible 判定失敗卡死；
                 - 導入 isGameTabScreen 一票否決邏輯，杜絕遊戲分頁巡邏停滯；增加 !hasExplicitTicketOrCoinModalTitle 豁免，使票券與金幣領獎彈窗得以正常秒關。
              2. **【巡邏狀態機四層防死鎖自癒守護與懸浮窗同步 (F2)】**：
                 - Tier 1 心跳日誌：非主畫面每 6 Tick (~3 秒) 輸出狀態日誌，消滅無日誌空轉；
                 - Tier 2 降級巡邏：具主畫面特徵且連續 6 Tick 無彈窗時，自動降級放行常規巡邏；
                 - Tier 3 主動換頁：停滯於同一分頁達 15 Tick (~7.5 秒) 無操作時，自動標記完成並強制換頁；
                 - Tier 4 安全返回：未知畫面停滯達 20 Tick (~10 秒) 自動發送系統返回鍵拉回主流程；
                 - 修正 FloatingOverlayService 動態依據 uiStatus.currentTab 即時呈現當前分頁。
              3. **【22:9 螢幕 Meta 廣告快轉略過按鈕搜尋窗擴展與雙向對比 (F3)】**：
                 - 針對三星 Galaxy Z Flip5 (SM-F731N, 22:9) 頂部狀態列 y=32 (22:9 對應 y=66)，將快轉按鈕搜尋窗擴展至 sw*0.72f 與 sh*0.015f，垂直起點對齊 rInner 完整涵蓋；
                 - 實作深底白字與淺底深字雙向自適應對比，並引入外環 12 點圓形對稱性篩選，精準命中快轉按鈕並 100% 排除 momo 促銷標籤。
              4. **【純右側安全盲點序列重構（杜絕喚起外部瀏覽器）(F4)】**：
                 - 徹底廢除左上角備援盲點，重構為右上角 (0.91w, 0.045h) -> 右下角 (0.91w, 0.920h) -> 內容右上角 (0.95w, 0.080h)；
                 - 確保所有盲點點擊之 X 座標均大於等於 0.86w，徹底杜絕誤點左上角廣告主頭像跳轉外部三星瀏覽器。
              5. **【22:9 超長螢幕底部導覽列動態 Y 座標適配 (F5)】**：
                 - 依裝置長寬比動態計算，當 aspect >= 2.2f 時將備援 Y 錨點調整為 sh * 0.945f (平移 92px)，精準避開底部浮動廣告橫幅。
              6. **【四大分頁 OCR 辨識範圍收斂 (F6)】**：
                 - 將四大分頁辨識範圍收斂至 cy in 0.07f..0.16f 且文字長度小於等於 4，排除畫面中段促銷文案干擾。
              7. **【全域歷史 Emoji 徹底淨化】**：
                 - 清理代碼、註解、日誌與資源中所有殘留 Emoji，全量 Git 變更集確認 0 Emoji。
              8. **【全量經驗測試套件 636 項全綠驗證】**：
                 - 執行 python -m pytest tests_empirical/，633 passed, 3 skipped, 0 failed，100% 綠燈通過。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.65)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.65
            name: "散步趣助手 v1.15.65 (全機型螢幕自適應、根除遮罩死鎖、Meta廣告略過修復、杜絕瀏覽器跳轉)"
            body: |
              **散步趣助手 v1.15.65 (Run #${{ github.run_number }}) - 深度修復桌面錄影與截圖所有卡死、退步與螢幕適配問題 (相容歷代版本 v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【根除遊戲分頁遮罩誤判巡邏死鎖 (F1)】**：
                 - 深度分析實機錄影與日誌，修復遊戲分頁深色漸層邊框被 isDimmedCenterModalOpen 誤判為遮罩而造成 isLineWalkMainScreenVisible 判定失敗卡死；
