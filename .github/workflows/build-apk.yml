name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.57
          git push -f origin latest-apk || true
          git push -f origin v1.15.57 || true
        
      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.57 (賓果0 BINGO與嚴格紅色Get防誤觸死鎖、遊戲分頁無日常圖示自動切回首頁 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.57 (Run #${{ github.run_number }}) - 升級自 v1.15.56 (相容歷代版本 v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【每日賓果 0 BINGO 攔截與嚴格紅色 [Get] 像素判定（根除未達成圖示誤判與死鎖）】**：
                 - 當畫面顯示 `0 BINGO` 時一票否決連線獎勵領取；
                 - 將紅色膠囊像素條件收緊為真正的鮮紅 `[Get]` 膠囊 (`r > 195 && g < 110 && b < 110 && (r - g) > 90 && (r - b) > 90` 且像素點 `>= 25`)，徹底杜絕下方米黃色糖果與金幣圖示被誤判為紅色獎勵鈕；
                 - 恢復先點按「立即開啟賓果格」最多 5 次，滿 5 次無反應且無 Get 時立即點擊右上角 (X) 關閉視窗並推進至抽抽樂，且第 3 步加入最多等待 2 次上限防止任何靜態殘留造成無限迴圈。
              2. **【遊戲分頁無日常圖示自動切回首頁（根除卡在遊戲分頁無法開啟抽抽樂/賓果/任務）】**：
                 - 當處於日常子任務階段（賓果、抽抽樂、任務）且當前停留在【遊戲】分頁（無日常 4 圖示）時，自動先點擊切換回【首頁(移動)】分頁，再點擊對應圖示按鈕，並具備重試校準與安全推進保護。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.57)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.57
            name: "散步趣助手 v1.15.57 (賓果0 BINGO與嚴格紅色Get防誤觸死鎖、遊戲分頁無日常圖示自動切回首頁)"
            body: |
              **散步趣助手 v1.15.57 (Run #${{ github.run_number }}) - 升級自 v1.15.56 (相容歷代版本 v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【每日賓果 0 BINGO 攔截與嚴格紅色 [Get] 像素判定（根除未達成圖示誤判與死鎖）】**：
                 - 當畫面顯示 `0 BINGO` 時一票否決連線獎勵領取；
                 - 將紅色膠囊像素條件收緊為真正的鮮紅 `[Get]` 膠囊 (`r > 195 && g < 110 && b < 110 && (r - g) > 90 && (r - b) > 90` 且像素點 `>= 25`)，徹底杜絕下方米黃色糖果與金幣圖示被誤判為紅色獎勵鈕；
                 - 恢復先點按「立即開啟賓果格」最多 5 次，滿 5 次無反應且無 Get 時立即點擊右上角 (X) 關閉視窗並推進至抽抽樂，且第 3 步加入最多等待 2 次上限防止任何靜態殘留造成無限迴圈。
              2. **【遊戲分頁無日常圖示自動切回首頁（根除卡在遊戲分頁無法開啟抽抽樂/賓果/任務）】**：
                 - 當處於日常子任務階段（賓果、抽抽樂、任務）且當前停留在【遊戲】分頁（無日常 4 圖示）時，自動先點擊切換回【首頁(移動)】分頁，再點擊對應圖示按鈕，並具備重試校準與安全推進保護。
              6. **【四大分頁切換 Y 軸基準線下修】**：
                 - 基準線下修至 12.5% sh，精準命中分頁文字本體，避開黑色指示條與下方廣告橫幅。
            files: LineWalkAutoAd.apk
            prerelease: false
