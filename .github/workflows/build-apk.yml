name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.71
          git push -f origin latest-apk || true
          git push -f origin v1.15.71 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.71 (修復抽抽樂中獎與廣告重疊Bug、酷澎Node空點斷路器、秒後可獲獎勵防早點 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.71 (Run #${{ github.run_number }}) - 依使用者實機指導修復抽抽樂中獎彈窗與背景廣告重疊Bug、根除酷澎廣告 Node[txt=✖] 連點1135次死循環、嚴禁「秒後可獲獎勵」提早點X防中斷確認彈窗、三星瀏覽器極速拉回散步趣 (相容歷代版本 v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【抽抽樂中獎結果彈窗與背景廣告重疊 Bug】**：
                 - 散步趣已知 Bug：播放全螢幕廣告時，抽抽樂中獎結果視窗可能擋在廣告前面。
                 - 依使用者指導：背後有廣告時，只能先點擊中獎彈窗底部的 [關閉] 按鈕，關閉中獎視窗後再點擊廣告右上角的叉叉 (X) 退出回到遊戲；背後無廣告時正常點擊綠色 [▶ x1 獲得]！
                 - 移除「完成任務/大量金幣」否決條件，徹底防止 8 獎中獎彈窗被誤判為宣傳廣告而連點 111 次右上角 (X)。
              2. **【根除酷澎 Coupang 廣告 Node[txt=✖] 連點 1135 次死循環】**：
                 - 在無障礙節點點擊中加入 3 次斷路器防護，若連續 3 次無效自動黑名單該座標；
                 - Coupang 專屬備援策略：點擊正下方圓形灰底 (X) 退出；連續 4 次發送返回鍵，連續 5 次強制拉回散步趣。
              3. **【嚴禁「秒後可獲獎勵」倒數提早點 X & 彈窗優先點 [繼續]】**：
                 - 偵測到「\d+ 秒後可獲獎勵 / 發放獎勵」時，將倒數計時判定提前至所有關閉按鈕之前，倒數未完嚴禁點擊膠囊內的 ✕；
                 - 若誤觸彈出「關閉廣告？您將無法獲得獎勵」對話框，優先點擊藍色按鈕 [繼續] 恢復播放正常領獎，並禁止點擊對話框標題「關閉廣告？」。
              4. **【三星瀏覽器 (sbrowser) 極速拉回散步趣】**：連續 2 次返回未退出時立即直接拉回散步趣前景。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.71)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.71
            name: "散步趣助手 v1.15.71 (修復抽抽樂中獎與廣告重疊Bug、酷澎Node空點斷路器、秒後可獲獎勵防早點)"
            body: |
              **散步趣助手 v1.15.71 (Run #${{ github.run_number }}) - 依使用者實機指導修復抽抽樂中獎彈窗與背景廣告重疊Bug、根除酷澎廣告 Node[txt=✖] 連點1135次死循環、嚴禁「秒後可獲獎勵」提早點X防中斷確認彈窗、三星瀏覽器極速拉回散步趣 (相容歷代版本 v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【抽抽樂中獎結果彈窗與背景廣告重疊 Bug】**：
                 - 散步趣已知 Bug：播放全螢幕廣告時，抽抽樂中獎結果視窗可能擋在廣告前面。
                 - 依使用者指導：背後有廣告時，只能先點擊中獎彈窗底部的 [關閉] 按鈕，關閉中獎視窗後再點擊廣告右上角的叉叉 (X) 退出回到遊戲；背後無廣告時正常點擊綠色 [▶ x1 獲得]！
                 - 移除「完成任務/大量金幣」否決條件，徹底防止 8 獎中獎彈窗被誤判為宣傳廣告而連點 111 次右上角 (X)。
              2. **【根除酷澎 Coupang 廣告 Node[txt=✖] 連點 1135 次死循環】**：
                 - 在無障礙節點點擊中加入 3 次斷路器防護，若連續 3 次無效自動黑名單該座標；
                 - Coupang 專屬備援策略：點擊正下方圓形灰底 (X) 退出；連續 4 次發送返回鍵，連續 5 次強制拉回散步趣。
              3. **【嚴禁「秒後可獲獎勵」倒數提早點 X & 彈窗優先點 [繼續]】**：
                 - 偵測到「\d+ 秒後可獲獎勵 / 發放獎勵」時，將倒數計時判定提前至所有關閉按鈕之前，倒數未完嚴禁點擊膠囊內的 ✕；
                 - 若誤觸彈出「關閉廣告？您將無法獲得獎勵」對話框，優先點擊藍色按鈕 [繼續] 恢復播放正常領獎，並禁止點擊對話框標題「關閉廣告？」。
              4. **【三星瀏覽器 (sbrowser) 極速拉回散步趣】**：連續 2 次返回未退出時立即直接拉回散步趣前景。
            files: LineWalkAutoAd.apk
            prerelease: false
