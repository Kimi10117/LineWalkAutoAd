name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.54 (賓果5次容錯接續Get、好友送禮防截胡與收禮抽屜互斥、Meta網頁預覽右上角✕秒關與全螢幕比例通用自適應 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.54 (Run #${{ github.run_number }}) - 升級自 v1.15.53 (相容歷代版本 v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【每日賓果 5 次開格容錯與平滑接續連線 Get】**：
                 - 散步趣開格按鈕無反應時容許重試次數放寬至 5 次；
                 - 連續 5 次無反應自動降級依序領取所有連線 Get 獎勵，完成後點擊 (X) 關閉視窗並推進至抽抽樂。
              2. **【好友送禮彈窗最高優先保護與收禮抽屜互斥】**：
                 - isReceiveGiftDialogOpen 嚴格排除所有好友送禮特徵（「也送給自己」、「贈送金幣」、「剩餘贈送次數」等），根除送禮彈窗被收禮邏輯搶劫點擊之缺陷；
                 - 主迴圈前置攔截 isSendGiftModalOpen，100% 優先點擊綠色「也送給自己」觀看廣告獲取最大獎勵。
              3. **【Meta 網頁預覽 (Preview of ...) 右上角白叉 ✕ 秒關與三重死鎖根除】**：
                 - 右上角幾何 X 掃描區統一為連續熱區（y in 4.5%..16%），徹底移除 isBingoCloseZone 盲區過濾；
                 - 外部瀏覽器返回後自動清空 blacklistedPoints，解除實體關閉按鈕之誤封鎖；
                 - 新增 Meta 網頁預覽專屬秒關偵測，優先點擊右上角實體打叉符號 (sw * 0.910f, sh * 0.0725f)，杜絕無效返回鍵輪巡與 54 秒超時殺死廣告導致獎勵丟失。
              4. **【全螢幕多比例通用適配 (Universal Ratio Adaptation)】**：
                 - 全面支援 16:9、19.5:9、21:9、22:9（如 Galaxy Z Flip 5 / Fold 等）各式長寬比與解析度之動態換算。
            files: LineWalkAutoAd.apk
            prerelease: false
