name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.6 (徹底修復冷卻彈窗卡死、根除完成次數虛增幽靈迴圈、嚴格隔離抽抽樂中獎判定 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.6 (Run #${{ github.run_number }})**
              1. **【徹底修復「卡在冷卻彈窗且已完成次數一直自己增加」的幽靈迴圈】**：
                 - **根本原因**：先前為了抓取抽抽樂「x1 獲得」綠色按鈕，在主循環掃描時過早觸發判定，誤將「時間」放置獎勵冷卻彈窗頂部的標題文字【獲得票券！】辨識為獲票按鈕，程式持續點擊標題並轉入廣告監控，在 1 秒後因仍在散步趣畫面判定「回到遊戲完成廣告」，導致「完成次數」瘋狂自增（暴增至 82+ 次），且永遠無法點到下方的 [取消] 按鈕！
                 - **全方位隔離與精準匹配**：
                   1. **嚴格限制生效時機**：抽抽樂獲票按鈕僅限在【抽抽樂階段】或明確具有中獎字樣（`中獎囉`、`中獎`、`Thank you for watching`）時才會觸發，絕不在主畫面日常四大分頁誤判！
                   2. **排除所有彈窗標題**：嚴格過濾包含驚嘆號或【獲得票券！】、【獲得金幣！】的標題文字，且綠色膠囊按鈕必須具備寬度大於螢幕 40% 的特徵（排除小蘋果圖示）。
                   3. **恢復冷卻取消正常運作**：常規彈窗在獎勵全部進入冷卻（回復還需 00:xx:xx）時，會順暢點擊底部的【取消】按鈕，並流暢切換到下一分頁（遊戲、步數）繼續巡邏！
              2. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
