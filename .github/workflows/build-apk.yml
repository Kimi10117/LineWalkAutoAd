name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.5 (抽抽樂自動點綠色看廣告獲票[▶ 🎫 x1 獲得]、大幅提速廣告判斷與分頁巡邏、根除任務面板殘留每週判斷 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.5 (Run #${{ github.run_number }})**
              1. **【抽抽樂抽完自動點擊綠色看廣告獲票按鈕 [▶ 🎫 x1 獲得]】**：
                 - **解決問題**：先前抽抽樂在抽完後彈出中獎結果視窗時，程式誤將其判定為一般完成彈窗而直接點擊底部的 [關閉]，或未偵測到該綠色膠囊按鈕，導致錯失看廣告再賺 1 張抽獎券的機會。
                 - **綠色按鈕精準聚類與專屬保護**：新增專門針對抽獎結果彈窗的 LINE 鮮綠色膠囊按鈕偵測演算法（`#06C856` 綠色像素聚類 + `x1 獲得` OCR 備援），優先點擊看廣告獲票！並在有綠色獲票按鈕時嚴格禁止提前點擊 [關閉]。
              2. **【大幅提升畫面掃描與看廣告判斷速度】**：
                 - **循環掃描間隔提速**：主循環間隔由 2200ms 全面提速至 1200ms（並加入上限保護，覆蓋更新的使用者也能立即享受快 2 倍的反應速度）。
                 - **空分頁確認時間減半**：四大分頁無獎勵確認次數由 4 次減少為 2 次，跳過無效分頁的等待時間減少 5~7 秒，巡邏更加流暢迅捷！
              3. **【徹底剷除任務面板「每週」殘留邏輯，根治面板開關迴圈】**：
                 - 徹底移除任務面板程式碼中任何關於「每週」的動態 OCR 判斷，嚴格鎖定 LINE 散步趣真實的【特別】與【每日】雙分頁架構。
                 - 確保檢查完「每日」後立即標記完成、關閉視窗，並加上 UI 動畫保護延遲後順暢推進至【好友送禮】與【接收禮物】階段！
              4. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
