name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.33 (好友頁啟動自動回首頁、略過廣告秒點不拖延、好友送禮送滿才收禮 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.33 (Run #${{ github.run_number }})**
              1. **【啟動巡邏嚴格順序保證：起手在好友頁自動點回集點首頁】**：
                 - 若使用者啟動助手時畫面停留在底部「好友」分頁，助手立即自動點擊底部「集點」按鈕切回主畫面，確保嚴格遵循【首頁(移動) ➔ 時間 ➔ 遊戲 ➔ 步數】巡邏順序！
              2. **【略過廣告秒速點擊：絕不等整段廣告播完】**：
                 - 提升「略過按鈕」（「略過廣告」、「可略過廣告」、「Skip Ad」、「略過」等）至倒數計時檢測之前！
                 - 一旦略過按鈕浮現（通常在 5 秒後），助手立即秒速點擊跳過廣告，徹底告別必須等待 30 秒整段廣告播完的冗長等待！
              3. **【好友送禮額度滿額保證：送完禮物才收禮物】**：
                 - 增加剩餘額度智慧偵測（`hasRemainingGiftQuota`），只要畫面仍顯示剩餘額度（如 `3/5`），絕對禁止提前結束送禮流程進入收禮！
                 - 縮小按鈕遮罩半徑至 `sh * 0.020f`，清單滾動與關閉送禮彈窗時及時清空重整座標，若有剩餘額度向下滾到底會自動向上滾回頂部重新搜尋好友，確保完整送完全部好友！
              4. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
