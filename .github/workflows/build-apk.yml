name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.12 (修復無法點擊略過廣告、徹底根除自己跳出回桌面問題 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.12 (Run #${{ github.run_number }})**
              1. **【全面修復「無法點擊略過廣告」問題】**：
                 - **根本原因診斷**：現代影音廣告（如 LINE チョッキンズ、Unity、AdMob）播放滿 5 秒後出現「略過廣告 / Skip Ad / 広告をスキップ」，但畫面上仍顯示影片總長倒數計時（如「還有 25 秒」）。先前邏輯在檢查略過按鈕前，若看到倒數計時 > 1 秒便直接提早返回，導致機器人在廣告播放期間對所有「略過廣告」按鈕視而不見，白白乾等 30 秒！此外先前 OCR 字長限制為 6，導致「略過廣告 ▶|」、「広告をスキップ」、「Skip Ad」等 7 字元以上按鈕被誤拒；無障礙節點亦將 16:9 劇院黑邊區域誤判為橫幅廣告而忽略。
                 - **修復方案**：
                   1. **略過廣告急先鋒 (Active Skip & Close Hunter)**：在倒數計時判斷之前，第一優先掃描無障礙節點與全螢幕 OCR 是否出現「略過廣告」、「跳過廣告」、「広告をスキップ」、「Skip Ad」按鈕，一旦出現立即點擊略過！
                   2. **支援 16:9 劇院黑邊廣告內容頂部略過鈕**：全螢幕廣告狀態下放行畫面中上段 (12%~36%) 的節點辨識，不再被主畫面橫幅過濾誤殺。
                   3. **字數上限放寬至 16 字元**：完整相容含方向符號的「略過廣告 ▶|」與英日語 Skip 按鈕。
              2. **【徹底根除「有時候會自己按跳出回桌面」問題】**：
                 - **根本原因診斷**：先前 `doubleNavigateBack()` 於 180ms 內連發兩次系統返回鍵，且未檢查當前前景應用。第一下返回關閉了廣告或彈窗後，第二下返回直接擊中《LINE 散步趣》主畫面，導致系統觸發遊戲退出機制直接退回 Android 手機桌面！在廣告逾時 watchdog 與選單關閉流程中亦存在多餘的返回鍵調用。
                 - **修復方案**：
                   1. **safeNavigateBack 前景安全防護**：於無障礙服務加入前景 Package 檢查，當《LINE 散步趣》(com.linecorp.LGWALK) 已在前景時，絕對攔截並禁止發送系統返回鍵，徹底杜絕跳回手機桌面！
                   2. **精準點擊關閉鈕替代返回鍵**：選單與輕鬆賺等畫面改為精確點擊右上角 (X) 關閉，移除多餘的返回鍵調用。
                   3. **全域逾時強制喚醒防護**：廣告超時 watchdog 改用 safeNavigateBack 與直接喚醒 `bringAppToFront`，安全將散步趣拉回前景。
              3. **持續保持 Persistent Key 簽名，支援直接覆蓋安裝更新（免解除安裝）**。
            files: LineWalkAutoAd.apk
            prerelease: false
