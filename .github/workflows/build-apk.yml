name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.26 (支援 Meta/影音廣告「▶|」略過鈕自動點擊、精密頂部安全禁區放行角落下廣告控制、確保順暢領取金幣 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.26 (Run #${{ github.run_number }})**
              1. **【重要修復：全面支援 Meta / 影音廣告「▶|」略過按鈕自動精確點擊】**：
                 - 針對 Meta Audience Network ("Ad 1 of 2", "Ads served by Meta")、Google AdMob、Unity Ads 等現代影音廣告在右上角/左上角顯示之深底圓形「▶|」快速略過圖示，新增專屬免樣本幾何圖形辨識器 (`detectCornerSkipButton`)。
                 - 播放達 4 秒後立即精準掃描並主動點擊「▶|」略過，徹底解決影音廣告無文字導致無法略過、乾等 36 秒超時遭強制退出而領不到金幣的問題，順暢跳過並即刻獲得獎勵！
              2. **【精密優化：頂部安全禁區聚焦螢幕中央通知與動態島，放行兩側角落廣告控制鈕】**：
                 - 精密校正頂部安全防護禁區：鎖定螢幕中央水平區域 (`x in 18%..82% && y < 8%`) 嚴格攔截所有系統通知、LINE 懸浮訊息與即時動態（動態島/靈動膠囊）。
                 - 兩側角落 (`x > 82%` 或 `x < 18%`) 放行廣告右上角/左上角關閉 (X) 與「▶|」略過鈕，杜絕因 blanket ban 誤阻廣告操作。
                 - 廣告關閉處理器 (`AdCloserHandler`) 主動點擊時全面標記 `allowTopSafeZone = true`，確保角落按鈕 100% 成功派發手勢。
              3. **【重要修復：系統頂部通知與即時動態嚴格防誤點】**：
                 - 幾何關閉按鈕偵測拉升至避開狀態列，重構選單判定，絕不誤判通知文字或賓果「抽選」為選單，廢除齒輪盲點，改以安全返回鍵退出。
              4. **【重要修復：每日賓果重構與徹底消除開關輪迴】**：
                 - 處於賓果彈窗時完全停用宣傳幾何 X 偵測，消除開關輪迴。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻或今日上限，再依序掃描領取所有直欄「Get」獎勵並鎖定狀態。
              5. **【第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin 等 12 大套件。
                 - 前景為廣告套件時 100% 阻斷返回鍵，確保廣告完整播放並順利領取獎勵。
              4. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              2. **【懸浮視窗開始預設收折為單行膠囊 + 點擊「+」展開】**：
                 - 點擊「開始」時預設自動收折為緊湊單行膠囊，防止遮擋主畫面任何重要資訊與按鈕。
                 - 徹底重構收折佈局：移除所有固定小寬度限制，文字與狀態一律單行完整顯示，不換行、不省略截斷（零出現 ...）。
                 - 增加邊界保護與動態螢幕旋轉適應，點擊「+」即可隨時展開控制面板。
              2. **【離開散步趣 App 嚴格防誤點安全機制】**：
                 - 偵測到當前非散步趣 App 時，嚴禁在外部 App 內隨意亂點任何按鈕。
                 - 僅允許安全發送系統返回鍵 (Back) 或點擊右上角全螢幕廣告 (X)，安全拉回散步趣主畫面。
              3. **【全任務無窮循環巡邏機制】**：
                 - 一輪全任務執行完畢後不再強制停止，自動進入 5 秒冷卻計時（防風控），接著重頭重新檢查所有在 App 內勾選的啟用項目，持續循環直到使用者手動暫停。
              4. **【每日賓果點擊邏輯重構（先開格，再領 Get）】**：
                 - 嚴格依照指示：優先點擊橘色「立即開啟賓果格」直到全部開完（或冷卻/上限中）。
                 - 開格完成後，依序點擊所有連線達成之 [Get] 獎勵，直到所有直欄沒有 Get 可點後，自動點擊右上角 (X) 關閉並推進至下一項目。
              5. **【App 內新增「匯出日誌」與「複製日誌」功能】**：
                 - 在主介面新增「匯出日誌」按鈕（透過系統 Intent 分享，具備安全行數上限防止 Binder IPC 崩潰）與「複製日誌」按鈕，方便後續偵錯與回報。
              6. **【徹底修復好友送禮卡死與自動開啟收禮抽屜】**：
                 - 新增送禮次數上限檢查（偵測 5/5 或今日上限直接判定完成）。
                 - 修復滾動清單時誤清空已送清單導致短清單死循環重複點擊同一位好友的重大問題。
                 - 送禮完成後，自動點擊右上角【禮物盒】開啟收禮抽屜，依序以「直接領取(免看廣告)」與「[▶]看廣告」領取所有禮物。
              7. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
