name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.59
          git push -f origin latest-apk || true
          git push -f origin v1.15.59 || true
        
      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.59 (FB誤跳轉立即返回散步趣、步數等領獎完成彈窗『獲得15張票券！』關閉按鈕修復 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.59 (Run #${{ github.run_number }}) - 升級自 v1.15.58 (相容歷代版本 v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【外部社群應用（如 Facebook 粉絲專頁）誤跳轉立即返回散步趣】**：
                 - 攔截誤跳轉至 Facebook App (com.facebook.katana)、Instagram 等外部獨立社群應用；
                 - 一旦偵測到前景為外部社群應用，不再視為廣告容器等待 53 秒，而是立即發送系統返回鍵退出並拉回《LINE 散步趣》，徹底解決卡在 FB 粉絲專頁一直滑動的問題。
              2. **【步數等常規領獎完成彈窗「獲得15張票券！」關閉按鈕修復】**：
                 - 修復抽抽樂排除條件誤將「獲得15張票券！」中的「15張」匹配為「5張」導致一票否決領獎關閉按鈕的缺陷；
                 - 新增中央半透明遮罩與白底黑字 [ 關閉 ] 膠囊按鈕的像素級備援識別，即使 OCR 未能辨識出「關閉」文字或被懸浮視窗遮擋，也能準確點擊 [ 關閉 ] 按鈕退出彈窗，繼續領取後續步數獎勵。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.59)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.59
            name: "散步趣助手 v1.15.59 (FB誤跳轉立即返回散步趣、步數等領獎完成彈窗『獲得15張票券！』關閉按鈕修復)"
            body: |
              **散步趣助手 v1.15.59 (Run #${{ github.run_number }}) - 升級自 v1.15.58 (相容歷代版本 v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【外部社群應用（如 Facebook 粉絲專頁）誤跳轉立即返回散步趣】**：
                 - 攔截誤跳轉至 Facebook App (com.facebook.katana)、Instagram 等外部獨立社群應用；
                 - 一旦偵測到前景為外部社群應用，不再視為廣告容器等待 53 秒，而是立即發送系統返回鍵退出並拉回《LINE 散步趣》，徹底解決卡在 FB 粉絲專頁一直滑動的問題。
              2. **【步數等常規領獎完成彈窗「獲得15張票券！」關閉按鈕修復】**：
                 - 修復抽抽樂排除條件誤將「獲得15張票券！」中的「15張」匹配為「5張」導致一票否決領獎關閉按鈕的缺陷；
                 - 新增中央半透明遮罩與白底黑字 [ 關閉 ] 膠囊按鈕的像素級備援識別，即使 OCR 未能辨識出「關閉」文字或被懸浮視窗遮擋，也能準確點擊 [ 關閉 ] 按鈕退出彈窗，繼續領取後續步數獎勵。
            files: LineWalkAutoAd.apk
            prerelease: false
