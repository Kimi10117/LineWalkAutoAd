name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.84
          git push -f origin latest-apk || true
          git push -f origin v1.15.84 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.84 (左上角跨界略過鈕 [▶|] 偵測、幾何 X 角落收斂、Watchdog 雙段 Task 升級與 OCR 逾時保護 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.84 (Run #${{ github.run_number }}) - 左上角跨界略過鈕 [▶|] 偵測、幾何 X 角落收斂、Watchdog 雙段 Task 升級與 OCR 逾時保護 (相容歷代版本 v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【左上角跨界 [▶|] 略過鈕偵測與膠囊／字詞防護】**：
                 - `TemplateMatcher` 擴展左上角 `detectCornerFastForwardSkip` 掃描區（支援僅上半圈深灰圓框跨界亮背景），搭配有界 8 連通 `isCrossXGlyph` 與 `hasCapsuleExtension` 排除角落幾何 X 與橫向倒數膠囊；`AdCloserHandler` 加入 `hasAdjacentCapsuleOcr` 防誤觸並移除 `Reveal Swipe` 的 `"Play"` 寬鬆關鍵字。
              2. **【收斂幾何 X 掃描範圍排除橫幅促銷圖示】**：
                 - `detectCornerGeometricX` 收斂右上角左側 `0.80f`、左上角橫向 `0.020f..0.162f` 與下緣 `0.140f`，排除 `13.5%~16.6%` 促銷與專頁圖示同時保留真實 `11.3%` 角落叉鈕。
              3. **【Watchdog 主畫面先檢與內嵌廣告雙段 Task 強退升級】**：
                 - `handleAdWatching` 逾時前先確認是否已返回主畫面避免誤按返回鍵；面對吞噬 Back 的內嵌廣告（如 `com.linecorp.LGWKTW`），新增 `pressHome()` + `CLEAR_TOP` -> 截圖驗證或連兩次無截圖直上 `CLEAR_TASK` 終結 65 秒循環。
              4. **【OCR 逾時防護與版本升級】**：
                 - `OcrRecognizer.recognize` 加入 `withTimeoutOrNull(2500L)` 安全防護（維持 `CancellationException` 重拋），versionCode 117 / versionName 1.15.84（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.84)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.84
            name: "散步趣助手 v1.15.84 (左上角跨界略過鈕 [▶|] 偵測、幾何 X 角落收斂、Watchdog 雙段 Task 升級與 OCR 逾時保護)"
            body: |
              **散步趣助手 v1.15.84 (Run #${{ github.run_number }}) - 左上角跨界略過鈕 [▶|] 偵測、幾何 X 角落收斂、Watchdog 雙段 Task 升級與 OCR 逾時保護**
              1. **【左上角跨界 [▶|] 略過鈕偵測與膠囊／字詞防護】**：
                 - `TemplateMatcher` 擴展左上角 `detectCornerFastForwardSkip` 掃描區（支援僅上半圈深灰圓框跨界亮背景），搭配有界 8 連通 `isCrossXGlyph` 與 `hasCapsuleExtension` 排除角落幾何 X 與橫向倒數膠囊；`AdCloserHandler` 加入 `hasAdjacentCapsuleOcr` 防誤觸並移除 `Reveal Swipe` 的 `"Play"` 寬鬆關鍵字。
              2. **【收斂幾何 X 掃描範圍排除橫幅促銷圖示】**：
                 - `detectCornerGeometricX` 收斂右上角左側 `0.80f`、左上角橫向 `0.020f..0.162f` 與下緣 `0.140f`，排除 `13.5%~16.6%` 促銷與專頁圖示同時保留真實 `11.3%` 角落叉鈕。
              3. **【Watchdog 主畫面先檢與內嵌廣告雙段 Task 強退升級】**：
                 - `handleAdWatching` 逾時前先確認是否已返回主畫面避免誤按返回鍵；面對吞噬 Back 的內嵌廣告（如 `com.linecorp.LGWKTW`），新增 `pressHome()` + `CLEAR_TOP` -> 截圖驗證或連兩次無截圖直上 `CLEAR_TASK` 終結 65 秒循環。
              4. **【OCR 逾時防護與版本升級】**：
                 - `OcrRecognizer.recognize` 加入 `withTimeoutOrNull(2500L)` 安全防護（維持 `CancellationException` 重拋），versionCode 117 / versionName 1.15.84（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
