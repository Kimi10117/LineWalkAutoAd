name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.14.6 (徹底修復誤點底層其他廣告、嚴格防護橫幅廣告粉紅像素誤判、主畫面快速回歸 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.14.6 (Run #${{ github.run_number }})**
            1. **【徹底修復「一直會亂點到底下的其他廣告」嚴重問題】**：
               - **消除底層橫幅廣告粉紅像素誤判**：
                 修復先前在主畫面底層動漫/遊戲廣告（如雪洞さざね IRIAM 等）包含珊瑚粉紅色塊時，被 `findCoralPinkButton` 誤認成「彈窗看廣告鈕」，引發引擎將主畫面誤判為彈窗、直接點擊底層廣告並切入廣告監控的嚴重漏洞！
               - **增設領獎彈窗標題與取消鈕雙重硬驗證**：
                 規定領獎彈窗必須同時具備「獲得票券！/ 獲得金幣！」明確標題與底部「取消」按鈕；且只要主畫面頂部分頁與底部導覽列（集點/好友/使用/精選）清晰可見，嚴禁在下半部廣告區域進行任何點擊！
               - **看廣告按鈕強制文字關聯**：
                 粉紅按鈕必須在附近同時驗證到「獲得 / 看廣告 / 紅利」字樣，且嚴格排除「輕鬆賺 / Sponsored / adjoe / 開始遊玩 / 無料」等推廣字樣，徹底杜絕誤觸廣告！
            2. **【主畫面特徵極速識別與廣告監控安全退出】**：
               - 修正 `isGameScreenVisible` 與 `isLineWalkMainScreenVisible`，只要看見主畫面頂部四大分頁或底部導覽列，立即判定已回到遊戲主畫面，立即退出廣告監控，不再卡在「3. 廣告監控」！
            3. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
