name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          EXIT_CODE=1
          for attempt in 1 2 3; do
            echo "=== Gradle assembleRelease attempt ${attempt}/3 ==="
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
            EXIT_CODE=${PIPESTATUS[0]}
            echo "Gradle exit code (attempt ${attempt}): $EXIT_CODE"
            if [ $EXIT_CODE -eq 0 ]; then
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Transient build/repository error suspected; retrying in 15s..."
              sleep 15
            fi
          done
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.96
          git push -f origin latest-apk || true
          git push -f origin v1.15.96 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.96 (修復全黑過渡誤判鎖屏與0秒死鎖、Meta Trip.com連環逾時與相位升級解鎖、收禮925次無限關窗與Level 3助手卡排除及日誌升級 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.96 (Run #${{ github.run_number }}) - 修復全黑過渡誤判鎖屏與0秒死鎖、Meta Trip.com連環逾時與相位升級解鎖、收禮925次無限關窗與Level 3助手卡排除及日誌升級 (相容歷代版本 v1.15.95, v1.15.94, v1.15.93, v1.15.92, v1.15.91, v1.15.90, v1.15.89, v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復全黑廣告載入誤判鎖屏 AOD 與 0 秒保護期死鎖】**：
                 - `OcrRecognizer.isLockscreenOrAodOcr` 忽略 `cy < 5.0% sh` 頂部系統狀態列時鐘與電量數字；`AdCloserHandler.processAdTick` 補上 `adStartTimeMs == 0L` 計時器自癒；`FloatingOverlayService` 修正保護期與設定/待機狀態標籤，不再誤顯 `[外部保護]`。
              2. **【修復 Meta Trip.com 廣告逾時、蝦皮 `>>一起` 誤點與 S24FE 右端解鎖】**：
                 - `detectAdCountdownWithSource` 排除 `Ad 1 of 2` Pod 標籤內獨立 `"1"`；Meta 容器停用左上角 Step 4C 並將 Trip/Multi-pod 門檻延至 12 秒；新增 `canBypassEarlyVisualSkipBlacklist` 相位升級解鎖後期 `Skip`/`X`；收斂 `hitsTopRightRedirectPillStrip` 僅右上角有 `Google Play` 時啟用；Step 4A-1 與 Step 4B 雙層排除蝦皮中段 `>>一起`；S24FE 無右上誤觸座標時不封死 `[Google Play ×]` 右端 `×`。
              3. **【修復收禮空抽屜 925 次無限迴圈、Level 3 多工安全防護與日誌全面升級】**：
                 - 收緊 `ReceiveGiftTask` 標題比對並為 B4 加上 1-7 階段升級關閉與強制回集點脫困；`handleMissionDialog` 加上同點 3 次領取上限；Level 3 多工嚴格排除「散步趣助手」且選取最右遊戲卡片；補齊首頁 `首夏`／`貼圖任務` 修正、誤退回助手頁自動拉回、`smartcapture` 略過、`[重複抑制]` 日誌折疊、`cdSrc`/`blkSkip`、黑名單寫入事件、`formatTopCornerOcrDigest` 頂角 OCR 摘要及 `Level3多工滑除`／`助手頁自動拉回` 匯出統計。新增 `V1_15_96SimulationTest`，versionCode 129 / versionName 1.15.96（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.96)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.96
            name: "散步趣助手 v1.15.96 (修復全黑過渡誤判鎖屏與0秒死鎖、Meta Trip.com連環逾時與相位升級解鎖、收禮925次無限關窗與Level 3助手卡排除及日誌升級)"
            body: |
              **散步趣助手 v1.15.96 (Run #${{ github.run_number }}) - 修復全黑過渡誤判鎖屏與0秒死鎖、Meta Trip.com連環逾時與相位升級解鎖、收禮925次無限關窗與Level 3助手卡排除及日誌升級**
              1. **【修復全黑廣告載入誤判鎖屏 AOD 與 0 秒保護期死鎖】**：
                 - `OcrRecognizer.isLockscreenOrAodOcr` 忽略 `cy < 5.0% sh` 頂部系統狀態列時鐘與電量數字；`AdCloserHandler.processAdTick` 補上 `adStartTimeMs == 0L` 計時器自癒；`FloatingOverlayService` 修正保護期與設定/待機狀態標籤，不再誤顯 `[外部保護]`。
              2. **【修復 Meta Trip.com 廣告逾時、蝦皮 `>>一起` 誤點與 S24FE 右端解鎖】**：
                 - `detectAdCountdownWithSource` 排除 `Ad 1 of 2` Pod 標籤內獨立 `"1"`；Meta 容器停用左上角 Step 4C 並將 Trip/Multi-pod 門檻延至 12 秒；新增 `canBypassEarlyVisualSkipBlacklist` 相位升級解鎖後期 `Skip`/`X`；收斂 `hitsTopRightRedirectPillStrip` 僅右上角有 `Google Play` 時啟用；Step 4A-1 與 Step 4B 雙層排除蝦皮中段 `>>一起`；S24FE 無右上誤觸座標時不封死 `[Google Play ×]` 右端 `×`。
              3. **【修復收禮空抽屜 925 次無限迴圈、Level 3 多工安全防護與日誌全面升級】**：
                 - 收緊 `ReceiveGiftTask` 標題比對並為 B4 加上 1-7 階段升級關閉與強制回集點脫困；`handleMissionDialog` 加上同點 3 次領取上限；Level 3 多工嚴格排除「散步趣助手」且選取最右遊戲卡片；補齊首頁 `首夏`／`貼圖任務` 修正、誤退回助手頁自動拉回、`smartcapture` 略過、`[重複抑制]` 日誌折疊、`cdSrc`/`blkSkip`、黑名單寫入事件、`formatTopCornerOcrDigest` 頂角 OCR 摘要及 `Level3多工滑除`／`助手頁自動拉回` 匯出統計。新增 `V1_15_96SimulationTest`，versionCode 129 / versionName 1.15.96（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
