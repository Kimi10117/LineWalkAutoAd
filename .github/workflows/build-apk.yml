name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.3 (修復收禮開關卡死、綠色播放鍵▶獨立聚類、先全部送禮再收禮、移動全點完才切換 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.3 (Run #${{ github.run_number }})**
              1. **【徹底修復「接收禮物」視窗反覆開關卡死、精準點擊綠色播放鍵 [▶] 看廣告領獎】**：
                 - **解決問題**：先前因「禮物」視窗為半頁抽屜式彈窗，背景仍殘留頂部四大分頁文字，導致判定視窗開啟失敗；且多筆禮物時所有綠色像素被混在同一外框中，導致高度超標判定為無效按鈕，程式誤以為已無禮物而點擊右上角 (X) 關閉，隨後又在主畫面點禮物盒開啟，造成無限「開開關關」循環！
                 - **全新獨立按鈕 Y 軸分組聚類**：
                   現在採用獨立垂直聚類演算法，無論清單中有多少個好友送來的禮物，都能精準分離出每一顆綠色播放膠囊按鈕，並優先點選最上方的一筆點擊看廣告！
                 - **新增多重 OCR 備援定位**：
                   透過「收到...送來的禮物」文字行水平右側與「今天...止」截止時間正上方雙重輔助定位，確保 100% 準確點中播放按鈕！
              2. **【嚴格調整巡邏順序：先全部送完禮物，再接收全部禮物】**：
                 - 依使用者要求，調整日常巡邏順序為：四大分頁 ➔ 每日賓果 ➔ 抽抽樂 ➔ 任務 ➔ **先全部送禮物 (進入好友排行榜送禮/送自己直到列表最底)** ➔ **再收全部禮物 (逐一觀看廣告領取清單中所有禮物)**。
              3. **【徹底修復「移動」獎勵中斷問題：必須全部點完再切換至下一分頁】**：
                 - **根除誤點 [取消] 導致提前切換分頁**：先前在領獎彈窗載入中時，因缺乏冷卻判定保護而誤觸 [取消]，導致移動分頁被提前標記為已領完。現在嚴格規定**只有在明確出現倒數冷卻文字（回復還需、還需、00:xx）時才允許點擊 [取消]**！
                 - **移動分頁全數領取完成保護**：在移動分頁點完一次看廣告回來後，若還有滿量表或未領取獎勵，絕對留在此分頁繼續點擊領取，直到所有移動量表與車廂獎勵皆領完反灰後，才切換到時間分頁！
              4. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
