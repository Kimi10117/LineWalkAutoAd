name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.9 (時間等分頁自動按取消與流暢巡邏更新版 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.9.0 (Run #${{ github.run_number }})**
            1. **【自動點擊「取消」按鈕】**：
               - 當在「時間」等分頁領取完畢、按鈕皆進入「回復還需」冷卻倒數時，自動點擊彈窗底部的「取消」按鈕關閉視窗，絕不卡在彈窗！
               - 廣告監控器（AdCloserHandler）升級：當全螢幕廣告結束回到遊戲停留在帶有「取消」的冷卻彈窗時，立即點擊「取消」回到遊戲主頁，順暢無縫銜接後續四大分頁與每日任務巡邏！
            2. **【抽抽樂】智慧抽獎（依使用者規則）**：優先 50 抽、次選免費抽、嚴禁點 5 張。
            3. **【每日賓果】自動開格與連線獎勵**。
            4. **【任務】全分頁自動領取**。
            5. **【好友排行榜送禮】**（優先送禮也送自己 + 向下滾動名單）。
            6. **支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
