name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.50 (修復可玩式廣告與結束卡片返回鍵阻斷、強化 End Card 識別與巡邏廣告偵測 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.50 (Run #${{ github.run_number }})**
              1. **【全面修復廣告結束卡片 (End Card) 返回鍵阻斷】**：
                 - 修正 AdCloserHandler 中各項超時與結束卡片返回鍵邏輯，放行 `allowInGame = true`，徹底解決內部廣告（`com.linecorp.LGWKTW`）發送返回鍵被服務安全機制誤攔截導致卡死在結束頁面 50 秒以上的重大缺陷。
                 - 擴充廣告結束卡片 (`isEndCard`) 識別詞彙，涵蓋「下載」、「立即下載」、「連勝中」、「金幣」、「現金回饋」等互動遊戲與應用推廣 End Card，於播放 15 秒後自動秒速派發安全返回鍵退出廣告。
              2. **【放行廣告容器超時返回鍵防護】**：
                 - 調整 Accessibility 服務中的第三方廣告容器保護規則，在常規期間禁止返回鍵，但在超時或結束卡片觸發（`allowInGame = true`）時放行返回鍵，確保卡死時能確實退出廣告。
              3. **【巡邏模式全面支援可玩式遊戲廣告識別】**：
                 - 巡邏模式廣告關鍵字擴充支援「立即下載」、「下載」、「連勝中」等互動小遊戲特徵，若廣告在任何情況下出現在遊戲巡邏階段，立即轉入廣告監控模式，杜絕以主畫面巡邏模式盲點背景。
              4. **【超時拉回散步趣機制健全化】**：
                 - 逾時強制關閉時先派發雙次系統返回鍵並驗證主畫面，確認畫面回到遊戲後平滑恢復巡邏，防止 `bringAppToFront` 重新置頂殘留之廣告 Activity。
            files: LineWalkAutoAd.apk
            prerelease: false
