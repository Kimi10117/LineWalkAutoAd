name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.4 (修復任務面板反覆開關循環、適配實際雙分頁[特別/每日]、任務完成標記推進 - Run #${{ github.run_number }})"
            body: |
              ✅ **版本：v1.15.4 (Run #${{ github.run_number }})**
              1. **【徹底修復任務面板反覆開關無限循環問題】**：
                 - **根本原因**：先前程式預設任務面板有三個分頁（特別、每日、每週），但實機畫面上 LINE 散步趣只有「特別」（左側）與「每日」（右側）兩個分頁，並不存在「每週」！這導致檢查完「特別」與「每日」後，程式嘗試切換至不存在的「每週」而無法完成分頁清單，`isMissionCompleted` 永遠無法被設為 true。關閉面板回到主畫面後，程式又因任務未完成而再次點擊任務圖示打開面板，造成「打開 ➔ 查特別 ➔ 點每日 ➔ 關閉 ➔ 又打開」的無限死循環！
                 - **適配實際雙分頁架構**：將預設分頁序列修正為「特別」與「每日」，並優化黑色選中膠囊偵測（左半部 `x < 0.40f` 判定為「特別」，右半部判定為「每日」），動態容錯支援若無「每週」則檢查完雙分頁後立即將 `isMissionCompleted` 標記為 true。
                 - **關閉後正確切換下一階段**：任務面板檢查關閉後，巡邏階段立即前進至【好友送禮】(`PatrolPhase.FRIEND_GIFT`)，接續進行【接收禮物】(`PatrolPhase.RECEIVE_GIFT`)，徹底告別開關迴圈！
              2. **【導覽列與好友切換加強 OCR 定位】**：
                 - 底部導覽列「散步趣」、「好友」按鈕在幾何定位基礎上加入文字 OCR 輔助匹配，確保在各種不同解析度與螢幕比例的手機上皆能精準切換頁面。
              3. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
            files: LineWalkAutoAd.apk
            prerelease: false
