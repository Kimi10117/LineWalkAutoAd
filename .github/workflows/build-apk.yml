name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.46 (徹底解決跳轉三星瀏覽器無法返回散步趣、根除誤點抽抽樂橫幅廣告與偽載入逾時 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.46 (Run #${{ github.run_number }})**
              1. **【根除跳轉三星瀏覽器 (com.sec.android.app.sbrowser) 與失控亂點問題】**：
                 - 徹底排除抽抽樂獎勵一覽誤點：`findPopupActionTarget` 與 `handleInGameScan` 全面重構，將子視窗任務（抽抽樂、每日賓果、好友送收禮）優先權提升至主畫面領獎彈窗之前；且嚴格限制主分頁領獎彈窗必須具備標題或底部取消按鈕，排除 `順位 / 抽獎 / 一覽 / 獎勵 / 規則` 等表頭關鍵字，徹底消滅將「觀看廣告抽獎獎勵(第三順位)」誤判為看廣告按鈕而點擊到下方網頁橫幅跳轉外部瀏覽器的重大問題。
                 - 外部應用保護與前景強制拉回：當偵測到三星瀏覽器 (`com.sec.android.app.sbrowser`)、Chrome、Google Play 等外部工具時，第 1~2 次 tick 先發送快速返回鍵；停留達 3 次 tick (約 4 秒) 立即透過 `bringAppToFront` 強制拉回《LINE 散步趣》，並即時切換至 `IN_GAME_SCAN` 巡邏狀態，杜絕留滯在廣告監聽狀態。
                 - 散步趣本體嚴格返回防護：修正 `AdCloserHandler` 中的安全返回鍵邏輯，當前景已處於散步趣 (`isGame == true`) 時，嚴禁發送 `allowInGame = true` 返回鍵，徹底消除「剛將散步趣喚醒拉回前景，又被重定向返回鍵踢出退回三星瀏覽器」的彈跳死循環。
              2. **【防護影音廣告頂部圖示與修正偽載入逾時】**：
                 - 延遲 Meta 備援熱區：`Meta備援左上角熱區` 僅在播放滿 28 秒以上且無其他關閉鈕時才作為最終備援點擊 1 次，嚴禁在廣告播放前 5~17 秒盲點左上角，杜絕誤觸廣告主商標或靜音喇叭而開啟瀏覽器。
                 - 廣告載入逾時改為連續 tick 計數：以 `adLoadingTicks` 連續 12 次 tick (約 15 秒) 判定真實載入卡死，徹底消除影音廣告播放滿 28~50 秒關閉後被 `elapsedSec >= 18` 誤判為「廣告伺服器載入逾時」而提早跳過任務的缺陷；且在 `isAdLoadingScreen` 中嚴格一票否決中獎與領獎彈窗。
                 - 擴展抽抽樂畫面特徵：`isGameScreenVisible` 支援偵測抽抽樂滾動後的 `50張`、`抽1次`、`免費抽` 等關鍵字，確保抽抽樂任何畫面皆能被無縫識別為遊戲畫面。
              3. **【Manifest 查詢權限補完與 Persistent Key 簽名維護】**：
                 - `<queries>` 新增 `com.linecorp.LGWKTW` 與 `jp.naver.line.android`，強化 Android 11+ 前景套件查詢可靠度。
                 - 維持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
