name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.10 (徹底修復時間分頁冷卻輪迴與反覆橫跳 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.10.0 (Run #${{ github.run_number }})**
            1. **【徹底修復冷卻彈窗反覆橫跳問題】**：
               - 當在「時間」等分頁領取完畢或按鈕皆進入「回復還需」冷卻倒數時，自動點擊「取消」關閉彈窗，並立即將該分頁標記為完成/冷卻中！
               - 關閉彈窗後自動順暢切換至下一分頁（時間 ➔ 遊戲 ➔ 步數 ➔ 每日賓果 ➔ 抽抽樂 ➔ 任務 ➔ 好友送禮），絕不再在原分頁反覆點擊陷入輪迴！
            2. **【暗底反灰按鈕與「回復還需」雙重精準過濾】**：
               - 色彩演算法升級：精準辨識彈窗暗底反灰按鈕 (60..235)，防止誤判冷卻按鈕。
               - OCR 文字冷卻雙重鎖：凡包含「回復還需 / 還需 / 倒數」之按鈕一律排除，絕不誤觸冷卻按鈕。
            3. **【抽抽樂】智慧抽獎（依使用者規則）**：優先 50 抽、次選免費抽、嚴禁點 5 張。
            4. **【每日賓果】自動開格與連線獎勵**。
            5. **【任務】全分頁自動領取**。
            5. **【好友排行榜送禮】**（優先送禮也送自己 + 向下滾動名單）。
            6. **支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
