name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.89
          git push -f origin latest-apk || true
          git push -f origin v1.15.89 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.89 (修復設定主畫面前景防誤觸保護暨 [設定]/座標/OCR 診斷日誌強化 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.89 (Run #${{ github.run_number }}) - 修復設定主畫面前景防誤觸保護暨 [設定]/座標/OCR 診斷日誌強化 (相容歷代版本 v1.15.88, v1.15.87, v1.15.86, v1.15.85, v1.15.84, v1.15.83, v1.15.82, v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【本助手主設定畫面 (`MainActivity`) 前景保護與雙重手勢鎖定】**：
                 - 修正 `AutoAdAccessibilityService.getForegroundPackageName` 與 `isOwnMainActivityForeground`：嚴格區分懸浮控制窗 (`FloatingOverlayService`) 與設定主畫面 (`MainActivity` `TYPE_APPLICATION` / `isForegroundVisible`)，切回設定頁時立即暫停掃描與點擊，並於 `performClick` / `performSwipe` 閘道直接拒絕派發手勢。
              2. **【設定異動 (`[設定]`)、點擊座標與非主畫面 OCR 線索日誌全面強化】**：
                 - 巡邏啟動寫入 `[設定] 巡邏啟動參數`；所有任務勾選、計時器與速度調整透過 `AutomationEngine.recordSettingChange` 即時紀錄異動；`[目標]`、`[廣告]`、`[完成]`、`[抽抽樂]` 補齊座標 (`formatPointCoord`)；非主畫面輪詢、`廣告未成功啟動` 與 `[狀態Snap]` 補齊前景套件與精簡 OCR 線索。
              3. **【子視窗 `D3A` 防誤切與單元測試驗證】**：
                 - `handleInGameScan` `D3A` 補齊 `!isAnySubDialog` 條件，避免賓果等子視窗內橫幅誤觸發 `AD_WATCHING`；新增 `V1_15_89SimulationTest`（4 項測試），versionCode 122 / versionName 1.15.89（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.89)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.89
            name: "散步趣助手 v1.15.89 (修復設定主畫面前景防誤觸保護暨 [設定]/座標/OCR 診斷日誌強化)"
            body: |
              **散步趣助手 v1.15.89 (Run #${{ github.run_number }}) - 修復設定主畫面前景防誤觸保護暨 [設定]/座標/OCR 診斷日誌強化**
              1. **【本助手主設定畫面 (`MainActivity`) 前景保護與雙重手勢鎖定】**：
                 - 修正 `AutoAdAccessibilityService.getForegroundPackageName` 與 `isOwnMainActivityForeground`：嚴格區分懸浮控制窗 (`FloatingOverlayService`) 與設定主畫面 (`MainActivity` `TYPE_APPLICATION` / `isForegroundVisible`)，切回設定頁時立即暫停掃描與點擊，並於 `performClick` / `performSwipe` 閘道直接拒絕派發手勢。
              2. **【設定異動 (`[設定]`)、點擊座標與非主畫面 OCR 線索日誌全面強化】**：
                 - 巡邏啟動寫入 `[設定] 巡邏啟動參數`；所有任務勾選、計時器與速度調整透過 `AutomationEngine.recordSettingChange` 即時紀錄異動；`[目標]`、`[廣告]`、`[完成]`、`[抽抽樂]` 補齊座標 (`formatPointCoord`)；非主畫面輪詢、`廣告未成功啟動` 與 `[狀態Snap]` 補齊前景套件與精簡 OCR 線索。
              3. **【子視窗 `D3A` 防誤切與單元測試驗證】**：
                 - `handleInGameScan` `D3A` 補齊 `!isAnySubDialog` 條件，避免賓果等子視窗內橫幅誤觸發 `AD_WATCHING`；新增 `V1_15_89SimulationTest`（4 項測試），versionCode 122 / versionName 1.15.89（完整保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
