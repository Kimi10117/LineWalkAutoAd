name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.29 (完美復刻 v1.7.0 倒數靜候黃金原則、無障礙節點白名單封鎖 Discord/Google Play 誤點、徹底解決廣告跳轉與金幣未入帳 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.29 (Run #${{ github.run_number }})**
              1. **【重大修復：完美復刻 v1.7.0 倒數靜候黃金原則，徹底消除影片中途亂點與拖延】**：
                 - **根本原因深究**：先前版本為了追求提早略過，將無障礙節點與 OCR 略過放在倒數計時之前，造成影片播放中途將影片內的動畫箭頭（>>）或容器節點判定為略過，在影片播放中途狂點畫面觸發跳轉 Google Play。
                 - **重歸 v1.7.0 黃金原則**：**倒數計時檢查最優先！** 只要畫面有明確倒數計時（「還有 15 秒」、「20 秒後可略過」），助手**嚴格保持安靜等候播放，絕不碰觸螢幕**！
                 - 等到倒數完畢（0 秒）或影片自然播畢，真實的「略過廣告 / Skip Ad / 關閉」出現後才進行精確點擊，廣告 15~20 秒自然結束，2 秒結算領獎，徹底消滅 1 分鐘拖延！
              2. **【重大除錯：無障礙節點移除 `applovin` 與 `dismiss`，加設套件白名單封鎖 Discord】**：
                 - **查明真相**：先前 `NodeInspector` 的 `AD_CLOSE_VIEW_IDS` 中包含 `"applovin"` 與 `"dismiss"`。AppLovin 廣告的主畫面容器包含 `applovin`，被誤當成關閉按鈕點擊，導致直接跳出開啟 Google Play！而 Discord 懸浮通知包含 `dismiss`，也被誤當成關閉鈕點擊，導致直接跳進 Discord！
                 - **徹底根治**：
                   - 刪除 `"applovin"` 與 `"dismiss"`，僅保留精準關閉 ID（`btn_close`, `al_skip`, `tt_video_ad_close` 等）。
                   - 增加套件名稱白名單檢查：**嚴格拒絕來自 `com.discord`、`com.android.systemui`、`com.android.vending` 的任何節點**，絕不誤點任何外部 App！
                   - 嚴格排除 `cy < 8% sh` 頂部通知與狀態列區域。
              3. **【移除廣告監控中途重複盲點漏洞】**：
                 - 徹底移除了巡邏引擎中途重複觸發 LINE 促銷盲點（`isLineInHousePromoAd`）的漏洞，杜絕在廣告播放期間向螢幕右上角盲送點擊。
              4. **【金幣 100% 穩定入帳】**：
                 - 徹底根除廣告播放中途跳轉中斷的問題，廣告 SDK 正常播畢回傳獎勵，金幣 100% 穩定領取入帳！
              6. **【每日賓果重構與徹底消除開關輪迴】**：
                 - 處於賓果彈窗時完全停用宣傳幾何 X 偵測，消除開關輪迴。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻或今日上限，再依序掃描領取所有直欄「Get」獎勵並鎖定狀態。
              7. **【第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin 等 12 大套件。
                 - 前景為廣告套件時 100% 阻斷返回鍵，確保廣告完整播放並順利領取獎勵。
              8. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              9. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
