name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.56
          git push -f origin latest-apk || true
          git push -f origin v1.15.56 || true
        
      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.56 (賓果冷卻識別與5次開格上限直接退出、主畫面Banner誤判LINE促銷彈窗根除、懸浮窗廣告監控假性卡死修復 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.56 (Run #${{ github.run_number }}) - 升級自 v1.15.55 (相容歷代版本 v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【每日賓果開格冷卻識別與 5 次上限直接退出機制】**：
                 - 頂部冷卻文字識別：若出現「距離下次抽選還有」、「\d+分鐘」，精準判定開格處於 30 分鐘冷卻中，不再盲目點擊；
                 - 移除中途計數抹除：刪除廣告狀態切換時清零開格計數的缺陷，開格嘗試次數精準維持至關閉視窗；
                 - 當開格達 5 次或冷卻中且下方無任何 Get 連線獎勵時，立即點擊右上角 (X) 關閉視窗並推進至抽抽樂，徹底解決卡死問題。
              2. **【主畫面商業廣告 Banner 誤判 LINE 全螢幕促銷彈窗根除】**：
                 - 主畫面特徵一票否決：若畫面出現四大分頁標籤、步數資訊（今天的步數、距離下次累積還有）或底部導覽列，100% 一票否決促銷彈窗；
                 - 關鍵字精準收緊：移除單獨的「快來領取」等通用詞，必須為邀請好友專屬上下文；
                 - 杜絕每秒無限重複點擊右上角 (X) 的死循環。
              3. **【懸浮窗狀態顯示修正 (消除廣告監控假性卡死)】**：
                 - 僅在真正處於 AD_WATCHING 狀態時才顯示「[廣告監控] 播放中」；巡邏狀態下一律顯示當前分頁或巡邏狀態，不再因文字含「廣告」二字誤導。
              4. **【全螢幕廣告倒數防長週期計時器干擾】**：
                 - 畫面存在長週期定時器時，純數字嚴格排除，杜絕頂部「26 分鐘 44 秒」中的 44 被誤判為全螢幕廣告倒數。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.56)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.56
            name: "散步趣助手 v1.15.56 (賓果冷卻識別與5次開格上限直接退出、主畫面Banner誤判LINE促銷彈窗根除、懸浮窗廣告監控假性卡死修復)"
            body: |
              **散步趣助手 v1.15.56 (Run #${{ github.run_number }}) - 升級自 v1.15.55 (相容歷代版本 v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49)**
              1. **【每日賓果開格冷卻識別與 5 次上限直接退出機制】**：
                 - 頂部冷卻文字識別：若出現「距離下次抽選還有」、「\d+分鐘」，精準判定開格處於 30 分鐘冷卻中，不再盲目點擊；
                 - 移除中途計數抹除：刪除廣告狀態切換時清零開格計數的缺陷，開格嘗試次數精準維持至關閉視窗；
                 - 當開格達 5 次或冷卻中且下方無任何 Get 連線獎勵時，立即點擊右上角 (X) 關閉視窗並推進至抽抽樂，徹底解決卡死問題。
              2. **【主畫面商業廣告 Banner 誤判 LINE 全螢幕促銷彈窗根除】**：
                 - 主畫面特徵一票否決：若畫面出現四大分頁標籤、步數資訊（今天的步數、距離下次累積還有）或底部導覽列，100% 一票否決促銷彈窗；
                 - 關鍵字精準收緊：移除單獨的「快來領取」等通用詞，必須為邀請好友專屬上下文；
                 - 杜絕每秒無限重複點擊右上角 (X) 的死循環。
              3. **【懸浮窗狀態顯示修正 (消除廣告監控假性卡死)】**：
                 - 僅在真正處於 AD_WATCHING 狀態時才顯示「[廣告監控] 播放中」；巡邏狀態下一律顯示當前分頁或巡邏狀態，不再因文字含「廣告」二字誤導。
              4. **【全螢幕廣告倒數防長週期計時器干擾】**：
                 - 畫面存在長週期定時器時，純數字嚴格排除，杜絕頂部「26 分鐘 44 秒」中的 44 被誤判為全螢幕廣告倒數。
              6. **【四大分頁切換 Y 軸基準線下修】**：
                 - 基準線下修至 12.5% sh，精準命中分頁文字本體，避開黑色指示條與下方廣告橫幅。
            files: LineWalkAutoAd.apk
            prerelease: false
