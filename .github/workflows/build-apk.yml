name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.27 (根除左上角靜音喇叭誤判略過鈕死循環、鎖定右上角唯一合法廣告關閉/略過區、黑名單防護防空點、確保順利獲得金幣 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.27 (Run #${{ github.run_number }})**
              1. **【重大修復：徹底根除左上角靜音喇叭/贊助商圖示誤判死循環，金幣 100% 順暢入帳】**：
                 - **深入定位**：先前版本在 `detectCornerSkipButton` 與 `detectCornerGeometricX` 掃描區域中包含了左上角。然而現代影音廣告（Meta Audience Network "Ad 1 of 2"、Google AdMob、Unity 等）左上角固定為「聲音開關/靜音喇叭 (Speaker Mute)」或「贊助商商標/商店連結」，其喇叭幾何特徵與「▶|」極度相似。
                 - **致命症狀**：先前助手誤將左上角靜音喇叭判定為「略過鈕」，每一 Tick 連續狂點左上角靜音圖示達 15 次，甚至因誤觸贊助商圖示跳出至 Google Play 商店，最終於 36 秒超時遭強制中斷拉回遊戲，導致廣告 SDK 未回傳獎勵、散步趣未發放金幣（進去前 x2、出來仍是 x2）。
                 - **徹底根治**：全面移除幾何偵測器與角落盲點之左上角區域，嚴格鎖定**右上角**為影音廣告唯一合法的「▶|」略過鈕與「✕」關閉鈕位置，100% 杜絕誤觸靜音喇叭與 Google Play 外部跳轉，確保廣告自然播畢或合法略過，金幣順暢領取入帳！
              2. **【智慧黑名單防護機制：同一座標點擊達 3 次未關閉即刻黑名單】**：
                 - 在 `recordAndClick` 中建立嚴格黑名單守衛：任何偵測目標（包含幾何略過鈕、幾何 X、OCR 關閉）若在同支廣告內點擊同一座標滿 3 次（約 5~6 秒）畫面仍未關閉，強制加入黑名單，徹底消滅無窮死循環空點，自動轉入其他偵測與倒數機制。
              3. **【延長單次廣告守護寬限期至 48 秒】**：
                 - 現代 30 秒高額影音廣告常具備 3~5 秒緩衝與 5 秒結算卡片，先前 32 秒上限（+4s 看門狗）常於 36 秒在結算畫面提早截斷廣告。將預設超時上限提升至 48 秒（看門狗 52 秒），確保所有影音廣告自然播畢並取得 Meta / Google 獎勵回調。
              4. **【精密優化：頂部安全禁區聚焦螢幕中央通知與動態島，放行兩側角落廣告控制鈕】**：
                 - 精密校正頂部安全防護禁區：鎖定螢幕中央水平區域 (`x in 18%..82% && y < 8%`) 嚴格攔截所有系統通知、LINE 懸浮訊息與即時動態（動態島/靈動膠囊）。
                 - 兩側角落 (`x > 82%` 或 `x < 18%`) 放行廣告右上角/左上角關閉 (X) 與「▶|」略過鈕，杜絕因 blanket ban 誤阻廣告操作。
                 - 廣告關閉處理器 (`AdCloserHandler`) 主動點擊時全面標記 `allowTopSafeZone = true`，確保角落按鈕 100% 成功派發手勢。
              5. **【系統頂部通知與即時動態嚴格防誤點】**：
                 - 幾何關閉按鈕偵測拉升至避開狀態列，重構選單判定，絕不誤判通知文字或賓果「抽選」為選單，廢除齒輪盲點，改以安全返回鍵退出。
              6. **【每日賓果重構與徹底消除開關輪迴】**：
                 - 處於賓果彈窗時完全停用宣傳幾何 X 偵測，消除開關輪迴。
                 - 嚴格循序執行：先點擊橘色「立即開啟賓果格」直到冷卻或今日上限，再依序掃描領取所有直欄「Get」獎勵並鎖定狀態。
              7. **【第三方廣告容器全面豁免與無縫監控】**：
                 - 擴充 Meta Audience Network (`com.facebook.katana`, `com.facebook.orca`)、Google AdMob (`com.google.android.gms`)、Unity、AppLovin 等 12 大套件。
                 - 前景為廣告套件時 100% 阻斷返回鍵，確保廣告完整播放並順利領取獎勵。
              8. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              9. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
