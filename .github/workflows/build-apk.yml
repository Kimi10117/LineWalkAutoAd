name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.70
          git push -f origin latest-apk || true
          git push -f origin v1.15.70 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.70 (修復掛機卡在抽抽樂 BIG 8獎中獎彈窗、左上角誤點跳轉瀏覽器、LINE宣傳關閉連點 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.70 (Run #${{ github.run_number }}) - 根除掛機卡在抽抽樂「BIG 8獎 100 枚金幣中獎囉！」結果彈窗的無限循環、封鎖 InMobi 廣告左上角幾何 X 連續誤點跳轉瀏覽器、限制 LINE 宣傳廣告關閉 (X) 連點 35 次 (相容歷代版本 v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復掛機卡在抽抽樂「BIG 8獎 中獎囉！」結果彈窗】**：
                 - 從廣告返回時抽獎箱開啟動畫遮住按鈕，被誤判為「50抽/免費抽/5抽皆反灰」而過早標記抽抽樂完成，之後一直點被模態彈窗遮擋的背景右上角 (X) 與底部【集點】；
                 - 現在偵測到前景仍是中獎結果彈窗時，自動撤銷完成標記並優先點擊 [x1 獲得] 或結果彈窗 [關閉]；結束判定改為至少連續 3 個空 Tick；
                 - 中獎結果辨識新增「頂部 N獎 + [x1 獲得] / [關閉]」複合特徵與實心綠色膠囊像素特徵，懸浮膠囊遮住標題時仍能正確辨識；
                 - 關閉脫困流程新增：優先點前景 [關閉] -> 右上角 (X) -> 遮罩 -> 【集點】 -> 安全返回鍵，不再無限循環。
              2. **【封鎖左上角幾何 X 連續誤點跳轉瀏覽器】**：同一支廣告點左上角觸發外部跳轉後立即封鎖整個左上角，非 Meta 廣告左上角最多嘗試 2 次。
              3. **【限制 LINE 宣傳廣告關閉 (X) 連點】**：最多嘗試 2 次並檢查黑名單，未關閉即交由標準廣告關閉流程處理。
              4. **【廣告倒數秒數防誤判】**：頂部純數字倒數必須位於左右兩側角落，避免將「BIG 8獎」的「8」誤認為廣告倒數。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.70)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.70
            name: "散步趣助手 v1.15.70 (修復掛機卡在抽抽樂 BIG 8獎中獎彈窗、左上角誤點跳轉瀏覽器、LINE宣傳關閉連點)"
            body: |
              **散步趣助手 v1.15.70 (Run #${{ github.run_number }}) - 根除掛機卡在抽抽樂「BIG 8獎 100 枚金幣中獎囉！」結果彈窗的無限循環、封鎖 InMobi 廣告左上角幾何 X 連續誤點跳轉瀏覽器、限制 LINE 宣傳廣告關閉 (X) 連點 35 次 (相容歷代版本 v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修復掛機卡在抽抽樂「BIG 8獎 中獎囉！」結果彈窗】**：
                 - 從廣告返回時抽獎箱開啟動畫遮住按鈕，被誤判為「50抽/免費抽/5抽皆反灰」而過早標記抽抽樂完成，之後一直點被模態彈窗遮擋的背景右上角 (X) 與底部【集點】；
                 - 現在偵測到前景仍是中獎結果彈窗時，自動撤銷完成標記並優先點擊 [x1 獲得] 或結果彈窗 [關閉]；結束判定改為至少連續 3 個空 Tick；
                 - 中獎結果辨識新增「頂部 N獎 + [x1 獲得] / [關閉]」複合特徵與實心綠色膠囊像素特徵，懸浮膠囊遮住標題時仍能正確辨識；
                 - 關閉脫困流程新增：優先點前景 [關閉] -> 右上角 (X) -> 遮罩 -> 【集點】 -> 安全返回鍵，不再無限循環。
