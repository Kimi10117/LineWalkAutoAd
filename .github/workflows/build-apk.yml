name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk LineWalkAutoAd.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git tag -f v1.15.82
          git push -f origin latest-apk || true
          git push -f origin v1.15.82 || true

      - name: Publish APK to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.82 (打破抽抽樂退出死循環、外部拉回保留觀看狀態與網路異常退避升級 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.82 (Run #${{ github.run_number }}) - 打破抽抽樂退出死循環、外部拉回保留觀看狀態與網路異常退避升級 (相容歷代版本 v1.15.81, v1.15.80, v1.15.79, v1.15.78, v1.15.77, v1.15.76, v1.15.75, v1.15.74, v1.15.73, v1.15.72, v1.15.71, v1.15.70, v1.15.69, v1.15.68, v1.15.67, v1.15.66, v1.15.65, v1.15.64, v1.15.63, v1.15.62, v1.15.61, v1.15.60, v1.15.58, v1.15.57, v1.15.56, v1.15.55, v1.15.54, v1.15.53, v1.15.52, v1.15.51, v1.15.50, v1.15.49, v1.15.48, v1.15.47, v1.15.46, v1.15.45)**
              1. **【修正抽抽樂關閉「1 -> 6 -> 1」死循環】**：
                 - 新增 `resetLotterySessionState(resetCloseAttempts = false)` 參數，`getNextPhase(PatrolPhase.LOTTERY)` 推進與第 6 次強制離場時保留關閉嘗試計數，讓第 7 次起可執行強制換分頁／返回退場並歸零，徹底打破無限迴圈。
              2. **【右上角幾何叉叉偵測收緊與重複點擊止損】**：
                 - `TemplateMatcher.detectCornerGeometricX` 右上角區域收緊至 `0.80f`，`AdCloserHandler` 分流高信心商業按鈕與幾何 X；同一幾何 X 鄰近點擊達 3 次即拉黑並解除保底關閉計時延後。
              3. **【外部 App 防護拉回保留 `AD_WATCHING` 狀態】**：
                 - `AutomationEngine.handleExternalAppGuard` 抽取 `bringGameToFrontAndRestore`，於瀏覽器／Play 商店 2 拍拉回、逾時 3 拍拉回或略過回彈桌面時維持 `EngineState.AD_WATCHING`，避免重設回主遊戲掃描。
              4. **【非預期外部瀏覽器跳轉首次即拉黑原座標】**：
                 - `AdCloserHandler.markRecentRedirect` 對非預期略過／Play 商店之按鈕（如左上角幾何 X）於首次跳轉外部瀏覽器時直接加入黑名單，防止連續跳轉網頁同時不影響同角其他有效按鈕。
              5. **【網路異常彈窗穿透偵測與離線退避】**：
                 - `OcrRecognizer` 新增 `isNetworkErrorDialog` 與網路／連線異常關鍵字並支援錯誤彈窗覆蓋於抽抽樂／每日賓果／邀請好友之上；`AutomationEngine` 關閉異常彈窗後執行 `4s`/`8s`（或熔斷 `5s`/`8s`）退避且不誤判分頁清空。
              6. **【版本號升級】**：
                 - versionCode 115 / versionName 1.15.82（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false

      - name: Publish Versioned APK to GitHub Releases (v1.15.82)
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.15.82
            name: "散步趣助手 v1.15.82 (打破抽抽樂退出死循環、外部拉回保留觀看狀態與網路異常退避升級)"
            body: |
              **散步趣助手 v1.15.82 (Run #${{ github.run_number }}) - 打破抽抽樂退出死循環、外部拉回保留觀看狀態與網路異常退避升級**
              1. **【修正抽抽樂關閉「1 -> 6 -> 1」死循環】**：
                 - 新增 `resetLotterySessionState(resetCloseAttempts = false)` 參數，`getNextPhase(PatrolPhase.LOTTERY)` 推進與第 6 次強制離場時保留關閉嘗試計數，讓第 7 次起可執行強制換分頁／返回退場並歸零，徹底打破無限迴圈。
              2. **【右上角幾何叉叉偵測收緊與重複點擊止損】**：
                 - `TemplateMatcher.detectCornerGeometricX` 右上角區域收緊至 `0.80f`，`AdCloserHandler` 分流高信心商業按鈕與幾何 X；同一幾何 X 鄰近點擊達 3 次即拉黑並解除保底關閉計時延後。
              3. **【外部 App 防護拉回保留 `AD_WATCHING` 狀態】**：
                 - `AutomationEngine.handleExternalAppGuard` 抽取 `bringGameToFrontAndRestore`，於瀏覽器／Play 商店 2 拍拉回、逾時 3 拍拉回或略過回彈桌面時維持 `EngineState.AD_WATCHING`，避免重設回主遊戲掃描。
              4. **【非預期外部瀏覽器跳轉首次即拉黑原座標】**：
                 - `AdCloserHandler.markRecentRedirect` 對非預期略過／Play 商店之按鈕（如左上角幾何 X）於首次跳轉外部瀏覽器時直接加入黑名單，防止連續跳轉網頁同時不影響同角其他有效按鈕。
              5. **【網路異常彈窗穿透偵測與離線退避】**：
                 - `OcrRecognizer` 新增 `isNetworkErrorDialog` 與網路／連線異常關鍵字並支援錯誤彈窗覆蓋於抽抽樂／每日賓果／邀請好友之上；`AutomationEngine` 關閉異常彈窗後執行 `4s`/`8s`（或熔斷 `5s`/`8s`）退避且不誤判分頁清空。
              6. **【版本號升級】**：
                 - versionCode 115 / versionName 1.15.82（保留歷代版本 APK 與發布紀錄）。
            files: LineWalkAutoAd.apk
            prerelease: false
