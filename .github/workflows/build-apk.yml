name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.24 (徹底修復賓果點完所有Get、廣告容器自動切換防誤退出、延遲盲點防跳轉商店 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.24 (Run #${{ github.run_number }})**
              1. **【重要修復：每日賓果完整點完所有 [Get] 獎勵】**：
                 - 徹底解決只點一次 Get 就跳去抽抽樂的問題。使用連續重試計數與黑名單保護，每次開格結束後或看廣告領獎後，持續檢查並循環領取所有達成之直欄 [Get] 獎勵，直到畫面上完全沒有任何 Get 可點時才判定完成並關閉賓果彈窗前往抽抽樂。
              2. **【重要修復：第三方廣告容器（Meta com.facebook.katana 等）自動切換與全域保護】**：
                 - 徹底修復點擊抽抽樂「50張抽一次」或點擊「立即開啟賓果格」進入 Meta Audience Network 廣告時，因尚未轉入廣告狀態而被誤判為外部應用並發送返回鍵的問題。
                 - 只要偵測到已知廣告套件（`com.facebook.katana`, `com.google.android.gms` 等），無條件判定為合法廣告畫面，並自動無縫切換至廣告監控狀態，絕不發送返回鍵打斷廣告播放，完整保障獎勵領取。
              3. **【重要修復：延遲廣告盲點熱區至後期，嚴防誤開 Google Play 商店】**：
                 - 將盲點角落與安全返回鍵嚴格限制於廣告播放後期（22 秒以上或已獲得獎勵）才允許發送，徹底消除廣告播放前 20 秒因盲點角落誤觸廣告贊助橫幅而頻繁跳轉至 Google Play 商店 (`com.android.vending`) 的嚴重問題。
              4. **【全面支援台灣版《LINE 散步趣》(com.linecorp.LGWKTW)】**：
                 - 完整支援台灣版套件名稱 `com.linecorp.LGWKTW` 與國際版 `com.linecorp.LGWALK`。
              2. **【懸浮視窗開始預設收折為單行膠囊 + 點擊「+」展開】**：
                 - 點擊「開始」時預設自動收折為緊湊單行膠囊，防止遮擋主畫面任何重要資訊與按鈕。
                 - 徹底重構收折佈局：移除所有固定小寬度限制，文字與狀態一律單行完整顯示，不換行、不省略截斷（零出現 ...）。
                 - 增加邊界保護與動態螢幕旋轉適應，點擊「+」即可隨時展開控制面板。
              2. **【離開散步趣 App 嚴格防誤點安全機制】**：
                 - 偵測到當前非散步趣 App 時，嚴禁在外部 App 內隨意亂點任何按鈕。
                 - 僅允許安全發送系統返回鍵 (Back) 或點擊右上角全螢幕廣告 (X)，安全拉回散步趣主畫面。
              3. **【全任務無窮循環巡邏機制】**：
                 - 一輪全任務執行完畢後不再強制停止，自動進入 5 秒冷卻計時（防風控），接著重頭重新檢查所有在 App 內勾選的啟用項目，持續循環直到使用者手動暫停。
              4. **【每日賓果點擊邏輯重構（先開格，再領 Get）】**：
                 - 嚴格依照指示：優先點擊橘色「立即開啟賓果格」直到全部開完（或冷卻/上限中）。
                 - 開格完成後，依序點擊所有連線達成之 [Get] 獎勵，直到所有直欄沒有 Get 可點後，自動點擊右上角 (X) 關閉並推進至下一項目。
              5. **【App 內新增「匯出日誌」與「複製日誌」功能】**：
                 - 在主介面新增「匯出日誌」按鈕（透過系統 Intent 分享，具備安全行數上限防止 Binder IPC 崩潰）與「複製日誌」按鈕，方便後續偵錯與回報。
              6. **【徹底修復好友送禮卡死與自動開啟收禮抽屜】**：
                 - 新增送禮次數上限檢查（偵測 5/5 或今日上限直接判定完成）。
                 - 修復滾動清單時誤清空已送清單導致短清單死循環重複點擊同一位好友的重大問題。
                 - 送禮完成後，自動點擊右上角【禮物盒】開啟收禮抽屜，依序以「直接領取(免看廣告)」與「[▶]看廣告」領取所有禮物。
              7. **【Persistent Key 簽名維護】**：
                 - 保持相同簽名金鑰，支援直接下載覆蓋安裝更新。
            files: LineWalkAutoAd.apk
            prerelease: false
