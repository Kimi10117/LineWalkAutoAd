name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== GRADLE FAILED: LAST 200 LINES OF LOG ==="
            tail -n 200 build_log.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add build_log.txt
            git commit -m "build failure log [skip ci]" || true
            git push -f origin build-error-log || true
            exit $EXIT_CODE
          fi

      - name: Rename APK for easy download
        run: |
          echo "=== Locating APK ==="
          find app/build -name "*.apk" || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk
          else
            FOUND_APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              cp "$FOUND_APK" LineWalkAutoAd.apk
            else
              echo "No APK found in app/build!"
              exit 1
            fi
          fi
          ls -la LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-apk
            name: "散步趣助手 v1.15.49 (秒速關閉 Reward granted 廣告膠囊、修復免廣告收禮插頁卡死與非遊戲狀態計數 - Run #${{ github.run_number }})"
            body: |
              **散步趣助手 v1.15.49 (Run #${{ github.run_number }})**
              1. **【秒速識別並精準點擊 [Reward granted ✕] 膠囊關閉鈕】**：
                 - 針對 YouTube MV / Google AdMob 等全螢幕廣告頂部之「Reward granted ✕」膠囊藥丸按鈕，當 OCR 捕獲「Reward granted」標籤時，精準鎖定並秒速點擊右側 `[✕]` 區域（x in 88%..96% sw, y in 4%..12% sh），無縫秒關廣告，告別無效等待。
              2. **【徹底修復好友收禮免廣告領取觸發全螢幕插頁廣告卡死】**：
                 - 點擊「直接領取(免廣告)」後同步轉入彈窗與廣告監控流程 (`TRIGGER_AD_POPUP`)，若遊戲彈出全螢幕插頁影音廣告，立即可由廣告監控流程捕獲並安全關閉，杜絕停滯在遊戲巡邏狀態 6 分鐘卡死之問題。
              3. **【獨立隔離外部應用防護計數與畫面偵測計數】**：
                 - 徹底分離 `externalAppTicks` 與 `nonGameScreenTicks`，防止遊戲內無主畫面特徵計數在每一 Tick 被外部應用防護強制歸零，使全螢幕非遊戲畫面逾時機制 (`nonGameScreenTicks >= 2`) 正常發揮作用。
              4. **【全螢幕幾何 X 關閉鈕偵測排除區最佳化】**：
                 - 校正巡邏狀態下的角落幾何 X 排除遮罩，頂部通知禁區僅作用於中央區域 (x in 18%..82% sw, y < 8% sh)，右上角高位區 (x >= 75% sw, y >= 4.0% sh) 全面放行幾何 X 偵測，精準點擊關閉頂部各類全螢幕廣告。
            files: LineWalkAutoAd.apk
            prerelease: false
