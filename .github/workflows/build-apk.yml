name: Build LineWalkAutoAd APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          if [ ! -f app/persistent.jks ]; then
            keytool -genkeypair -v -keystore app/persistent.jks -alias linewalk -keyalg RSA -keysize 2048 -validity 10000 -storepass linewalk123 -keypass linewalk123 -dname "CN=LineWalkAutoAd, OU=Dev, O=LineWalk, L=Taipei, S=TW, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/persistent.jks
            git commit -m "Lock persistent APK signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk LineWalkAutoAd.apk

      - name: Upload Compiled APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineWalkAutoAd-APK
          path: LineWalkAutoAd.apk
          if-no-files-found: error

      - name: Update Tag and Publish APK to GitHub Releases
        run: |
          git tag -f latest-apk
          git push -f origin latest-apk || true
        
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "散步趣助手 v1.13.1 (專屬修復賓果連線 [▶ Get] 點擊、專屬彈窗優先權 - Run #${{ github.run_number }})"
          body: |
            ✅ **版本：v1.13.1 (Run #${{ github.run_number }})**
            1. **【專屬修復：每日賓果 [▶ Get] 連線獎勵精準點擊】**：
               - 痛點根除：先前通用彈窗檢查優先於專屬任務彈窗，且通用按鈕辨識誤把賓果畫面上的 "x1" 糖果數量文字當作可領取按鈕，點擊後使狀態機誤入「3.廣告監控 (📺 監控廣告中...)」而無法領取連線獎勵。
               - 調整處理優先權：將「每日賓果」、「抽抽樂」、「任務」、「好友送禮」等專屬對話框判斷提升至通用彈窗之前，確保賓果畫面 100% 由專屬邏輯接管！
               - 升級賓果按鈕偵測：針對 1 BINGO (18%)、3 BINGO (39%)、5 BINGO (61%)、8 BINGO (82%) 四大直欄底端，進行高精準度紅色膠囊按鈕定位，一擊必中 [▶ Get]！
               - 解除賓果標題頂部像素限制，適配各類長螢幕/高解析度機種；並於廣告監控中加入賓果特徵識別，防呆脫離。
            2. **【徹底根除廣告與外部瀏覽器跳針死循環】**：
               - 跳轉網頁返回廣告畫面後，啟動「安全返回機制」，直接向廣告 Activity 送出返回鍵關閉廣告退回遊戲，100% 杜絕反覆跳針輪迴！
            3. **【看廣告/領獎優先選擇「獲得金幣數量最多」之選項】**：
               - 彈窗有複數按鈕時，自動解析金幣數值，依 100 > 60 > 50 > 30 > 15 > 10 > 5 > 2 > 1 降序排序，永遠點選金幣獎勵最高的按鈕！
               - 若擁有糖果，維持最高優先點「跳過廣告(糖果)」秒領獎勵。
            4. **【大幅加速廣告關閉速度，告別 60 秒漫長等待】**：
               - 將預設廣告逾時時間降至 32 秒，各類卡死或無 X 廣告 32 秒內必定自動關閉。
               - 角落幾何 X 偵測範圍擴大並支援半透明 X 放寬比對；超過 12 秒無倒數廣告定期嘗試主動返回退出。
            5. **【各項專屬功能完整運作】**：
               - 抽抽樂優先 50 抽、次選免費看廣告 1 抽、嚴禁點 5 張
               - 好友頁面自動送禮物給所有好友並「送禮物也送自己」
               - 主畫面右上角禮物盒自動接收好友回贈禮物
               - 任務全分頁自動檢查領取
            6. **持續保持 Persistent Key 簽名，支援直接覆蓋更新（免刪舊版）**。
          files: LineWalkAutoAd.apk
          prerelease: false
